<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{customer/layout/default}">


	<!-- head 삽입공간 -->
	
	<head>
	
	</head>
	
	<th:block layout:fragment="jsFile">
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	</th:block>
	
	
	<th:block layout:fragment="jsScript">
		<script th:inline="javascript">
		/* 정렬 */	
		$('.sort-by a').click(function(e){
				e.preventDefault();
				const sortValue = $(this).data('sortValue');
				const href = location.href;
				const url = new URL(href); // 현재 url를 가져오고 url 객체를 생성한다.
				const urlParams = url.searchParams; // 현재 url객체의 파라미터를 가져온다.
				urlParams.set('sortValue', sortValue);

				
				location.href = `${url.pathname}?${urlParams.toString()}`;
			});
			
			/* 페이지이동 */
			$('a.page-num').click(function(e){
				e.preventDefault();
				const currentPage = $(this).data('currentPage');
				const href = location.href; // 현재 url 가져온다.
				const url = new URL(href); // 현재 url를 가져오고 url 객체를 생성한다.
				const urlParams = url.searchParams; // 현재 url객체의 파라미터를 가져온다.
				urlParams.set('currentPage', currentPage);
				location.href = `${url.pathname}?${urlParams.toString()}`;
			});
			
			/* 등록 버튼 눌렀을 때 렌탈 계약 체크 */
			$('.addTransferBoardBtn').click(function (e) {
				  e.preventDefault();

				  const loginId = /*[[${session.loginId}]]*/"";
				  if (!loginId) {
				    location.href = '/customer/login/memberLogin';
				    return false;
				  }

				  $.ajax({
				    url: "/customer/transferBoard/getMyContracts",
				    method: "POST",
				    success: function (contracts) {
				    	console.log("받은 계약 목록:", contracts); // ← 꼭 추가해서 확인하세요
				      	if (!contracts || contracts.length === 0) {
				     	   Swal.fire({
				       		    icon: "error",
				   	  		    text: "진행 중인 렌탈 계약이 없습니다.",
				   	  	     	confirmButtonText: "확인"
				   	     });
				        return;
				      }

				      const contractOptions = {};
				      contracts.forEach(contract => {
				        // rentalContractNum을 key로, itemName을 value로 넣고 모두 문자열 처리
				        contractOptions[String(contract.rentalContractNum)] = String(contract.productInfo.productsName);
				      });

				      Swal.fire({
				        title: "등록할 상품을 선택하세요.",
				        input: "select",
				        inputOptions: contractOptions,
				        inputPlaceholder: "렌탈 계약 목록",
				        customClass: {
				            input: 'custom-swal-select'
				        },
				        showCancelButton: true,
				        confirmButtonText: "확인",
				        cancelButtonText: "취소"
				      }).then((result) => {
				        if (result.isConfirmed && result.value) {
				          const selectedContractNum = result.value;

				          Swal.fire({
				            title: "선택하신 상품을 등록하시겠습니까?",
				            text: contractOptions[selectedContractNum],
				            showCancelButton: true,
				            confirmButtonText: "등록",
				            cancelButtonText: "취소"
				          }).then((confirmResult) => {
				            if (confirmResult.isConfirmed) {
				              const form = $('<form>', {
				                method: 'POST',
				                action: '/customer/transferBoard/requestRentalInfo'
				              });

				              form.append($('<input>', {
				                type: 'hidden',
				                name: 'rentalContractNum',
				                value: selectedContractNum
				              }));

				              $('body').append(form);
				              form.submit();
				            }
				          });
				        }
				      });
				    },
				    error: function (err) {
				      console.error("계약 목록 불러오기 실패", err);
				    }
				  });
				});
		</script>
	</th:block>
	
	<!-- 페이지 삽입공간 -->
	<th:block layout:fragment="customContents">
		<div class="container mb-30">
			<div class="row justify-content-center">
				<div class="col-lg-9">
					<div class="section-title row align-items-center mt-50 mb-50">
						<h1 class="heading-2 col-6 col-lg-6">양도 하기!</h1>
						<div class="col-md-6 col-6 col-lg-6 text-end">
							<!-- 양도 글 쓰기 버튼 클릭하면 계약 중인 렌탈 상품이 있는 지 체크하고 있으면 등록 페이지로 이동 -->
							<a th:href="@{/customer/transferBoard/addTransferBoard}" 
							   class="addTransferBoardBtn btn btn-lg btn-success w-30 rounded fs-5 hover-up text-white">
							   글쓰기
							</a>
						</div>
					</div>
					<div class="row mb-50">
						<div class="search-form col-4">
							<form th:action="@{/customer/transferBoard/transferBoardList}" method="get">
								<input type="text" name="searchValue" th:value="${searchValue}"
									   placeholder="찾는 상품명을 입력해주세요." />
								<button class="transfer-search" type="submit">
									<i class="fi-rs-search"></i>
								</button>
							</form>
						</div>
					</div>
					<div class="shop-product-fillter">
						<div class="totall-product">
							<h5 class="text-body">
								양도 상품
								<span th:text="${'&emsp;' + contentRowCount}"
									  class="text-brand">5
								</span> 
								<span>건</span>
							</h5>
						</div>
						<th:block th:if="${contentRowCount > 0}">
							<div class="d-flex align-items-center gap-3 flex-wrap sort-by-product-area">
  								<div class="sort-by-cover">
									<div class="sort-by">
							      		<a href="#"
								           th:data-sort-value="recentReg"
								           th:classappend="${sortValue} == null or ${sortValue} == 'recentReg' ? ' text-primary fw-bold fs-6' : ' text-dark fw-medium'"
								           class="text-decoration-none">
								        	<span>최근등록순</span>
								     	</a>
								    </div>
						  		</div>
								<div class="sort-by-cover">
							    	<div class="sort-by">
							      		<a href="#"
								           th:data-sort-value="highPrice"
								           th:classappend="${sortValue} == 'highPrice' ? ' text-primary fw-bold fs-6' : ' text-dark fw-medium'"
								           class="text-decoration-none">
								        	<span>높은가격순</span>
							      		</a>
					    			</div>
						  		</div>
								<div class="sort-by-cover">
							    	<div class="sort-by">
							      		<a href="#"
								           th:data-sort-value="rowPrice"
								           th:classappend="${sortValue} == 'rowPrice' ? ' text-primary fw-bold fs-6' : ' text-dark fw-medium'"
								           class="text-decoration-none">
								        	<span>낮은가격순</span>
								      	</a>
								    </div>
					 			</div>
								<div class="sort-by-cover">
							    	<div class="sort-by">
							      		<a href="#"
								           th:data-sort-value="deadline"
								           th:classappend="${sortValue} == 'deadline' ? ' text-primary fw-bold fs-6' : ' text-dark fw-medium'"
								           class="text-decoration-none">
								        	<span>마감임박순</span>
								      	</a>
						    		</div>
						  		</div>
							</div>
						</th:block>
					</div>
					<div class="row product-grid">
						<th:block th:if="${!#lists.isEmpty(transferBoardList)}"
							th:each="l : ${transferBoardList}">
							<div class="col-lg-3 col-md-4 col-12 col-sm-6">
								<div class="product-cart-wrap mb-30">
									<div class="product-img-action-wrap">
										<div class="product-img product-img-zoom">
											<a th:href="@{/customer/transferBoard/transferBoardDetail(transferBoardNum=${l.transferBoardNum})}">
												<img class="img-main"
													 th:src="@{${l.uploadImage}}"
													 alt="이미지" />
											</a>
										</div>
									</div>
									<div class="product-content-wrap">
										<div class="product-category d-flex justify-content-between">
											<a th:text="${l.productInfoCategory.smCategory}" href="shop-grid-right.html">TV</a>
										</div>
										<h2 th:text="${l.transferTitle}">
											<a href="shop-product-right.html">계약 2년 남은 TV 양도 원합니다.</a>
										</h2>
										<div>
											<span th:text="${l.customerMember.custName}" class="font-small text-muted">작성자
												<a href="vendor-details-1.html">우에하라 아유무</a>
											</span>
										</div>
										<div class="product-card-bottom">
											<div class="product-price">
												<span>💸월렌탈료</span> 
												<span th:text="|₩${#numbers.formatInteger(l.rentalFee, 3, 'COMMA')}">85,000원</span>
											</div>
										</div>
										<div class="product-card-bottom">
											<div class="product-price">
												<span>💰지원금</span> 
												<span th:text="|₩${l.individualGrants >= 1000 ? #numbers.formatInteger(l.individualGrants, 3, 'COMMA') : l.individualGrants}">1,000원</span>
											</div>
										</div>
										<div class="product-card-bottom">
											<p>등록일</p>
											<span th:text="${l.registerDate}">2025-04-09</span>
											<div></div>
											<th:block th:switch="${l.transferRentalProcsssingStatus}">
												<span th:case="${'2.양도계약진행'}" class="stock-status in-stock">
													진행중 </span>
												<span th:case="${'3.양도계약완료'}" class="stock-status out-stock">
													마감 </span>
											</th:block>
										</div>
									</div>
								</div>
							</div>
						</th:block>
						<div th:if="${contentRowCount < 1}"
							 class="mt-100" style="text-align: center;">
							<p>게시글이 없습니다.</p>	
						</div>
					</div>
					<div class="pagination-area mt-30 mb-50">
						<nav aria-label="Page navigation example">
							<ul class="pagination justify-content-center">
								<!-- 이전페이지 이동 -->
								<li id="prev-page" class="page-item" th:classappend="${startPageNum < 10} ? 'disabled'">
									<a class="page-link" th:classappend="${startPageNum < 10} ? 'bg-white'"
										th:href="@{/customer/transferBoard/transferBoardList(currentPage=${startPageNum - 1})}">
										<i class="material-icons md-first_page"></i>
									</a>
								</li>
								<!-- 페이지 이동  -->
								<th:block th:each="num : ${#numbers.sequence(startPageNum, endPageNum)}"
										  th:if="${contentRowCount > 0}">
									<li class="page-item"
										th:classappend="${num eq currentPage} ? 'active disabled'">
										<a class="page-link page-num"
										   href="#"
										   th:text="${num < 10 ? '0' + num : num}"
										   th:data-current-page="${num}">01</a>
									</li>
								</th:block>
								<!-- 다음페이지 이동 -->
								<li id="next-page" class="page-item" th:classappend="${(startPageNum + 10) > lastPage} ? 'disabled'">
									<a class="page-link" th:classappend="${(startPageNum + 10) > lastPage} ? 'bg-white'"
									   th:href="@{/customer/transferBoard/transferBoardList(currentPage=${endPageNum + 1})}">
									   <i class="material-icons md-last_page"></i>
									</a>
								</li>
							</ul>
						</nav>
					</div>
				</div>
			</div>
		</div>
	</th:block> 
</html>
