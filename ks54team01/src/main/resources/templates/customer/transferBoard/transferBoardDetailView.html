<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{customer/layout/default}">

	<!-- head 삽입공간 -->
	<head>
	</head>
	
	<th:block layout:fragment="jsFile">
		<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
	</th:block>
	
	<th:block layout:fragment="jsScript">
		<script th:inline="javascript">
		$('#daumPostBtn').click(function(e){
			new daum.Postcode({
	            oncomplete: function(data) {
	                // 팝업에서 검색결과 항목을 클릭했을때 실행할 코드를 작성하는 부분.

	                // 각 주소의 노출 규칙에 따라 주소를 조합한다.
	                // 내려오는 변수가 값이 없는 경우엔 공백('')값을 가지므로, 이를 참고하여 분기 한다.
	                var addr = ''; // 주소 변수
	                var extraAddr = ''; // 참고항목 변수

	                //사용자가 선택한 주소 타입에 따라 해당 주소 값을 가져온다.
	                if (data.userSelectedType === 'R') { // 사용자가 도로명 주소를 선택했을 경우
	                    addr = data.roadAddress;
	                } else { // 사용자가 지번 주소를 선택했을 경우(J)
	                    addr = data.jibunAddress;
	                }

	                // 사용자가 선택한 주소가 도로명 타입일때 참고항목을 조합한다.
	                if(data.userSelectedType === 'R'){
	                    // 법정동명이 있을 경우 추가한다. (법정리는 제외)
	                    // 법정동의 경우 마지막 문자가 "동/로/가"로 끝난다.
	                    if(data.bname !== '' && /[동|로|가]$/g.test(data.bname)){
	                        extraAddr += data.bname;
	                    }
	                    // 건물명이 있고, 공동주택일 경우 추가한다.
	                    if(data.buildingName !== '' && data.apartment === 'Y'){
	                        extraAddr += (extraAddr !== '' ? ', ' + data.buildingName : data.buildingName);
	                    }
	                    // 표시할 참고항목이 있을 경우, 괄호까지 추가한 최종 문자열을 만든다.
	                    if(extraAddr !== ''){
	                        extraAddr = ' (' + extraAddr + ')';
	                    }
	                    // 조합된 참고항목을 해당 필드에 넣는다.
	                    document.getElementById("delAddr").value = extraAddr;
	                
	                } else {
	                    document.getElementById("delAddr").value = '';
	                }

	                // 우편번호와 주소 정보를 해당 필드에 넣는다.
	                document.getElementById('delZipNo').value = data.zonecode;
	                document.getElementById("delAddr").value = addr;
	                // 커서를 상세주소 필드로 이동한다.
	                document.getElementById("delDaddr").focus();
	            }
	        }).open();
		});
		
		$('.applyBtn').click(function(e) {
			e.preventDefault();

			const loginId = /*[[${session.loginId}]]*/"";
			if (!loginId) {
				location.href = '/customer/login/memberLogin';
			    return false;
			}
			
			
		});
		</script>
	</th:block>
	
	<!-- 페이지 삽입공간 -->
	<th:block layout:fragment="customContents">
		
        <div class="container mb-30">
            <div class="row">
                <div class="col-xl-11 col-lg-12 m-auto">
                    <div class="row">
                        <div class="col-xl-9 product-info mt-30">
                            <div class="product-detail accordion-detail" th:object="${transferBoardInfo}">
                                <!-- 모트스트랩 start -->
								<div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
									<div class="modal-dialog modal-dialog-centered">
										<div class="modal-content">
											<form id="applyTransferForm" th:action="@{/customer/transferBoard/applyTransfer}" method="post">
												<div class="modal-header">
													<h5 class="modal-title" id="staticBackdropLabel">양도 받기 신청서 작성</h5>
													<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
												</div>
												<div class="modal-body">
													<div class="row">
														<div class="form-group col-md-6">
															<select>
																<option></option>
															</select>
														</div>
														<div class="form-group col-md-6">
															<input type="hidden" name="customerSellProduct.entCeoNo" th:value="*{customerSellProduct.entCeoNo}" id="entCeoNoInput" class="form-control">
															<input type="hidden" name="customerSellProduct.entEmpId" th:value="*{customerSellProduct.entEmpId}" id="entEmpIdInput" class="form-control">
															<input type="hidden" name="sellProductsNum" th:value="*{sellProductsNum}" id="sellProductsNumInput" class="form-control">
															<input type="hidden" name="rentalContractNum" th:value="*{rentalContractNum}" id="rentalContractNumInput" class="form-control">
															<input type="hidden" name="customerContract.rentalEndDate" th:value="*{customerContract.rentalEndDate}" id="rentalContractNumInput" class="form-control">
															<input type="hidden" name="transferBoardNum" th:value="*{transferBoardNum}" id="transferBoardNumInput" class="form-control">
															<input placeholder="배송지명" class="form-control" id="delNm" name="delNm" type="text">
														</div>
													</div>
												</div>
								 				<div class="modal-footer">
									     			<button id="applyTransferBtn" type="submit" class="btn btn-primary">신청</button>
									   			</div>
											</form>
								  		</div>
									</div>
								</div>
								<!-- 모트스트랩 end -->
                                <div class="product-info row mb-50">
                                    <div class="tab-style3">
                                        <div class="entry-main-content px-3">
                                            <h2 th:text="*{transferTitle}" class="title-detail">
                                            	SK매직 올인원 정수기 양도합니다! 곧 약정 만료됩니다.
                                            </h2>
                                            <div class="product-detail-rating">
                                                <div class="product-rate-cover text-end">
                                                    <th:block th:switch="*{transferRentalProcsssingStatus}">
			                                        	<span th:case="${'2.양도계약상태'}" 
			                                        		  class="stock-status in-stock"> 진행중 </span>
			                                        	<span th:case="${'3.양도계약완료'}" 
			                                        		  class="stock-status out-stock"> 마감 </span>
			                                        </th:block>
                                                </div>
                                            </div>
                                            <div class="fs-5 row mb-3">
                                                <div class="fs-5 d-flex flex-column gap-2">
												    <div class="fs-5 d-flex flex-column gap-2 mb-3">
													    <div class="d-flex">
													        <div class="fw-semibold text-nowrap me-3" style="width: 120px;">마감일</div>
													        <div th:text="*{boardValidDate}" class="text-brand">2025-05-05</div>
													    </div>
													    <div class="d-flex">
													        <div class="fw-semibold text-nowrap me-3" style="width: 120px;">설치지역</div>
													        <div th:text="*{customerDeliveryList.delAddr}" class="text-brand">서울 영등포구 버드나루로 11길</div>
													    </div>
													    <div class="d-flex">
													        <div class="fw-semibold text-nowrap me-3" style="width: 120px;">작성자</div>
													        <div th:text="*{customerId}" class="text-brand">렌고쿠</div>
													    </div>
													</div>
												</div>
                                            </div>
                                        </div>
                                        <!-- Detail Info -->
                                    </div>
                                </div>
                                <div style="width: 100%; height: 2px; min-height: 1px; margin: 0px; background-color: rgba(112, 115, 124, 0.16);"></div>
                                <h3 class="mt-20 mb-20 ml-50">양도하는 상품</h3>
                                <div class="product-info">
                                    <div class="tab-style3">
                                        <div class="entry-main-content">
                                            <h4 th:text="*{productInfo.productsName}">삼성크리스탈 UHDTV 85인치</h4>

                                            <div class="tab-pane fade show active" id="Description">
                                                <div class="fs-5 d-flex flex-column gap-2 mt-3 mb-3">
												    <div class="d-flex">
												        <div class="fw-semibold flex-shrink-0 text-nowrap me-3" style="width: 120px;">잔여계약기간</div>
												        <div th:text="*{remainingMonths + '개월'}" class="text-brand">24개월</div>
												    </div>
												    <div class="d-flex">
												        <div class="fw-semibold flex-shrink-0 text-nowrap me-3" style="width: 120px;">렌탈료</div>
												        <div th:text="|₩*{#numbers.formatInteger(rentalFee, 3, 'COMMA')}|" class="text-brand">₩ 20,000</div>
												    </div>
												    <div class="d-flex">
												        <div class="fw-semibold flex-shrink-0 text-nowrap me-3" style="width: 120px;">지원금</div>
												        <div th:text="|₩*{individualGrants >= 1000 ? #numbers.formatInteger(individualGrants, 3, 'COMMA') : individualGrants}|" class="text-brand">₩ 20,000</div>
												    </div>
												</div>
                                                <div style="width: 100%; height: 1px; min-height: 1px; margin: 24px 0px; background-color: rgba(112, 115, 124, 0.16);"></div>
                                                <h4>기타 전달사항</h4>
                                                <p th:text="*{transferContent}">매월 첫째주에 방문케어 해주십니다!</p>
                                            	<div class="row g-3" th:if="${!#lists.isEmpty(fileList)}">
                                            		<div class="col-6 col-md-3" th:each="fl : ${fileList}" >
                                            			<img class="img-main" th:src="@{${fl.filePath}}" alt="이미지" />
                                            		</div>
                                            	</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-xl-3 primary-sidebar sticky-sidebar mt-30">
                            <div class="sidebar-widget widget-category-2 mb-30 text-center">
                                <h5 class="text-center section-title style-1 mb-30">💪 양도 신청하기</h5>
								<button type="button" class="applyBtn btn btn-primary" data-bs-toggle="modal" data-bs-target="#staticBackdrop">
									양도 신청서 작성하기
								</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
	</th:block>
	
</html>
