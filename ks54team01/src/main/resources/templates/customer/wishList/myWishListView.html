<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{customer/layout/default}">

	<!-- head 삽입공간 -->
	<head>
	</head>
	
	<th:block layout:fragment="jsFile">
	
	</th:block>
	
	<th:block layout:fragment="jsScript">
		<script th:inline="javascript">
			const viewValue = /*[[${viewValue}]]*/'';
			$('#viewValue').change(function() {
				const href = location.href; // 현재 url 가져온다.
				const url = new URL(href); // 현재 url를 가져오고 url 객체를 생성한다.
				const urlParams = url.searchParams; // 현재 url객체의 파라미터를 가져온다.
				const currentPage = urlParams.get('viewValue'); 
				if(currentPage) urlParams.set('viewValue', currentPage);
				urlParams.set('viewValue', $(this).val());
				location.href = `${url.pathname}?${urlParams.toString()}`;
			});
		</script>
	</th:block>
	
	<!-- 페이지 삽입공간 -->
	<th:block layout:fragment="customContents">
        <div class="container mb-30 mt-50">
            <div class="row">
                <div class="col-xl-10 col-lg-12 m-auto">
                    <div class="mb-50">
                        <h1 class="heading-2 mb-10">내 관심 상품</h1>
                    </div>
                    <div class="d-flex justify-content-between">
	                    <div class="mb-20">
	                        <!-- <h5 class="text-body">전체 <span class="text-brand">5</span></h5> -->
	                        <h5 class="text-body">
								전체
								<span th:text="${'&emsp;' + myWishList.size()}"
									  class="text-brand">5
								</span> 
								<span>개</span>
							</h5>
	                    </div>
	                    <div class ="mb-20">
	                        <div class = "KeepProductAutoCategory_list_category__2WYqD">
	                            <div class = "flicking-viewport" style = "user-select: none; -webkit-user-drag: none; touch-action: pan-y;">
	                                <div class="col-lg-12 col-md-12 col-12">
	                                    <select class="form-select" name="viewValue" id="viewValue">
										    <option value="all" 
										    		th:selected="${viewValue == null or viewValue == 'all'}">전체</option>
										    <option th:each="c : ${wishListCategory}"
										            th:value="${c.productInfoCategory.mdCategory}"
										            th:text="${c.productInfoCategory.mdCategory}"
										            th:selected="${c.productInfoCategory.mdCategory == viewValue}">카테고리</option>
										</select>
	                                </div>
	                            </div>
	                        </div>
	                    </div>
                    </div>

                    <div class="table-responsive shopping-summery">
                        <form action=""> 
	                        <table class="table table-wishlist">
	                            <thead>
	                                <tr class="main-heading">
	                                    <th class="custome-checkbox start" colspan = "5">
	                                        <div class="d-flex align-items-center gap-2">
								            	<div class="form-check mb-0">
								                	<input class="allCheck form-check-input" type="checkbox" name="checkbox" id="exampleCheckbox0" />
								                	<label class="allCheck form-check-label ms-2" for="exampleCheckbox0">전체 선택</label>
								            	</div>
								         	    <button type="button" class="btn btn-xs btn-outline-danger ms-3" style="display: none;">
								                	선택삭제
								            	</button>
								        	</div>
	                                    </th>
	                                </tr>
	                            </thead>
	                            <tbody>
	                               <tr th:if="${!#lists.isEmpty(myWishList)}"
			                           th:each="l, stat : ${myWishList}" class="pt-30">
	                                    <td class="custome-checkbox pl-30">
	                                        <input class="form-check-input" type="checkbox" name="checkbox"  th:id="'exampleCheckbox' + ${stat.count}" value="" />
	                                        <label class="form-check-label" th:for="'exampleCheckbox' + ${stat.count}"></label>
	                                    </td>
	                                    <td class="image product-thumbnail pt-40">
	                                    	<img th:src="@{'/user/assets/imgs/shop/' + ${l.productInfo.productsImage}}" alt="#"/>
	                                    </td>
	                                    <td class="product-des product-name">
	                                        <h4>
	                                        	<a th:text="${l.productInfo.productsName}" class="product-name" href="shop-product-right.html">삼성크리스탈 UHDTV 85인치</a>
	                                        </h4>
	                                        <span th:text="${l.productInfoCategory.mdCategory}" class="font-small ml-5 text-muted">TV / 디지털</span>
	                                        <div class="text-brand price fs-6 mt-10 mb-10" data-title="Price">
	                                        	<span>렌탈최저가: </span>
	                                        	<span th:text="${l.minimumRentalFee}">₩ 56,000 </span>
	                                        </div>
	                                        <div class="text-brand price fs-6 mt-10 mb-10">
	                                        	<span>판매최저가: </span>
	                                        	<span th:text="${l.minimumPrice}">₩ 56,000 </span>
	                                        </div>
	                                    </td>
	                                    <td class="action text-center" data-title="Remove">
	                                    	<a href="#" class="text-body"><i class="fi-rs-trash"></i></a>
	                                	</td>
	                            	</tr>
	                            </tbody>
	                        </table>
                        </form>
                    </div>
                </div>
            </div>
        </div>
	</th:block>
</html>
