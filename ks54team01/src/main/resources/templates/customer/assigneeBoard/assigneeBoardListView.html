<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{customer/layout/default}">


	<!-- head 삽입공간 -->
	
	<head>
	
	</head>
	
	
	<th:block layout:fragment="jsFile">
	
	</th:block>
	
	
	<th:block layout:fragment="jsScript">
		<script th:inline="javascript">
			$('.sort-by a').click(function(e){
				e.preventDefault();
				const sortValue = $(this).data('sortValue');
				const href = location.href;
				const url = new URL(href); // 현재 url를 가져오고 url 객체를 생성한다.
				const urlParams = url.searchParams; // 현재 url객체의 파라미터를 가져온다.
				urlParams.set('sortValue', sortValue);

				location.href = `${url.pathname}?${urlParams.toString()}`;
			});
			
			
			$('a.page-num').click(function(e){
				e.preventDefault();
				const currentPage = $(this).data('currentPage');
				const href = location.href; // 현재 url 가져온다.
				const url = new URL(href); // 현재 url를 가져오고 url 객체를 생성한다.
				const urlParams = url.searchParams; // 현재 url객체의 파라미터를 가져온다.
				urlParams.set('currentPage', currentPage);
				location.href = `${url.pathname}?${urlParams.toString()}`;
			});
			
			
			$('.addAssigneeBoardBtn').click(function(e) {
				
				const loginId = /*[[${session.loginId}]]*/"";
					if(!loginId) {
						e.preventDefault();
						location.href = '/customer/login/memberLogin';
						return false;
					}
			});
		</script>
	</th:block>
	
	<!-- 페이지 삽입공간 -->
	<th:block layout:fragment="customContents">
		<div class="container mb-30">
            <div class="row justify-content-center">
                <div class="col-lg-9">
                    <div class="section-title row align-items-center mt-50 mb-50">
                        <h1 class="heading-2 col-6 col-lg-6">양도 받기!</h1>
                        <div class="col-md-6 col-6 col-lg-6 text-end">
							<a th:href="@{/customer/assigneeBoard/addAssigneeBoard}" class="addAssigneeBoardBtn btn btn-lg btn-success rounded fs-5 hover-up text-white">
								글쓰기
							</a>
						</div>
                    </div>
                    <div class="row mb-50">
                        <div class="search-form col-4">
                            <form th:action="@{/customer/assigneeBoard/assigneeBoardList}" method="get">
                                <input type="text" name="searchValue" th:value="${searchValue}" 
                                	   placeholder="게시글 검색어를 입력해주세요." />
                                <button type="submit"><i class="fi-rs-search"></i></button>
                            </form>
                        </div>
                    </div> 
                    <div class="shop-product-fillter d-flex col-lg-12">
						<div class="totall-product">
							<h5 class="text-body">
								양수 상품
								<span class="text-brand">&emsp;
									<span th:text="${contentRowCount}">5</span>
								</span>
								<span>건</span>
							</h5>
						</div>
						<th:block th:if="${contentRowCount > 0}">
							<div class="d-flex align-items-center gap-3 flex-wrap sort-by-product-area">
  								<div class="sort-by-cover">
									<div class="sort-by">
							      		<a href="#"
								           th:data-sort-value="recentReg"
								           th:classappend="${sortValue} == null or ${sortValue} == 'recentReg' ? ' text-primary fw-bold fs-6' : ' text-dark fw-medium'"
								           class="text-decoration-none">
								        	<span>최근등록순</span>
								     	</a>
								    </div>
						  		</div>
								<div class="sort-by-cover">
							    	<div class="sort-by">
							      		<a href="#"
								           th:data-sort-value="deadline"
								           th:classappend="${sortValue} == 'deadline' ? ' text-primary fw-bold fs-6' : ' text-dark fw-medium'"
								           class="text-decoration-none">
								        	<span>마감임박순</span>
								      	</a>
						    		</div>
						  		</div>
							</div>
						</th:block>
					</div>
                    <div class="product-list mb-50 col-lg-12">
                        <th:block th:if="${!#lists.isEmpty(assigneeBoardList)}"
								  th:each="l : ${assigneeBoardList}">
	                        <!-- 상품1 -->
	                        <div class="product-cart-wrap border" style="box-shadow:0 6px 12px 0 rgba(0,0,0,.04);">
	                            <div class="col-lg-11 product-content-wrap mt-40 mb-2 ml-50" >
	                                <div class="d-flex justify-content-between align-items-start">
		                                <h4 class="mb-0 flex-grow-1">
		                                	<a th:text="${#strings.isEmpty(l.productName) ? '상관없음' : l.productName}" 
		                                	   th:href="@{/customer/assigneeBoard/assigneeBoardDetail(assigneeBoardNum=${l.assigneeBoardNum})}"
		                                	   class="text-decoration-none text-dark">
	                                			그램 프로 노트북 16인치 (옵시디안 블랙)
		                                	</a>
		                                </h4>
                                   	</div>
	                                <div class="product-rate-cover">
	                                    <span th:text="${l.productInfoCategory.smCategory}" class="font-small text-muted">TV/디지털</span>
	                                </div>
	                                <div class="mt-3 mb-4">
                                    	<div class="row g-4">
	                                     	<div class="col-12">
	                                     		<span class="fw-normal text-primary me-2" style="font-size: 18px; padding-right: 10px;">희망설치지역</span>
	                                     		<span th:text="${l.desiredInstallArea}" 
	                                     			  class="text-dark" style="font-size: 20px; word-break: keep-all;">전주</span>
	                                     	</div>
	                                    	<div class="col-5">
	                                        	<span class="fw-normal text-primary me-2" style="font-size: 18px; padding-right: 10px;">희망렌탈료</span>
	                                        	<span th:text="|₩${#numbers.formatInteger(l.rentalFee, 3, 'COMMA') + ' 이하'}" 
	                                        	      class="text-dark" style="font-size: 20px; word-break: keep-all;">상관없음</span>
	                                     	</div>
		                                    <div class="col-5">
		                                        <span class="fw-normal text-primary me-2" style="font-size: 18px; padding-right: 10px;">희망계약기간</span>
		                                        <span th:text="${l.remainingMonths} + '개월 이하'" 
		                                        	  class="text-dark" style="font-size: 20px; word-break: keep-all;">상관없음</span>
		                                    </div>
                                     	</div>
                                	</div>
	                                <div class="board d-flex justify-content-end gap-5">
									    <div class="d-flex">
									        <p class="mb-0 me-2 fw-semibold">등록일</p>
									        <p class="mb-0 fw-bold" th:text="${l.registerDate}">2025-04-09</p>
									    </div>
									    <div class="d-flex">
									        <p class="mb-0 me-2 fw-semibold">마감일</p>
									        <p class="mb-0 fw-bold" th:text="${l.boardValidDate}">2025-04-09</p>
									    </div>
									</div>
	                            </div>
	                        </div>
                        </th:block>
                        <div th:if="${contentRowCount < 1}"
							 class="mt-100" style="text-align: center;">
							<p>게시글이 없습니다.</p>	
						</div>
                    </div>
                    <div class="pagination-area mt-30 mb-50">
						<nav aria-label="Page navigation example">
							<ul class="pagination justify-content-center">
								<!-- 이전페이지 이동 -->
								<li id="prev-page" class="page-item" th:classappend="${startPageNum < 10} ? 'disabled'">
									<a class="page-link" th:classappend="${startPageNum < 10} ? 'bg-white'"
										th:href="@{/customer/assigneeBoard/assigneeBoardList(currentPage=${startPageNum - 1})}">
										<i class="material-icons md-first_page"></i>
									</a>
								</li>
								<!-- 페이지 이동  -->
								<th:block th:each="num : ${#numbers.sequence(startPageNum, endPageNum)}"
										  th:if="${contentRowCount > 0}">
									<li class="page-item"
										th:classappend="${num eq currentPage} ? 'active disabled'">
										<a class="page-link page-num"
										   href="#"
										   th:text="${num < 10 ? '0' + num : num}"
										   th:data-current-page="${num}">01</a>
									</li>
								</th:block>
								<!-- 다음페이지 이동 -->
								<li id="next-page" class="page-item" th:classappend="${(startPageNum + 10) > lastPage} ? 'disabled'">
									<a class="page-link" th:classappend="${(startPageNum + 10) > lastPage} ? 'bg-white'"
									   th:href="@{/customer/assigneeBoard/assigneeBoardList(currentPage=${endPageNum + 1})}">
									   <i class="material-icons md-last_page"></i>
									</a>
								</li>
							</ul>
						</nav>
					</div>
                </div>
            </div>
        </div>
	</th:block> 
</html>
