<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{customer/layout/default}">
	
	<head>
	
	</head>
	
	<th:block layout:fragment="jsFile">
	</th:block>
	
	
	
	
	<th:block layout:fragment="jsScript">
		<script type="text/javascript" th:inline="javascript">
			
			function updateTotalPrice(card) {
			    const unitPrice = parseInt(card.querySelector(".unit-price")?.value || 0);
			    const quantity = parseInt(card.querySelector(".qty-val")?.value || 1);
			    const totalInput = card.querySelector(".total-price-input");
			    const display = card.querySelector(".price-display");
	
			    const total = unitPrice * quantity;
	
			    if (totalInput) totalInput.value = total;
			    if (display) display.textContent = total.toLocaleString() + "원";
			}

			
		
			document.addEventListener("DOMContentLoaded", function () {
	
			    // 개월 클릭 이벤트
			    document.querySelectorAll("ul.list-filter li").forEach(function (item) {
			        item.addEventListener("click", function (e) {
			            e.preventDefault();
	
			            const selectedPrice = item.getAttribute("data-price");
	
			            const card = item.closest(".card");
			            const priceDisplay = card.querySelector(".price-display");
			            const unitPriceInput = card.querySelector(".unit-price");
	
	
			            if (selectedPrice && priceDisplay && unitPriceInput) {
			                const formatted = Number(selectedPrice).toLocaleString() + "원";
			                priceDisplay.textContent = formatted;
			                unitPriceInput.value = selectedPrice;
			                
			                updateTotalPrice(card);
			            }
	
			            card.querySelectorAll("ul.list-filter li").forEach(li => li.classList.remove("active"));
			            item.classList.add("active");
			        });
			    });
	
			    // 수량 증가/감소
			    document.querySelectorAll(".card").forEach(function (card) {
			        const input = card.querySelector("input.qty-val");
			        const up = card.querySelector(".qty-up");
			        const down = card.querySelector(".qty-down");
	
			        if (up) {
			            up.addEventListener("click", function (e) {
			                e.preventDefault();
			                let val = parseInt(input.value, 10) || 1;
			                input.value = val + 1;
			                updateTotalPrice(card);
			            });
			        }
	
			        if (down) {
			            down.addEventListener("click", function (e) {
			                e.preventDefault();
			                let val = parseInt(input.value, 10) || 1;
			                if (val > 1) input.value = val - 1;
			                updateTotalPrice(card);
			            });
			        }
			    });
	
			});
			
			
			document.addEventListener("DOMContentLoaded", function () {
			    document.querySelectorAll("#orderBtn").forEach(function (btn) {
			        btn.addEventListener("click", function (e) {
			            e.preventDefault();

			            const form = btn.closest("form");
			            const card = btn.closest(".card");
			            const activeLi = card.querySelector("li.active");

			            if (!activeLi) {
			                alert("옵션을 먼저 선택해주세요.");
			                return;
			            }

			            const period = activeLi.getAttribute("data-period");
			            const ceo = activeLi.querySelector('input[name="entCeoNo"]').value;
			            const emp = activeLi.querySelector('input[name="entEmpId"]').value;

			            form.querySelector(".hidden-period").value = period;
			            form.querySelector(".hidden-ceo").value = ceo;
			            form.querySelector(".hidden-emp").value = emp;

			            form.submit();
			        });
			    });
			});

				
		</script>
	</th:block>
	
	
	
	<th:block layout:fragment="customContents">
	
		<div class="container mb-30">
			<div class="row">
				<div class="col-xl-10 col-lg-12 m-auto">
					<div class="product-detail accordion-detail">
						<div class="row mb-50 mt-30">
							<div class="col-md-5 col-sm-12 col-xs-12 mb-md-0 mb-sm-5">
								<div class="detail-gallery">
									<span class="zoom-icon"><i class="fi-rs-search"></i></span>
									<!-- MAIN SLIDES -->
									<div class="product-image-slider">
										<figure class="border-radius-10">
											<img th:src="@{/user/assets/imgs/shop/noteBook_main.avif}"
												alt="product image" />
										</figure>
										<figure class="border-radius-10">
											<img th:src="@{/user/assets/imgs/shop/noteBook1.avif}"
												alt="product image" />
										</figure>
										<figure class="border-radius-10">
											<img th:src="@{/user/assets/imgs/shop/noteBook3.avif}"
												alt="product image" />
										</figure>
										<figure class="border-radius-10">
											<img th:src="@{/user/assets/imgs/shop/noteBook4.avif}"
												alt="product image" />
										</figure>
										<figure class="border-radius-10">
											<img th:src="@{/user/assets/imgs/shop/noteBook5.jpg}"
												alt="product image" />
										</figure>
										<figure class="border-radius-10">
											<img th:src="@{/user/assets/imgs/shop/noteBook2.avif}"
												alt="product image" />
										</figure>
										<figure class="border-radius-10">
											<img th:src="@{/user/assets/imgs/shop/noteBook6.avif}"
												alt="product image" />
										</figure>
									</div>
									<!-- THUMBNAILS -->
									<div class="slider-nav-thumbnails">
										<div>
											<img th:src="@{/user/assets/imgs/shop/noteBook_main.avif}"
												alt="product image" />
										</div>
										<div>
											<img th:src="@{/user/assets/imgs/shop/noteBook1.avif}"
												alt="product image" />
										</div>
										<div>
											<img th:src="@{/user/assets/imgs/shop/noteBook3.avif}"
												alt="product image" />
										</div>
										<div>
											<img th:src="@{/user/assets/imgs/shop/noteBook4.avif}"
												alt="product image" />
										</div>
										<div>
											<img th:src="@{/user/assets/imgs/shop/noteBook5.jpg}"
												alt="product image" />
										</div>
										<div>
											<img th:src="@{/user/assets/imgs/shop/noteBook2.avif}"
												alt="product image" />
										</div>
										<div>
											<img th:src="@{/user/assets/imgs/shop/noteBook6.avif}"
												alt="product image" />
										</div>
									</div>
								</div>
								<!-- End Gallery -->
							</div>
							<div class="col-md-7">
								<div class="detail-info pr-30 pl-30 d-flex mb-30">
	
									<h2 class="title-detail"	>LG 그램 Pro</h2>
									<div class="product-extra-link2">
										<a aria-label="Add To Wishlist" class="action-btn hover-up"
											href="shop-wishlist.html"><i class="fi-rs-heart"></i></a>
									</div>
	
	
	
								</div>
								<!-- Detail Info -->
	
								<!--  -->
								<div class="overflow-auto" style="height: 400px;">
									<th:block th:each="l : ${productDetailByProd}">
										<th:block th:each="el : ${l.entCeo}">
											
											<div class="card col-sm-12">
												<div class="mt-15 ml-10">
													<div id="vendorInfo">
														<div class="vendor-logo d-flex mb-15">
															<div class="vendor-name">
																<h6>
																	<span class="text-brand" style="font-weight: bold;"
																		th:text="${el.entNm}">레탈업체</span>
																</h6>
															</div>
														</div>
														<ul class="list-filter size-filter font-small mb-15 ">
															<th:block th:each="sl : ${l.customerSellProduct}">
																<li th:if="${el.entCeoNo eq sl.entCeoNo}" th:attr="data-period=${sl.period}, data-price=${sl.finalPrice}">
																	<a href="#" th:text="${#strings.equals(sl.period, '0') ? '일시불' : (sl.period) + '개월'}">일시불</a>
																	<input type="hidden" name="entCeoNo" th:value="${sl.entCeoNo}">
																	<input type="hidden" name="entEmpId" th:value="${sl.entEmpId}">
																</li>
															</th:block>
														</ul>
													</div>
												</div>
												<form th:action="@{/customer/payment/order}" method="get">
													<!-- 가격 표시 영역 -->
													<span class="current-price mb-70 price-display" style="font-size: 25px">선택안함</span>
													<input type="hidden" class="unit-price" name="prodUnitPrice" value="0" />
													<input type="hidden" class="total-price-input" name="totalPrice" value="0" />
													<input type="hidden" class="total-price-input" name="managerId" th:value="${l.managerId}" />
													<input type="hidden" name="productsName" th:value="${l.productsName}" />
													<input type="hidden" name="period" class="hidden-period">
												    <input type="hidden" name="entCeoNo" class="hidden-ceo">
												    <input type="hidden" name="entEmpId" class="hidden-emp">
													
													
													<input type="hidden" th:value="${l.managerId}" />

													

													<div class="mt-15 ml-10">
														<div class="detail-extralink">
															<div class="detail-qty border radius">
																<a href="#" class="qty-down"><i class="fi-rs-angle-small-down"></i></a>
																<input type="text" name="orderQuantity" id="quantity" class="qty-val" value="1">
																<a href="#" class="qty-up"><i class="fi-rs-angle-small-up"></i></a>
															</div>
															<div class="product-extra-link2">
																<button type="submit" id="orderBtn" class="button button-add-to-cart">
																	<i class="fi-rs-shopping-cart"></i>주문하기
																</button>
	
															</div>
														</div>
													</div>
												</form>
											</div>
										</th:block>
									</th:block>
								</div>
							</div>
	
	
							<!-- 제품상세 설명 -->
	
	
							
						</div>
					</div>
				</div>
			</div>
		</div>
	<th:block>
</html>
