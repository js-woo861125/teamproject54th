<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{customer/layout/default}">
	
	<head>
		<style>
	        .selected-lental{
	            background-color: #f1d4e8db;
	        }
	    </style>
	</head>
	
	<th:block layout:fragment="jsFile">
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	</th:block>
	
	
	
	
	<th:block layout:fragment="jsScript">
		<script type="text/javascript" th:inline="javascript">
		
			var benefitList = /*[[${benefit}]]*/ [];
			
			
			function updateTotalPrice(card) {
			    const unitPrice = parseInt(card.querySelector(".unitPrice")?.value || 0);
			    const quantity = parseInt(card.querySelector(".qty-val")?.value || 1);
			    const totalInput = card.querySelector(".totalPriceInput");
			    const display = card.querySelector(".priceDisplay");
	
			    const total = unitPrice * quantity;
	
			    if (totalInput) totalInput.value = total;
			    if (display) display.textContent = total.toLocaleString() + "원";
			}

		
			document.addEventListener("DOMContentLoaded", function () {
	
			    // 개월 클릭 이벤트
			    document.querySelectorAll("ul.list-filter li").forEach(function (item) {
			        item.addEventListener("click", function (e) {
			            e.preventDefault();
	
			            const selectedPrice = item.getAttribute("data-price");
			            const selectedPeriod = item.getAttribute("data-period");
	
			            const card = item.closest(".card");
			            const priceDisplay = card.querySelector(".priceDisplay");
			            const unitPriceInput = card.querySelector(".unitPrice");
	
	
			            if (selectedPrice && priceDisplay && unitPriceInput) {
			                const formatted = Number(selectedPrice).toLocaleString() + "원";
			                priceDisplay.textContent = formatted;
			                unitPriceInput.value = selectedPrice;
			                
			                updateTotalPrice(card);
			            }
	
			            card.querySelectorAll("ul.list-filter li").forEach(li => li.classList.remove("active"));
			            item.classList.add("active");
			            
			            const form 	= card.querySelector("form");
			            if (selectedPeriod === '0') {
			            	form.setAttribute("action", "/customer/payment/order");
			            } else {
			            	form.setAttribute("action", "/customer/payment/regularPayment");
			            }
			        });
			    });
	
			    // 수량 증가/감소
			    document.querySelectorAll(".card").forEach(function (card) {
			        const input = card.querySelector("input.qty-val");
			        const up = card.querySelector(".qty-up");
			        const down = card.querySelector(".qty-down");
	
			        if (up) {
			            up.addEventListener("click", function (e) {
			                e.preventDefault();
			                let val = parseInt(input.value, 10) || 1;
			                input.value = val + 1;
			                updateTotalPrice(card);
			            });
			        }
	
			        if (down) {
			            down.addEventListener("click", function (e) {
			                e.preventDefault();
			                let val = parseInt(input.value, 10) || 1;
			                if (val > 1) input.value = val - 1;
			                updateTotalPrice(card);
			            });
			        }
			    });
	
			
			    document.querySelectorAll("#orderBtn").forEach(function (btn) {
			        btn.addEventListener("click", function (e) {
			            e.preventDefault();

			            const form = btn.closest("form");
			            const card = btn.closest(".card");
			            const activeLi = card.querySelector("li.active");

			            if (!activeLi) {
			                alert("옵션을 먼저 선택해주세요.");
			                return;
			            }

			            const period = activeLi.getAttribute("data-period");
			            const ceo = activeLi.querySelector('input[name="entCeoNo"]').value;
			            const emp = activeLi.querySelector('input[name="entEmpId"]').value;
			            const sellProduct = activeLi.querySelector('input[name="sellProductsNo"]').value;

			            form.querySelector(".hiddenPeriod").value = period;
			            form.querySelector(".hiddenCeo").value = ceo;
			            form.querySelector(".hiddenEmp").value = emp;
			            form.querySelector(".hiddenSellProduct").value = sellProduct;
			            form.submit();
			        });
			    });
			    
			    document.querySelectorAll('.period-select-btn').forEach(function (btn) {
			        btn.addEventListener('click', function (e) {
			            e.preventDefault();
			            var li = this.closest('li');
			            var period = li.getAttribute('data-period');
			            var entCeoNo = li.getAttribute('data-entceono');
			            console.log('period', period, 'entCeoNo', entCeoNo);
			            // 가장 가까운 .card를 찾음
			            var card = this.closest('.card');
			            var benefitArea = card.querySelector('.benefit-area');

			            // benefitList에서 기간과 업체번호가 모두 일치하는 혜택 필터링
			            var filteredBenefits = benefitList.filter(function (b) {
			                return b.period == period && b.entCeoNo == entCeoNo;
			            });

			            if (benefitArea) {
			                benefitArea.innerHTML = '';
			                if (filteredBenefits.length === 0) {
			                    benefitArea.innerHTML = '<p>해당 혜택이 없습니다.</p>';
			                } else {
			                    filteredBenefits.forEach(function (b) {
			                        benefitArea.innerHTML +=
			                            '<div>' +
			                            '<p class="mb-10">' + b.benefitDetail + '</p>' +
			                            '</div>';
			                    });
			                }
			            }
			        });
			    });
			   
			    
			});
			
			
			
			
		</script>
	</th:block>
	
	
	
	<th:block layout:fragment="customContents">
	
		<div class="container mb-30">
            <div class="row">
                <div class="col-xl-11 col-lg-12 m-auto">
                    <div class="row justify-content-center">
                        <div class="col-xl-10">
                            <div class="product-detail accordion-detail">
                                <div class="row mt-40 mb-50 justify-content-between align-items-center">
                                    <div class="col-md-11 col-sm-11 col-xs-11 mb-md-0">
                                        <h2 class="title-detail" th:text="${prodNm}">[LG] 디오스 매직스페이스 양문형 냉장고 832L (화이트)</h2>
                                    </div>
                                    <div class="col-md-1 col-sm-1 col-xs-1 mb-md-0 text-end">
                                        <div class="detail-extralink">
                                            <div class="product-extra-link2 mr-15">
                                                <a aria-label="Add To Wishlist" class="action-btn hover-up" href="shop-wishlist.html"><i class="fi-rs-heart"></i></a>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="row mb-50 mt-30">
                                    <div class="col-md-6 col-sm-12 col-xs-12 mb-md-0 mb-sm-5 mb-20">
                                        <div class="detail-gallery">
                                            <span class="zoom-icon"><i class="fi-rs-search"></i></span>
                                            <!-- MAIN SLIDES -->
                                            <div class="product-image-slider">
                                                <figure class="border-radius-10">
                                                    <img src="/attachment/20250522/image/product/2318b7ab-72f9-4c39-bc05-6cb158180c75.jpg" alt="product image" />
                                                </figure>
                                            </div>
                                        </div>
                                        <!-- End Gallery -->
                                    </div>
                                    <div class="col-md-6 col-sm-12 col-xs-12">
                                        <div class="detail-info ml-5 pr-60 pl-30">
                                            <div class="row border border-3 p-4 mb-20">
                                                <div class="col-6 border-end m-10">
                                                    <h5 class="section-title style-3 mb-30">최저 월 렌탈료</h5>
                                                    <ul>
                                                        <li class="d-flex align-items-center justify-content-between">
                                                            <div class="product-price primary-color">
                                                                <span class="current-price text-brand" th:text="${#numbers.formatInteger(lowerPrice, 3, 'COMMA')}">38,000</span>
                                                            </div>
                                                            <span class="fs-3"> 원 </span>
                                                        </li>
                                                    </ul>
                                                </div>
                                                <div class="col-6 m-10">
                                                    <h5 class="section-title style-3 ml-25 mb-30">최대 렌탈 개월</h5>
                                                    <ul class="ml-25">
                                                        <li class="d-flex align-items-center justify-content-evenly">
                                                            <div class="product-price primary-color text-end">
                                                                <span class="current-price text-brand" th:text="${maxPeriod}">12</span>
                                                            </div>
                                                            <span class="fs-3"> 개월 </span>
                                                        </li>
                                                    </ul>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="detail-info ml-5 pr-60 pl-30">
                                            <div class="primary-sidebar h-75">
                                                <div class="sidebar-widget widget-vendor mb-30 bg-grey-9 box-shadow-none">
                                                    <ul class="contact-infor row align-items-center pl-20 pr-10">
                                                        <li th:if="${!#lists.isEmpty(productSpec)}" th:each="l : ${productSpec}" class="col-6 mt-10 mb-10 p-1">
                                                            <h6 th:text="${l.customerProductSpec.specNm}">상품명</h6> 
                                                            <span th:text="${l.customerModelSpecContent.specContent}">디오스 냉장고</span>
                                                        </li>
                                                    </ul>
                                                </div>
                                            </div>
                                        </div>
                                        <!-- Detail Info -->
                                    </div>
                                </div>
                                <div class="row mt-60">
                                    <div class="col-12 d-flex section-title style-1 mb-30">
                                        <h3>렌탈사 비교·선택</h3>
                                        <p>각 렌탈사의 월 렌탈료, 제휴카드혜택, A/S기간, 약정기간, 혜택 등 비교하고 선택해 보세요.</p>
                                    </div>
                                    
                                    
                                     <div class="col-12">
                                        <div class="related-products">
                                            <div class="loop-grid loop-list pr-30 mb-50">
												<th:block th:each="l : ${productDetailByProd}">
													<th:block th:each="el : ${l.entCeo}">
														
														<div class="card mb-30" style="box-shadow:0 6px 12px 0 rgba(0,0,0,.04); display: flex; flex-direction: row;">
															<div class="col-md-5" style=" border-right: 1px solid #ececec;">
																<div class="mt-15 ml-10">
																	<div id="vendorInfo">
																		<div class="vendor-logo d-flex mb-15">
																			<div class="vendor-name">
																				<h3>
																					<span class="text-brand" style="font-weight: bold;"
																						th:text="${el.entNm}">레탈업체</span>
																				</h3>
																			</div>
																		</div>
																		<ul class="list-filter size-filter font-small mb-15 ">
																			<th:block th:each="sl : ${l.customerSellProduct}">
																				<li th:if="${el.entCeoNo eq sl.entCeoNo}"
																					th:attr="data-period=${sl.period}, data-price=${sl.finalPrice}, data-entceono=${sl.entCeoNo}">
																					<a href="#" class="period-select-btn" th:text="${#strings.equals(sl.period, '0') ? '일시불' : (sl.period) + '개월'}">일시불</a>
																					<input type="hidden" name="entCeoNo" th:value="${sl.entCeoNo}">
																					<input type="hidden" name="entEmpId" th:value="${sl.entEmpId}">
																					<input type="hidden" name="sellProductsNo" th:value="${sl.sellProductsNo}">
																				</li>
																			</th:block>
																		</ul>
																	</div>
																</div>
																<form method="get">
																	<!-- 가격 표시 영역 -->
																	<span class="current-price mb-70 priceDisplay ml-10" style="font-size: 25px">선택안함</span>
																	<input type="hidden" class="unitPrice" name="prodUnitPrice" value="0" />
																	<input type="hidden" class="totalPriceInput" name="totalPrice" value="0" />
																	<input type="hidden" class="totalPriceInput" name="managerId" th:value="${l.managerId}" />
																	<input type="hidden" name="productsName" th:value="${l.productsName}" />
																	<input type="hidden" name="productsNum" th:value="${l.productsNum}" />
																	<input type="hidden" name="period" class="hiddenPeriod">
																    <input type="hidden" name="entCeoNo" class="hiddenCeo">
																    <input type="hidden" name="entEmpId" class="hiddenEmp">
																    <input type="hidden" name="sellProductsNo" class="hiddenSellProduct">
																	
																	
																	<input type="hidden" th:value="${l.managerId}" />
				
																	
				
																	<div class="mt-15 ml-10">
																		<div class="detail-extralink">
																			<div class="detail-qty border radius">
																				<a href="#" class="qty-down"><i class="fi-rs-angle-small-down"></i></a>
																				<input type="text" name="orderQuantity" id="quantity" class="qty-val" value="1" readonly>
																				<a href="#" class="qty-up"><i class="fi-rs-angle-small-up"></i></a>
																			</div>
																			<div class="product-extra-link2">
																				<button type="submit" id="orderBtn" class="button button-add-to-cart">
																					<i class="fi-rs-shopping-cart"></i>주문하기
																				</button>
					
																			</div>
																		</div>
																	</div>
																</form>
															
															</div>
															<div class="col-md-7">
																<div class="benefit-area">
													            </div>
															</div>
														</div>
													</th:block>
												</th:block>
                                            </div>
                                        </div>
                                    </div>
                                    
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
	<th:block>
</html>
