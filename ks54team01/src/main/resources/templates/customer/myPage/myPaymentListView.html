<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{customer/layout/myPageDefault}">


	<!-- head 삽입공간 -->
	
	<head>
	
	</head>
	
	<th:block layout:fragment="jsFile">
		<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	</th:block>
	
	
	<th:block layout:fragment="jsScript">
		<script type="text/javascript">




		    $('.removeDeliveryBtn').click( e => {
				e.preventDefault();
				const delNo = $(e.target).data('delNo');
				const swalWithBootstrapButtons = Swal.mixin({
					  customClass: {
						  	actions: 'w-50 justify-content-around',
					    	confirmButton: "btn btn-success",
					    	cancelButton: "btn btn-danger"
					  },
					  buttonsStyling: false
				});
				swalWithBootstrapButtons.fire({
					  title: "배송지 삭제",
					  text: "배송지를 삭제하시겠습니까?",
					  icon: "warning",
					  showCancelButton: true,
					  confirmButtonText: "삭제",
					  cancelButtonText: "취소",
					  reverseButtons: true
				}).then((result) => {
					 if (result.isConfirmed) {
						const request = $.ajax({
							url : '/customer/delivery/removeDeliveryList',
							method : 'post',
							data : { 'delNo' : delNo },
							dataType : 'json',
							async : false
						});
						request.done(isDel => {
							if(isDel){
							 	swalWithBootstrapButtons.fire({
								  title: "배송지 삭제",
								  text: "삭제되었습니다.",
								  icon: "success"
								}).then(result => {
								 	location.reload();
								});
							}else{
								swalWithBootstrapButtons.fire({
								  title: "사용중인 배송지여서 삭제 불가합니다.",
								  icon: "error"
								});
							}
						});
					} else if (
						/* Read more about handling dismissals below */
						result.dismiss === Swal.DismissReason.cancel
					) {
						swalWithBootstrapButtons.fire({
						  title: "삭제취소",
						  icon: "error"
						});
					}
				});
			});
			
			
		
		</script>
	</th:block>
	
	<!-- 페이지 삽입공간 -->
	<th:block layout:fragment="customContents">
		<!-- Modal -->
		<div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
			<div class="modal-dialog modal-dialog-centered">
				<div class="modal-content">
					<form id="addDeliveryForm" th:action="@{/customer/delivery/addDeliveryList}" method="post">
						<div class="modal-header">
							<h5 class="modal-title" id="staticBackdropLabel">배송지 등록수정</h5>
							<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
						</div>
						<div class="modal-body">
							<div class="row">
								<div class="form-group col-md-6">
									<input placeholder="배송지명" class="form-control" id="delNm" name="delNm" type="text">
								</div>
								<div class="form-group col-md-6 mt-10">
						        	<button type="button" id="daumPostBtn" class="btn col-12">주소찾기</button>
						    	</div>
								<div class="form-group col-md-12 d-flex">
									<div class="col-sm-8">
										<input placeholder="주소" class="form-control" id="delAddr" name="delAddr" type="text" readonly>
									</div>
									<div class="col-sm-4 pl-10">
										<input placeholder="우편번호" class="form-control" id="delZipNo" name="delZipNo" type="text" readonly>
									</div>
								</div>
								<div class="form-group col-md-12">
									<input placeholder="상세주소" class="form-control" id="delDaddr" name="delDaddr" type="text">
								</div>
								<div class="form-group col-md-12">
					       			<input placeholder="연락처" class="form-control" id="recipientPhone" name="recipientPhone" type="text" maxlength="13">
					   				</div>
					   			<div class="form-group col-md-12">
					      			<input placeholder="요청사항" class="form-control" id="delRequest" name="delRequest" type="text">
					  			</div>
					   			<div class="form-group col-md-12">
									<div class="custome-checkbox">
	                  					<input class="form-check-input" type="checkbox" id="agreeCheckbox" name="agreeCheckbox">
	                   					<label class="form-check-label mr-10" for="agreeCheckbox"><span>기본배송지로 설정</span></label>
										<input type="hidden" name="primaryLocation" id="primaryLocationChk">
									</div>
									<input type="hidden" name="custId" id="custId" value="personalcustid2">
									<input type="hidden" name="delNo" id="delNo">
					  			</div>
							</div>
						</div>
		 				<div class="modal-footer">
			     			<button id="addDeliveryBtn" type="submit" class="btn btn-primary">등록</button>
			   			</div>
					</form>
		  		</div>
			</div>
		</div>
		
		
		<div class="product-list mb-50">
			<th:block th:if="${!#lists.isEmpty(PaymentList)}" th:each="l : ${PaymentList}">
				<!-- 상품1 -->
				<div>
					<span th:text="${l.paymentCompletedDate}" style="font-weight:150; color: black; font-size: 20px; padding-right: 10px;">결제일</span>
				</div>
				<div class="product-cart-wrap border col-12">
					<div class="product-content-wrap mt-50 mb-30 col-8">
						<h4><a href="#" th:text="${l.prodNm}">상품명</a></h4>
						<div>
							<span th:text="|₩${#numbers.formatInteger(l.totalPrice, 3, 'COMMA')}|" style="color: black; font-size: 20px;">금액</span>
						</div>
						<div>
							<span th:text="${#strings.contains(l.rentalContractNo, 'rental') ? '렌탈' : (l.rentalContractNo == '일시불판매' ? '일반판매' : l.rentalContractNo)}" style="color: black;">계약정보</span>
						</div>
						
					</div>
					<div class="product-price d-flex col-4">
						<div class="ml-100 text-center">
							<p style="font-weight:bold; color: black;font-size: 25px; padding-right: 10px;">주문취소/환불</p>
							<a href="#" class="btn btn-xl">취소</a>
							<a href="#" class="btn btn-xl">환불</a>
						</div>
					</div>
				</div>
			</th:block>
		</div>

		
	</th:block> 
</html>
