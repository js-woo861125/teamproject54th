<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{customer/layout/default}">

	<head>
		<script src="https://js.tosspayments.com/v2/standard"></script>
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	</head>
	
	<th:block layout:fragment="jsFile">
	
	</th:block>




	<th:block layout:fragment="jsScript">
		<script type="text/javascript" th:inline="javascript">
		
			document.getElementById("contractBtn").addEventListener("click", function () {
				
				const contractNoDone = document.getElementById("rentalContractNo").value.trim();
				
				if(contractNoDone) {
					Swal.fire("계약 완료", "이미 계약이 등록된 상품입니다.", "info");
				    return;
				}
				
				
				Swal.fire({
					title: "계약 등록",
					text: "이 상품으로 계약을 진행하시겠습니까?",
					icon: "question",
					showCancelButton: true,
					confirmButtonText: "계약하기",
					cancelButtonText: "취소"
				}).then(result => {
					if (result.isConfirmed) {
						const sellProductsNo = /*[[${sellProductsNo}]]*/ '';
						const entCeoNo = /*[[${entCeoNo}]]*/ '';
						const entEmpId = /*[[${entEmpId}]]*/ '';
						const period = /*[[${period}]]*/ '';
						const orderQuantity = /*[[${orderQuantity}]]*/ '';
						
						$.ajax({
							url: "/customer/contract/addContract",
							method: "POST",
							data: {
								sellProductsNo,
								entCeoNo,
								entEmpId,
								period,
								orderQuantity
							},
							success: function (rentalContractNo) {
								// 계약 등록 성공 → rentalContractNo를 hidden input에 담음
								document.getElementById("rentalContractNo").value = rentalContractNo;
								Swal.fire("계약이 등록되었습니다.", "", "success");
							},
							error: function () {
								Swal.fire("계약 등록 실패", "서버 오류가 발생했습니다.", "error");
							}
						});
					}
				});
			});

		
			
			// 배송지 선택 버튼 클릭 시
		    document.querySelectorAll(".product-cart-wrap .btn").forEach(function (btn) {
		        btn.addEventListener("click", function (e) {
		            e.preventDefault();
	
		            const card = btn.closest(".product-cart-wrap");
		            const delNo = card.getAttribute("data-del-no");
		            const delNm = card.getAttribute("data-del-nm");
		            const delRecipientPhone = card.getAttribute("data-recipient-phone");
		            const delRequest = card.getAttribute("data-del-request");
	
		            // 선택한 값 input에 채우기
		            document.getElementById("delSelected").value = delNo;
		            document.getElementById("delName").value = delNm;
		            document.getElementById("delRecipientPhone").value = delRecipientPhone;
		            document.getElementById("delRequest").value = delRequest;
		        });
		    });
			
			
		    document.getElementById("paymentBtn").addEventListener("click", function (e) {
		    	
		    	const rentalContractNo = document.getElementById("rentalContractNo").value.trim();
		        const delNameChk = document.getElementById("delName").value.trim();
		        const delRecipientNmChk = document.getElementById("delRecipientNm").value.trim();
		    	
		    	
	            if (!rentalContractNo) {
	                Swal.fire('계약 필요', '먼저 계약을 진행해주세요.', 'warning');
	                return;
	            }
	            
	            
	            if (!delNameChk) {
	                Swal.fire('입력 오류', '배송지를 선택해주세요.', 'warning');
	                return;
	            }

	            if (!delRecipientNmChk) {
	                Swal.fire('입력 오류', '수령인명을 입력해주세요.', 'warning');
	                return ;
	            }

	            // 유효성 통과 후 결제 진행
	            requestBillingAuth();
	        });
			
			
		
		
			// ------  SDK 초기화 ------
			// @docs https://docs.tosspayments.com/sdk/v2/js#토스페이먼츠-초기화
			const clientKey = "test_ck_GePWvyJnrKvyQXaXB74bVgLzN97E";
			const customerKey = /*[[${custId}]]*/ "";
			const tossPayments = TossPayments(clientKey);
			const orderId = crypto.randomUUID().replaceAll('-', '');
	        const sellProductsNo = /*[[${sellProductsNo}]]*/"";
	        const prodNo = /*[[${productsNum}]]*/"";
	        const totalPrice = /*[[${totalPrice}]]*/"";
	        const entCeoNo = /*[[${entCeoNo}]]*/"";
	        const entEmpId = /*[[${entEmpId}]]*/"";
	        const managerId = /*[[${managerId}]]*/"";
	        const orderQuantity = /*[[${orderQuantity}]]*/"";
	        const prodUnitPrice = /*[[${prodUnitPrice}]]*/"";
	        const quantity = /*[[${quantity}]]*/"";
	        const period = /*[[${period}]]*/"";
	        const delNo = document.getElementById("delSelected").value;
	        const delRecipientNm = document.getElementById("delRecipientNm").value;
	        const delRecipientPhone = document.getElementById("delRecipientPhone").value;
	        const delRequest = document.getElementById("delRequest").value;
	        const rentalContractNo = document.getElementById("rentalContractNo").value;
			
			
			
			// 회원 결제
			// @docs https://docs.tosspayments.com/sdk/v2/js#tosspaymentspayment
			const payment = tossPayments.payment({ customerKey });
			// 비회원 결제
			// const payment = tossPayments.payment({customerKey: TossPayments.ANONYMOUS})
			// ------ '카드 등록하기' 버튼 누르면 결제창 띄우기 ------
			// @docs https://docs.tosspayments.com/sdk/v2/js#paymentrequestpayment
			async function requestBillingAuth() {
								
				const rentalContractNo = encodeURIComponent(document.getElementById("rentalContractNo").value);
				const delNo = encodeURIComponent(document.getElementById("delSelected").value);
			    const delRecipientNm = encodeURIComponent(document.getElementById("delRecipientNm").value.trim());
			    const delRecipientPhone = encodeURIComponent(document.getElementById("delRecipientPhone").value);
			    const delRequest = encodeURIComponent(document.getElementById("delRequest").value);
				
				await payment.requestBillingAuth({
					method: "CARD", // 자동결제(빌링)는 카드만 지원합니다
					successUrl: window.location.origin + "/customer/payment/billing/success?sellProductsNo=" + sellProductsNo +'&prodNo='+prodNo +'&entCeoNo=' +entCeoNo + '&entEmpId=' + entEmpId
													   + '&managerId='+managerId+'&prodUnitPrice='+prodUnitPrice+'&delNo='+delNo+'&orderQuantity='+orderQuantity+'&quantity='+quantity+'&delRecipientNm='+delRecipientNm
													   + '&delRecipientPhone='+delRecipientPhone+'&delRequest='+delRequest+'&rentalContractNo='+rentalContractNo+'&totalPrice='+totalPrice+'&period='+period, // 요청이 성공하면 리다이렉트되는 URL
					failUrl: window.location.origin + "/fail", // 요청이 실패하면 리다이렉트되는 URL
					customerEmail: "customer123@gmail.com",
					customerName: "김토스",
				});
			}
		</script>


	</th:block>



	<th:block layout:fragment="customContents">
		<div class="container mb-80 mt-50">
            <div class="row justify-content-center">
                <div class="col-lg-8 mb-40">
                    <h1 class="heading-2 mb-10">주문/결제</h1>
                 </div>
            </div>
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="table-responsive shopping-summery">
                        <table class="table table-wishlist">
                            <thead>
                                <tr class="main-heading text-center">
                                    <th scope="col">상품</th>
                                    <th scope="col">가격</th>
                                    <th scope="col">수량</th>
                                    <th scope="col">총액</th>
                                    <th scope="col">계약등록</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr class="pt-30 text-center">
                                    <td class="product-des product-name">
                                        <h6 class="product-name text-heading" th:text="${productsName}">라온 저상형 침대</h6>
                                    </td>
                                    <td class="price" data-title="Price">
                                        <h4 class="text-body" th:text="|₩ ${#numbers.formatInteger(prodUnitPrice,3,'COMMA')}|">$2.51 </h4>
                                    </td>
                                    
                                     <td class="product-des product-name">
                                        <h6 class="product-name" th:text="${orderQuantity} + '개'">n개</h6>
                                    </td>
                                    
                                    <td class="price" data-title="Price">
                                        <h4 class="text-brand" id="totalPrice" th:text="|₩ ${#numbers.formatInteger(totalPrice,3,'COMMA')}|">$2.51 </h4>
                                    </td>
                                    <td id="contract" data-title="contract">
                                    	<button type="button" id="contractBtn" class="btn">계약</button>
                                    	<input type="hidden" id="rentalContractNo" name="rentalContractNo" />
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="row mt-50">
                        <div class="col-lg-7">
                            <div class="calculate-shiping p-40 border-radius-15 border">
                                <h4 class="mb-10">배송지</h4>
                                    
								<div class="product-list mb-50">
									<div class="overflow-auto" style="height: 200px;">
										<th:block th:if="${!#lists.isEmpty(DeliveryList)}" th:each="l : ${DeliveryList}">
											<!-- 상품1 -->
											<div class="product-cart-wrap border col-12" style="box-shadow:0 6px 12px 0 rgba(0,0,0,.04);"
												 th:data-del-no="${l.delNo}" th:data-del-nm="${l.delNm}" th:data-recipient-phone="${l.recipientPhone}" th:data-del-request="${l.delRequest}">
												<div class="product-content-wrap mt-50 mb-30 col-8">
													<h4 th:text="${l.delNm}">배송지명</h4>
													<div>
														<span th:text="${l.primaryLocation}" style="color: black; font-size: 20px;">기본배송지여부</span>
													</div>
													<div>
														<span th:text="${l.delAddr}" style="color: black;">주소</span>
														<span style="color: black;">|</span>
														<span th:text="${l.delDaddr}" style="color: black;">상세주소</span>
													</div>
																				
												</div>
												<div class="product-price d-flex col-4">
													<div class=" text-center">
														<a href="#" class="btn btn-xl">선택</a>
													</div>
												</div>
											</div>
											<div th:unless="${!#lists.isEmpty(DeliveryList)}">
												<div class="product-cart-wrap border col-12" style="box-shadow:0 6px 12px 0 rgba(0,0,0,.04);" th:text="${사용가능한 배송지가 없습니다.}"></div>
											</div>
										</th:block>
									</div>
								</div>
                            </div>
                        </div>
                        <div class="col-lg-5">
                        	<div class="calculate-shiping p-40 border-radius-15 border">
	                        	<div class="product-list mb-50">
									<div class="form-group">
										<input type="text" id="delName" name="delNm" placeholder="선택한 주소" readonly>
										<input type="text" id="delRecipientNm" name="delRecipientNm" class="mt-15" placeholder="수령인명">
										<input type="hidden" id="delSelected" name="delNo">
										<input type="hidden" id="delRecipientPhone" name="delRecipientPhone">
										<input type="hidden" id="delRequest" name="delRequest">
									</div>	                        	
								</div>
                        	</div>
                        	<div>
								<button type="button" id="paymentBtn" class="btn mt-20 col-md-12">결제</button>
                        	</div>
                        </div>
                    </div>
                </div>
			</div>
		</div>
	<th:block>
</html>
