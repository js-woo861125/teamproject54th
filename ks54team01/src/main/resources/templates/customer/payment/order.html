<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{customer/layout/default}">
	
	<head>
		<script src="https://js.tosspayments.com/v2/standard"></script>
	</head>
	
	<th:block layout:fragment="jsFile">
		
	</th:block>
	
	
	
	
	<th:block layout:fragment="jsScript">
		<script type="text/javascript" th:inline="javascript">
		
		
			
		
		
			$('#paymentBtn').click(async () => {
				$('#payment-method').empty();
				$('#agreement').empty();
				main();
				$('#tossPay').modal('show');
			});
			
			async function main() {
				
				const button = document.getElementById("payment-button");
				
				 // ------  결제위젯 초기화 ------
				const clientKey = "test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm";
		        const tossPayments = TossPayments(clientKey);
		        const orderId = crypto.randomUUID().replaceAll('-', '');
		        const sellProductsNo = /*[[${sellProductsNo}]]*/"";
		        const quantity = parseInt(document.getElementById("quantity").value, 10);
		        const unitPrice  = parseInt(document.getElementById("unitPrice").value, 10);
		        
		        const totalPrice = quantity * unitPrice;
		        
		        // 회원 결제
		        const customerKey = "3g3Cca_AwBjjg837BM8Bv";
		        const widgets = tossPayments.widgets({
		          customerKey,
		        });
		    	// ------ 주문의 결제 금액 설정 ------
				await widgets.setAmount({
					currency: "KRW",
					value: totalPrice,
				});
	
				await Promise.all([
					// ------  결제 UI 렌더링 ------
					widgets.renderPaymentMethods({
						selector: "#payment-method",
						variantKey: "DEFAULT",
					}),
					// ------  이용약관 UI 렌더링 ------
					widgets.renderAgreement({ selector: "#agreement", variantKey: "AGREEMENT" }),
				]);
					        
				
		        
				// ------ '결제하기' 버튼 누르면 결제창 띄우기 ------
				button.addEventListener("click", async function () {
					await widgets.requestPayment({
						'orderId': orderId,
						orderName: "토스 티셔츠 외 2건",
						successUrl: window.location.origin + "/customer/payment/success?sellProductsNo=" + sellProductsNo + "&quantity=" + quantity + "&unitPrice=" + unitPrice,
						failUrl: window.location.origin + "/fail.html",
						customerEmail: "customer123@gmail.com",
						customerName: "김토스",
						customerMobilePhone: "01012341234",
					});
					
				});
			};
		</script>
	
		
	</th:block>
	
	
	
	<th:block layout:fragment="customContents">
	        
		<div class="modal fade custom-modal" id="tossPay" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="quickViewModalLabel" aria-hidden="true">
	        <div class="modal-dialog row justify-content-center">
	            <div class="modal-content w-75">
	                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
	                <div class="modal-body">
	                    <div class="row">
	                        <div class="col-md-12 col-sm-12 col-xs-12 mb-md-0 mb-sm-5">
	                            <div id="payment-method"></div>
	                            <div id="agreement"></div>
	                            <button class="button" id="payment-button" style="margin-top: 30px">결제하기</button>
	                        </div>
	                    </div>
	                </div>
	            </div>
	        </div>
	    </div>
	    
	    <button id="paymentBtn" type="button" class="button">button </button>
        
	<th:block>
</html>
