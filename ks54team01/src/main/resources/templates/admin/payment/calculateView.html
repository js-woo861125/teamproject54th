<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout/default}">
<head>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<th:block layout:fragment="content">
    <section class="content-main">
        <div class="content-header">
            <div>
                <h2 class="content-title card-title">매출보고 & 정산</h2>
            </div>
        </div>
        <header class="card card-header">
            <form id="mainSearchForm" th:action="@{/admin/payment/searchEnterprise}" method="get">
                <div class="row gx-3">
                    <div class="col-12 d-flex justify-content-center">
                        <div class="col-2">
                            <input type="month" name="settlementMonth" th:value="${settlementMonth}" id="monthSelector" class="form-control"/>
                        </div>
                        <div class="col-8">
                            <div class="col-5 ml-5 d-flex justify-content-start">
                                <input type="text" id="searchInput" name="searchValue" 
                                    th:value="${searchValue}"
                                    placeholder=" 업체 먼저 찾아보고 검색해 주세요!" 
                                    class="form-control" disabled/>
                                <div class="col-2 ml-5">
                                    <button type="submit" id="searchButton" 
                                        class="form-control btn-sm btn btn-outline-dark center-text text-center" 
                                        style="font-size: 1.2rem;" disabled>🔎
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="col-2 ml-5">
                            <button type="button" class="form-control btn btn-outline-dark" style="font-size: 1.2rem;"
                            th:onclick="'javascript:openEnterPricseList(\'' + @{/admin/enterprise/searchPopup} + '\'); return false;'">
                            <i class="bi bi-list-ul ml-40 text-center">📚 업체 찾기</i>
                        </button>
                        </div>
                    </div>
                </div>
            </form>
        </header>

        <div class="row ">
            <div class="col-12 ">
                <div class="row">
                    <div class="col-6">
                        <div class="card mb-4" style="height: 360px;">
                            <article class="card-body">
                                <th:block th:if="${!#lists.isEmpty(entList)}" th:each="el : ${entList}">
                                    <h4 class="card-title mb-40" th:text="${el.entName}">회사 이름</h4>
                                    <div class="new-member-list">
                                        <div class="d-flex align-items-center justify-content-between mb-4">
                                            <div class="d-flex align-items-center">
                                                <img th:src="@{/manage/assets/imgs/vendor/vendor-1.png}" alt="vendorImage" class="vendor mr-50 ml-30" />
                                                <div>
                                                    <h4 th:text=" ' 대표자 : '+${el.entCeoName}">대표님 성함</h4>
                                                    <small class="text-warning" name="entEmpId" th:text=" ' ID : '+${el.entEmpId}">아이디</small>
                                                    
                                                    <ul class="mt-20" >
                                                        <li><h4 class="mb-1" th:text="'• 사업자 번호 : '+ ${el.entBrno}">사업자 번호</h4></li>
                                                        <li><h4 class="mb-1" th:text="'• 업체 코드 : '+ ${el.ceoCode}">업체 코드</h4></li>
                                                        <li><h4 class="mb-1" th:text="'• 계약 만료일 : '+ ${el.contractEndDate}">계약 끝나는 날</h4></li>
                                                        <li><h4 class="text-success" th:text="'• 계약 상태 : '+ ${el.entContractStatus}"><span>계약 상태</span></h4></li>
                                                    </ul>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </th:block>
                                <th:block th:unless="${!#lists.isEmpty(entList)}">
                                    <p>아쉽게도, 찾으시는 업체가 없네요.</p>
                                </th:block>
                            </article>
                        </div>
                    </div>
                    <div class="col-6 d-flex">
                        <div class="col-4">
                            <div class="card card-body text-center" style="background-color: rgb(126, 160, 224);">
                                <p style="color:rgb(255, 255, 255); font-size:large">◪매출 종류◩</p>
                            </div>
                            <div th:if="${!#lists.isEmpty(adminMonthlyFeeList)}" th:each="ll : ${adminMonthlyFeeList}">
                                <div class="card card-body mb-1 d-flex">
                                    <ul class="text-center text-success">
                                        <li th:text="${ll.paymentDetails}"> </li>
                                    </ul> 
                                </div>
                            </div>
                        </div>

                        <div class="col-4">
                            <div class="card card-body text-center" style="background-color: rgb(126, 160, 224);">
                                <p style="color:rgb(255, 255, 255); font-size:large">◪총 매출액◩</p>
                            </div>
                            <div th:if="${!#lists.isEmpty(adminMonthlyFeeList)}" th:each="ll : ${adminMonthlyFeeList}">
                                <div class="card card-body mb-1 d-flex">
                                    <ul class="text-center">
                                        <li th:text="|₩ ${#numbers.formatDecimal(ll.entFee, 0, 'COMMA', 0, 'POINT')}|"> </li>
                                    </ul> 
                                </div>
                            </div>
                        </div>

                        <div class="col-4">
                            <div class="card card-body text-center" style="background-color: rgb(126, 160, 224);">
                                <p style="color:rgb(255, 255, 255); font-size:large">◪플랫폼 수수료◩</p>
                            </div>
                            <div th:if="${!#lists.isEmpty(adminMonthlyFeeList)}" th:each="ll : ${adminMonthlyFeeList}">
                                <div class="card card-body mb-1 d-flex">
                                    <ul class="text-center">
                                        <li th:text="|₩ ${#numbers.formatDecimal(ll.platformFee, 0, 'COMMA', 0, 'POINT')}|"> </li>
                                    </ul> 
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-12" th:unless="${!#lists.isEmpty(adminMonthlyFeeList)}">
                        <div class="card card-body">
                            <div class="text text-center">
                                <h4> △ 아직 마감된 데이터가 없습니다. ▽</h4>
                            </div>
                        </div>
                    </div>
                </div> 
            </div>
        </div>
        <div class="card mb-4">
           <header class="card-header d-flex justify-content-lg-between">
                <h4 class="card-title">매출 상세 내역</h4>
                <div class="d-flex justify-content-between">
                    <form id="paymentForm" th:action="@{/admin/payment/processPayment}" method="POST"> 
                        <input type="hidden" name="settlementMonth" th:value="${settlementMonth}"/>
                        <input type="hidden" name="searchValue" th:value="${searchValue}"/>
                        <div th:if="${!#lists.isEmpty(entList)}" th:each="el : ${entList}">
                            <input type="hidden" name="entEmpId" th:value="${el.entEmpId}"/>
                            <input type="hidden" name="entCeoNo" th:value="${el.ceoCode}"/> </div>
                        <th:block th:if="${!#lists.isEmpty(adminFeeList)}" th:each="l, i : ${adminFeeList}">
                            <input type="hidden" th:name="'feeNoList[' + ${i.index} + ']'" th:value="${l.feeNo}" />
                        </th:block>
                        <button type="submit" id="payButton" class="form-control btn-icon btn mr-10"
                            style="font-size: 1.2rem;" disabled>💸 지급하기!
                        </button>
                    </form>

                    <form th:action="@{/admin/payment/calculateDeadline}" method="POST" class="ml-10">
                        <input type="hidden" name="settlementMonth" th:value="${settlementMonth}" id="hiddenSettlementMonth"/>
                        <input type="hidden" name="searchValue" th:value="${searchValue}" id="hiddenSearchValue"/>
                            <div th:if="${!#lists.isEmpty(entList)}" th:each="el : ${entList}">
                                <input type="hidden" name="entEmpId" th:value="${el.entEmpId}" id="hiddenEntEmpId"/>
                            </div>
                        <th:block th:if="${!#lists.isEmpty(adminFeeList)}" th:each="l, i : ${adminFeeList}">
                            <input type="hidden" th:name="'adminFeeList[' + ${i.index} + '].feeNo'" th:value="${l.feeNo}" />
                            <input type="hidden" th:name="'adminFeeList[' + ${i.index} + '].paymentCompletedNo'" th:value="${l.paymentCompletedNo}" />
                            <input type="hidden" th:name="'adminFeeList[' + ${i.index} + '].entCeoNo'" th:value="${l.entCeoNo}" />
                            <input type="hidden" th:name="'adminFeeList[' + ${i.index} + '].entEmpId'" th:value="${l.entEmpId}" />
                            <input type="hidden" th:name="'adminFeeList[' + ${i.index} + '].managerId'" th:value="${l.managerId}" />
                            <input type="hidden" th:name="'adminFeeList[' + ${i.index} + '].paymentDetils'" th:value="${l.paymentDetils}" />
                            <input type="hidden" th:name="'adminFeeList[' + ${i.index} + '].platFormFee'" th:value="${l.platFormFee}" />
                            <input type="hidden" th:name="'adminFeeList[' + ${i.index} + '].entSales'" th:value="${l.entSales}" />
                            <input type="hidden" th:name="'adminFeeList[' + ${i.index} + '].provisionScheduleDate'" th:value="${l.provisionScheduleDate}" />
                            <input type="hidden" th:name="'adminFeeList[' + ${i.index} + '].provisionDate'" th:value="${l.provisionDate}" />
                            <input type="hidden" th:name="'adminFeeList[' + ${i.index} + '].settlementMonth'" th:value="${l.settlementMonth}" />
                            <input type="hidden" th:name="'adminFeeList[' + ${i.index} + '].closingSttelement'" th:value="${l.closingSttelement}" />
                            <input type="hidden" th:name="'adminFeeList[' + ${i.index} + '].paymentStatus'" th:value="${l.paymentStatus}" />
                            <input type="hidden" th:name="'adminFeeList[' + ${i.index} + '].revisionDate'" th:value="${l.revisionDate}" />
                            
                        </th:block>
                            <button type="submit" id="deadline" 
                                class="form-control btn-icon btn mr-10" 
                                style="font-size: 1.2rem;">📔 마감하기!
                            </button>
                    </form>
                </div>
            </header>
            <div class="card-body">
                <div class="table-responsive">
                    <div class="table-responsive">
                        <table class="table align-middle table-nowrap mb-0">
                            <thead class="table-light">
                                <tr class="text-center">
                                    <th class="align-middle" scope="col">수수료 관리 코드</th>
                                    <th class="align-middle" scope="col">업체 코드</th>
                                    <th class="align-middle" scope="col">매출 종류</th>
                                    <th class="align-middle" scope="col">매출 금액</th>
                                    <th class="align-middle" scope="col">플랫폼 수수료</th>
                                    <th class="align-middle" scope="col">지급 예정일</th>
                                    <th class="align-middle" scope="col">지급일</th>
                                    <th class="align-middle" scope="col">정산 연월</th>
                                    <th class="align-middle" scope="col">마감 구분</th>
                                    <th class="align-middle" scope="col">상태</th>
                                </tr>
                            </thead>
                            <tbody>
                            <tr class="text-center" th:if="${!#lists.isEmpty(adminFeeList)}" th:each="l : ${adminFeeList}">
                                <td class="align-middle" scope="row" th:text="${l.feeNo}"></td>
                                <td class="align-middle" th:text="${l.entCeoNo}"></td> 
                                <td class="align-middle" th:text="${l.paymentDetils}"></td> 
                                <td class="align-middle" th:text="${#numbers.formatDecimal(l.entSales, 0, 'COMMA', 0, 'POINT')}"></td>
                                <td class="align-middle" th:text="${#numbers.formatDecimal(l.platFormFee, 0, 'COMMA', 0, 'POINT')}"></td>
                                <td class="align-middle" th:text="${l.provisionScheduleDate}"></td>
                                <td class="align-middle" th:text="${l.provisionDate}"></td>
                                <td class="align-middle" th:text="${l.settlementMonth}"></td> 
                                <td class="align-middle" th:text="${l.closingSttelement}"></td>
                                <td class="align-middle" th:text="${l.paymentStatus}"></td> 
                            </tr>
                                <tr th:unless="${!#lists.isEmpty(adminFeeList)}">
                                    <td class="text-center" colspan="14">아직 매출 내역이 없어요.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </section>
</th:block>

<th:block layout:fragment="jsScript">
     <script th:inline="javascript">
        /**
         * @function openEnterPricseList
         * @description 업체 목록 팝업
         * @param {string} url - 팝업으로 열릴 페이지 주소
         */
        function openEnterPricseList(url) {
            window.open(url, 'entListPopup', 'width=1250,height=600,scrollbars=yes');
        }

        /**
         * @function updateSearchValue
         * @description 팝업에서 고른 업체 코드를 메인 검색창에 넣고 바로 검색
         * 이 함수는 팝업 페이지에서 호출
         * @param {string} value - 팝업에서 선택된 업체 코드 (대표 코드)
         */
        function updateSearchValue(value) {
            const searchInput = document.getElementById('searchInput');
            const searchForm = document.getElementById('mainSearchForm');
            const searchButton = document.getElementById('searchButton');

            if (searchInput && searchForm && searchButton) {
                searchInput.value = value;
                // 팝업에서 값이 들어오면 바로 활성화
                searchInput.disabled = false;
                searchButton.disabled = false;

                searchForm.submit(); // 폼을 제출해서 페이지를 새로고침하고 데이터를 다시 가져옴옴
                console.log('메인 페이지 폼 제출 완료!');
            } 
        }

        document.addEventListener('DOMContentLoaded', function() {
            const monthSelector = document.getElementById('monthSelector');
            const searchInput = document.getElementById('searchInput');
            const searchButton = document.getElementById('searchButton');
            const payButton = document.getElementById('payButton');
            const deadlineButton = document.getElementById('deadline');
            const paymentForm = document.getElementById('paymentForm'); // paymentForm도 여기서 가져와

            /**
             * 월 선택 입력창 초기 설정
             */
            if (monthSelector && (!monthSelector.value || monthSelector.value === '')) {
                const today = new Date();
                const year = today.getFullYear();
                const month = (today.getMonth() + 1).toString().padStart(2, '0');
                monthSelector.value = `${year}-${month}`;
            }

            /**
             * 검색 입력창이랑 검색 버튼 활성화/비활성화 로직 (페이지 처음 열릴 때)
             * 검색값이 없으면 비활성화, 있으면 활성화!
             */
            if (searchInput && searchButton) {
                const initialInputValue = searchInput.value.trim();
                // ⭐ 페이지 처음 열릴 때 값이 없으면 비활성화 상태 유지, 있으면 활성화! ⭐
                searchInput.disabled = (initialInputValue.length === 0);
                searchButton.disabled = (initialInputValue.length === 0);

                // 사용자가 직접 입력창 내용을 바꿀 때도 검색 버튼 활성화 상태를 업데이트해줘요!
                searchInput.addEventListener('input', function() {
                    searchButton.disabled = (this.value.trim().length === 0);
                });
            } else {
                console.error('필요한 요소 "searchInput" 또는 "searchButton"을 못 찾겠어요. (HTML 확인이 필요해요!)');
            }

            // `adminFeeList` 데이터 (타임리프(Thymeleaf)에서 JSON으로 변환)
            const adminFeeList = /*[[${adminFeeList}]]*/ []; 
            // `adminMonthlyFeeList` 데이터 (이것도 타임리프(Thymeleaf)에서 JSON으로 변환)
            const adminMonthlyFeeList = /*[[${adminMonthlyFeeList}]]*/ [];

            /**
             * 💸지급 버튼 활성화/비활성화 로직
             */
            let shouldEnablePayButton = false;
            if (adminFeeList && adminFeeList.length > 0) {
                // 모든 항목이 '마감(정산)완료' 상태이고, 지급일(provisionDate)이 비어있거나 null이며, '지급' 상태가 아닐 때만 활성화!
                shouldEnablePayButton = adminFeeList.every(item => 
                    (item.provisionDate === null || item.provisionDate === '') && 
                    (item.closingSttelement === '2.마감(정산)완료') &&
                    (item.paymentStatus !== '지급') // '지급' 상태가 아닐 때만 버튼이 보인답니다!
                );
            }
            if (payButton) {
                if (shouldEnablePayButton) {
                    payButton.removeAttribute('disabled'); // 지급 버튼 활성화!
                } else {
                    payButton.setAttribute('disabled', 'true'); // 지급 버튼 비활성화!
                }

                // 스윗얼럿2(SweetAlert2)를 띄우기 위해 클릭 이벤트 리스너
                payButton.addEventListener('click', function(event) {
                    event.preventDefault(); // 기본 폼 제출은 잠시 멈춰

                    // 정산할 총 금액을 계산해봐요!
                    let totalSettlementAmount = 0;
                    if (adminMonthlyFeeList && adminMonthlyFeeList.length > 0) {
                        // adminMonthlyFeeList에서 '4.총합계' 항목의 entFee
                        const totalSummary = adminMonthlyFeeList.find(item => item.paymentDetails === '4.총합계');
                        if (totalSummary) {
                            totalSettlementAmount = totalSummary.entFee;
                        } else {
                            // 만약 '4.총합계'가 없다면, 다른 항목들의 entFee의 합계
                            
                            totalSettlementAmount = adminMonthlyFeeList.reduce((sum, item) => sum + item.entFee, 0);
                        }
                    }
                    const formattedAmount = totalSettlementAmount.toLocaleString('ko-KR') + '원';

                    Swal.fire({
                        title: '정산금액을 지급하시겠습니까?',
                        text: `지급액은 총 ${formattedAmount} 입니다.`,
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonColor: '#3085d6',
                        cancelButtonColor: '#d33',
                        confirmButtonText: '정산금액 지급',
                        cancelButtonText: '아니요'
                    }).then((result) => {
                        if (result.isConfirmed) {
                            Swal.fire({
                                title: '최종 확정 하시겠습니까?',
                                text: "확정하면 취소할 수 없으니, 다시 한번 확인해주세요!",
                                icon: 'warning',
                                showCancelButton: true,
                                confirmButtonColor: '#3085d6',
                                cancelButtonColor: '#d33',
                                confirmButtonText: '확인!',
                                cancelButtonText: '취소'
                            }).then((secondResult) => {
                                if (secondResult.isConfirmed) {
                                    paymentForm.submit(); // 드디어 폼 제출!
                                }
                            });
                        }
                    });
                });

            } else {
                console.error("오류: 'payButton' ID를 가진 요소를 못 찾겠어요. (HTML을 다시 확인해봐야 할 것 같아요!)");
            }

            /**
             * 📔마감 버튼 활성화/비활성화 로직
             */
            let shouldEnableDeadlineButton = false; 
            if (adminFeeList && adminFeeList.length > 0) {
                // 모든 항목이 '마감(정산)전' 상태이고, 지급일(provisionDate)이 비어있거나 null일 때만 활성화!
                shouldEnableDeadlineButton = adminFeeList.every(item => 
                    (item.closingSttelement === '1.마감(정산)전') &&
                    (item.provisionDate === null || item.provisionDate === '')
                );
            }

            if (deadlineButton) { 
                if (shouldEnableDeadlineButton) {
                    deadlineButton.removeAttribute('disabled'); // 마감 버튼 활성화!
                } else {
                    deadlineButton.setAttribute('disabled', 'true'); // 마감 버튼 비활성화!
                }
            } else {
                console.error("오류: 'deadline' ID를 가진 요소를 못 찾겠어요. (HTML을 다시 확인해봐야 할 것 같아요!)");
            }
        });
    </script>
</th:block>

</body>
</html>
