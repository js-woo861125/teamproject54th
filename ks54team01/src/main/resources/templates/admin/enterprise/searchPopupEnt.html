<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{admin/layout/defaultPopUp}">
	  
<head>
</head>

<th:block layout:fragment="content">
      
	<div class="card mb-4">
		<header class="card-header">
            <form th:action="@{/admin/enterprise/searchPopupEnt}" method="get">
                <div class="row gx-3">
           			<div class="col-lg-2 col-md-3 col-12">
               			<select class="form-select" name="searchKey">
		                   <option value="entBrNo" th:selected="${searchKey == 'entBrNo'}">사업자번호</option>
		                   <option value="entName" th:selected="${searchKey == 'entName'}">입점업체명</option> 
               			</select>
           			</div>
           				<div class="col-lg-4 col-md-5">
               				<input type="text" name="searchValue" th:value="${searchValue}" placeholder="사업자번호(10자리), 상호를 입력하세요" class="form-control" />
           				</div>
           				<div class="col-lg-1 col-md-1">
							<button type="submit" class="form-control btn" style="font-size: 0.8rem;">🔎검색</button>                   
           				</div>      		
				</div>
			</form> 
		</header>
        

		<div class="card-body">
			<div class="table-responsive">
				<div class="table-responsive">
					<table class="table align-middle table-nowrap mb-0">
						<thead class="table-light text-center">
							<tr>		
								<th class="align-middle" scope="col">대표코드</th>
								<th class="align-middle" scope="col">사업자번호</th>
								<th class="align-middle" scope="col">입점업체명</th>
								<th class="align-middle" scope="col">대표자</th>		
								<th class="align-middle" scope="col">연락처</th>
								<th class="align-middle" scope="col">등록일자</th>
							</tr>
						</thead>
		                <tbody class="text-center">	
						<th:block th:if="${!#lists.isEmpty(searchPopupEntList)}" th:each="l : ${searchPopupEntList}">
							<tr>	
								<td>
									<button class="popupSearchBtn btn btn-sm" 
										th:text="${l.ceoCode}">
        								업체 코드 선택
    								</button>
								</td>
								<td th:text="${l.entBrno}">402-00-00000</td>
								<td th:text="${l.entName}">(주)홍홍상사</td>
								<td th:text="${l.entCeoName}">대표자명</td>
								<td th:text="${l.ceoTelNo}">010-0001-0001</td>
								<td th:text="${l.regDate}">2020-01-01</td>
							</tr>	
						</th:block>	
						<th:block th:unless="${!#lists.isEmpty(searchPopupEntList)}">
	                		<tr>
	                		<td colspan="6" class="text-center">조회된 업체가 없습니다.</td>
	                		</tr>
           				 </th:block>
						 
					 	</tbody>                
					</table>       
				</div>
			</div>
		</div>
	</div>
</th:block>

<th:block layout:fragment="jsScript">
    <script>
        const entBrNoInput = document.querySelector('input[name="searchValue"]');
        const searchKeySelect = document.querySelector('select[name="searchKey"]');
        const searchForm = document.querySelector('form');
    
        searchForm.addEventListener('submit', function(event) {
            if (searchKeySelect.value === 'entBrNo' && entBrNoInput.value !== '') {
            const regex = /^[0-9]{3}-[0-9]{2}-[0-9]{5}$/;
            if (!regex.test(entBrNoInput.value)) {
                alert('사업자번호 형식이 올바르지 않습니다. (예: xxx-xx-xxxxx)');
                event.preventDefault(); // 폼 제출 막기
            }
            }
        });
    
        entBrNoInput.addEventListener('input', function() {
            if (searchKeySelect.value === 'entBrNo') {
            // 사업자번호 검색 시 숫자와 하이픈만 허용
            this.value = this.value.replace(/[^0-9-]/g, '');
    
            // 자동 하이픈 삽입 (선택 사항)
            if (this.value.length === 3 && !this.value.endsWith('-')) {
                this.value += '-';
            } else if (this.value.length === 6 && !this.value.endsWith('-')) {
                this.value += '-';
            }
            } else if (searchKeySelect.value === 'entName') {
            // 입점업체명 검색 시 모든 문자 허용 (별도의 제한이 없다면)
            
            }
        });
    
        searchKeySelect.addEventListener('change', function() {
            // 검색 조건이 변경되면 입력 필드의 내용을 초기화 
            entBrNoInput.value = '';
        });
        

		
        $('button.popupSearchBtn').click(function(e) {
            const ceoCode = $(this).text(); // 버튼의 텍스트가 업체코드
            console.log('선택된 업체 코드 (팝업):', ceoCode);

            if (window.opener && !window.opener.closed) {
                // 1. 메인 페이지의 searchInput에 값 설정
                window.opener.document.querySelector('input[name="searchValue"]').value = ceoCode;
                
                // 2. 메인 페이지의 updateSearchValue 함수 호출하여 searchInput과 searchButton 활성화
                if (typeof window.opener.updateSearchValue === 'function') {
                    window.opener.updateSearchValue(ceoCode);
                    console.log('메인 페이지 updateSearchValue 함수 호출 완료.');
                } else {
                    console.error('메인 페이지에 updateSearchValue 함수가 정의되지 않았습니다.');
                    // 만약 updateSearchValue 함수 호출이 어렵다면, 여기에 직접 disabled 해제 로직을 추가
                    // window.opener.document.getElementById('searchInput').disabled = false;
                    // window.opener.document.getElementById('searchButton').disabled = false;
                }
            } else {
                console.warn('부모 창(opener)을 찾을 수 없거나 이미 닫혔습니다.');
            }
            window.close(); // 팝업 창 닫기
        }); 
        
    </script>
</th:block>
</html>
