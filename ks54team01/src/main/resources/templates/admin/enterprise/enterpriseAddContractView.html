<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{admin/layout/default}">
	<!-- head 삽입공간 -->
	<head>
		<style>
			 .ui-widget-header { border: 0px solid #dddddd; background: #fff; } 

 .ui-datepicker-calendar>thead>tr>th { font-size: 14px !important; } 

 .ui-datepicker .ui-datepicker-header { position: relative; padding: 10px 0; } 

 .ui-state-default,
 .ui-widget-content .ui-state-default,
 .ui-widget-header .ui-state-default,
 .ui-button,
 html .ui-button.ui-state-disabled:hover,
 html .ui-button.ui-state-disabled:active { border: 0px solid #c5c5c5; background-color: transparent; font-weight: normal; color: #454545; text-align: center; } 

 .ui-datepicker .ui-datepicker-title { margin: 0 0em; line-height: 16px; text-align: center; font-size: 14px; padding: 0px; font-weight: bold; } 

 .ui-datepicker { display: none; background-color: #fff; border-radius: 4px; margin-top: 10px; margin-left: 0px; margin-right: 0px; padding: 20px; padding-bottom: 10px; width: 300px; box-shadow: 10px 10px 40px rgba(0, 0, 0, 0.1); } 

 .ui-widget.ui-widget-content { border: 1px solid #eee; } 

 #datepicker:focus>.ui-datepicker { display: block; } 

 .ui-datepicker-prev,
 .ui-datepicker-next { cursor: pointer; } 

 .ui-datepicker-next { float: right; } 

 .ui-state-disabled { cursor: auto; color: hsla(0, 0%, 80%, 1); } 

 .ui-datepicker-title { text-align: center; padding: 10px; font-weight: 100; font-size: 20px; } 

 .ui-datepicker-calendar { width: 100%; } 

 .ui-datepicker-calendar>thead>tr>th { padding: 5px; font-size: 20px; font-weight: 400; } 

 .ui-datepicker-calendar>tbody>tr>td>a { color: #000; font-size: 12px !important; font-weight: bold !important; text-decoration: none;}

 .ui-datepicker-calendar>tbody>tr>.ui-state-disabled:hover { cursor: auto; background-color: #fff; } 

 .ui-datepicker-calendar>tbody>tr>td { border-radius: 100%; width: 44px; height: 30px; cursor: pointer; padding: 5px; font-weight: 100; text-align: center; font-size: 12px; } 

 .ui-datepicker-calendar>tbody>tr>td:hover { background-color: transparent; opacity: 0.6; } 

 .ui-state-hover,
 .ui-widget-content .ui-state-hover,
 .ui-widget-header .ui-state-hover,
 .ui-state-focus,
 .ui-widget-content .ui-state-focus,
 .ui-widget-header .ui-state-focus,
 .ui-button:hover,
 .ui-button:focus { border: 0px solid #cccccc; background-color: transparent; font-weight: normal; color: #2b2b2b; } 

 .ui-widget-header .ui-icon { background-image: url('./btns.png'); } 

 .ui-icon-circle-triangle-e { background-position: -20px 0px; background-size: 36px; } 

 .ui-icon-circle-triangle-w { background-position: -0px -0px; background-size: 36px; } 

 .ui-datepicker-calendar>tbody>tr>td:first-child a { color: red !important; } 

 .ui-datepicker-calendar>tbody>tr>td:last-child a { color: #0099ff !important; } 

 .ui-datepicker-calendar>thead>tr>th:first-child { color: red !important; } 

 .ui-datepicker-calendar>thead>tr>th:last-child { color: #0099ff !important; } 

 .ui-state-highlight,
 .ui-widget-content .ui-state-highlight,
 .ui-widget-header .ui-state-highlight { border: 0px; background: #f1f1f1; border-radius: 50%; padding-top: 10px; padding-bottom: 10px; } 

 .inp { padding: 10px 10px; background-color: #f1f1f1; border-radius: 4px; border: 0px; } 

 .inp:focus { outline: none; background-color: #eee; } 
		</style>
	</head>
	
	<th:block layout:fragment="jsFile">
	<script type="text/javascript" src="https://cdn.jsdelivr.net/jquery/latest/jquery.min.js"></script>
	<script type="text/javascript" src="https://cdn.jsdelivr.net/momentjs/latest/moment.min.js"></script>
	<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.min.js"></script>
	<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css" />
	</th:block>
	
	<th:block layout:fragment="jsScript">
		<script>
			/**
			* 계약일자 & 계약만료일자 달력 및 계약일 계산하기
			*/
			// 현재 날짜를 기준으로 계약일자 계약만료일자 계산 (3년 후 하루 전날)
			$(function() {
				  function updateContractEndDate(startDateStr) {
				    const start = moment(startDateStr, 'YYYY-MM-DD');
				    const end = moment(start).add(3, 'years').subtract(1, 'days');
				    $('input[name="contractEndDate"]').val(end.format('YYYY-MM-DD'));
				  }
				  
				  // 데이트피커 한글
				  const koreanLocale = {
					format: 'YYYY-MM-DD',
					applyLabel: '날짜선택',
					cancelLabel: '취소',
					daysOfWeek: ['일', '월', '화', '수', '목', '금', '토'],
					monthNames: ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월']
				  };
				  
				  // 계약일자 달력
				  $('input[name="contractDate"]').daterangepicker({
				    singleDatePicker: true,
				    showDropdowns: true,
				    autoUpdateInput: true,
				    locale: koreanLocale,
				    minYear: 2000,
				    maxYear: parseInt(moment().format('YYYY'), 10) + 5
				  }, function(start) {
				    updateContractEndDate(start.format('YYYY-MM-DD'));
				  });
				  
				  // 계약만료일자 달력
				  $('input[name="contractEndDate"]').daterangepicker({
				    singleDatePicker: true,
				    showDropdowns: true,
				    autoUpdateInput: true,
				    locale: koreanLocale,
				    minYear: 2000,
				    maxYear: parseInt(moment().format('YYYY'), 10) + 10
				  });

				  // 수동으로 계약일자 선택 시 계약만료일자 계산
				  $('input[name="contractDate"]').on('change', function() {
				    updateContractEndDate($(this).val());
				  });
				});
			// 페이지 로딩 시 계약일자가 있는 경우 계약만료일자 계산
			$(document).ready(function() {
				  const startDateVal = $('input[name="contractDate"]').val();
				  if (startDateVal) {
				    const start = moment(startDateVal, 'YYYY-MM-DD');
				    const end = moment(start).add(3, 'years').subtract(1, 'days');
				    $('input[name="contractEndDate"]').val(end.format('YYYY-MM-DD'));
				  }
				});
				
			/**
			* 대표코드 선택 시 해당 대표자정보 조회
			*/
			$('#entCeoNo').change(function() {
			    const selectedOption = $(this).find('option:selected');
			    console.log(selectedOption.data('empid'), selectedOption.data('ceoname'));
			    const entEmpId = selectedOption.data('empid');
			    const entCeoName = selectedOption.data('ceoname');
			    const entName = selectedOption.data('entname');
			    const entBrno = selectedOption.data('entbrno');
			    
			    $('#entEmpId').val(entEmpId || '');
			    $('#entCeoName').val(entCeoName || '');
			    $('#entName').val(entName || '');
			    $('#entBrno').val(entBrno || '');
			});
		</script>
	</th:block>
	
	<!-- 페이지 삽입공간 -->
	<th:block layout:fragment="content">
		<div class="row">
			<div class="col-6">
				<div class="content-header">
					<h2 class="content-title" th:text="${title}"></h2>

				</div>
			</div>
		</div>
		<div class="row">
			<div class="col-lg-6">
				<form th:action="@{/admin/enterprise/addContract}" method="post" id="addContractForm">
					<div class="card mb-4">
						<div class="card-body">
							<div class="row">
							    <div class="col-md-3">
							        <h6>1. 계약 정보</h6>
							    </div>
							    <div class="col-md-9">
							        <div class="d-flex justify-content-between align-items-center flex-wrap">
							            <!-- 라디오 버튼 -->
							            <div class="d-flex align-items-center gap-3">
							                <div class="form-check mb-3">
							                    <input class="form-check-input" type="radio" name="contractType" id="newContract" value="new" checked>
							                    <label class="form-check-label" for="newContract">신규계약</label>
							                </div>
							                <div class="form-check mb-3">
							                    <input class="form-check-input" type="radio" name="contractType" id="renewalContract" value="renewal">
							                    <label class="form-check-label" for="renewalContract">재계약</label>
							                </div>
							            </div>
							            <!-- 등록 버튼 -->
							            <div class="d-flex gap-2 mb-3">
							                <button type="submit" class="btn btn-md rounded font-lg hover-up">등록</button>
							                <button type="reset" onclick="location.href='/admin/enterprise/List'" class="btn btn-light rounded font-lg text-body hover-up">등록취소</button>
							            </div>
							        </div>
							    </div>
							</div>
							<hr class="mb-4 mt-0">
							<div class="row">
								<div class="col-md-3">
									<h6>2. 입점업체 정보</h6>
								</div>
								<div class="col-md-9">
									<div class="mb-4">
										<label class="form-label" for="entCeoNo">대표코드</label> 
										<select class="form-select" id="entCeoNo" name="entCeoNo">
											<option value="">대표코드를 선택하세요</option>
											<option th:each="e : ${entList}" 
													th:if="${#strings.isEmpty(e.entContractStatus)}" 
													th:value="${e.ceoCode}" 
													th:text="${e.ceoCode}"
													th:data-empid="${e.entEmpId}"
													th:data-ceoname="${e.entCeoName}"
													th:data-entname="${e.entName}"
													th:data-entbrno="${e.entBrno}">
											</option>
										</select>
									</div>	
									<div class="mb-4">
										<label class="form-label" for="entEmpId">대표아이디</label> 
										<input type="text" id="entEmpId" name="entEmpId" class="form-control" placeholder="대표코드를 선택하세요." readonly />
									</div>
									<div class="mb-4">
										<label class="form-label" for="entCeoName">대표자명</label> 
										<input type="text" id="entCeoName" name="entCeoName" class="form-control" placeholder="대표코드를 선택하세요." readonly />
									</div>
									<div class="mb-4">
										<label class="form-label" for="entName">입점업체명</label> 
										<input type="text" id="entName" name="entName" class="form-control" placeholder="대표코드를 선택하세요." readonly />
									</div>
									<div class="mb-4">
										<label class="form-label" for="entBrno">사업자번호</label> 
										<input type="text" id="entBrno" name="entBrno" class="form-control" placeholder="대표코드를 선택하세요." readonly />
									</div>																		
								</div>
							</div>
							<hr class="mb-4 mt-0">
							<div class="row">
								<div class="col-md-3">
									<h6>3. 계약 내용</h6>
								</div>
								<div class="col-md-9">
									<div class="mb-4">
										<label class="form-label" for="managerId">플랫폼 직원 아이디</label>
										<input type="text" id="managerId" name="managerId" class="form-control" placeholder="플랫폼 직원 아이디를 입력해주세요" />
									</div>
									<div class="mb-4">
										<label class="form-label" for="feeRateSales">플랫폼 수수료율(일반판매)</label>
										<input type="text" id="feeRateSales" name="feeRateSales" class="form-control" th:value="${defaultFeeRateSales}" placeholder="일반판매 수수료율을 입력해주세요" />
									</div>
									<div class="mb-4">
										<label class="form-label" for="feeRateRental">플랫폼 수수료율(렌탈)</label>
										<input type="text" id="feeRateRental" name="feeRateRental" class="form-control" th:value="${defaultFeeRateRental}" placeholder="렌탈 수수료율을 입력해주세요" />
									</div>
									<div class="mb-4">
										<label class="form-label" for="feeRatePenalty">플랫폼 수수료율(위약금)</label>
										<input type="text" id="feeRatePenalty" name="feeRatePenalty" class="form-control" th:value="${defaultFeeRatePenalty}" placeholder="위약금 수수료율을 입력해주세요" />
									</div>
									<div class="mb-4">
										<label class="form-label" for="entryFee">입점비</label>
										<input type="text" id="entryFee" name="entryFee" class="form-control" th:value="${defaultEntryFee}" placeholder="입점비를 입력해주세요" />
									</div>
									<div class="mb-4">
										<label class="form-label datepicker" for="contractDate">계약일자</label>
										<input type="text" id="contractDate" name="contractDate" class="form-control datepicker" placeholder="계약일자를 입력해주세요" />
									</div>
									<div class="mb-4">
										<label class="form-label" for="contractEndDate">계약만료일자</label>
										<input type="text" id="contractEndDate" name="contractEndDate" class="form-control" placeholder="계약만료일자를 입력해주세요" />
									</div>
									<div class="mb-4">
										<label class="form-label" for="entCalDate">월정산일자</label>
										<input type="text" id="entCalDate" name="entCalDate" class="form-control" th:value="${defaultEntCalDate}" placeholder="월정산일자를 입력해주세요" />
									</div>
								</div>
							</div>
						</div>
					</div>
				</form>
			</div>
		</div>
	</th:block>
</html>
