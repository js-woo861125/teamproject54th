<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{admin/layout/default}">
	<!-- head 삽입공간 -->
	<head>
	</head>
	
	<th:block layout:fragment="jsFile">
	</th:block>
	
	<!-- 페이지 삽입공간 -->
	<th:block layout:fragment="content">
		<div class="row">
			<div class="col-6">
				<div class="content-header">
					<h2 class="content-title" th:text="${title}"></h2>
					<div>
						<button type="submit" id="addContract" class="btn btn-md rounded font-sm hover-up">등록</button>
						<button type="reset" onclick="location.href='/admin/enterprise/List'" 
								class="btn btn-light rounded font-sm mr-5 text-body hover-up">등록취소</button>
					</div>
				</div>
			</div>
		</div>
		<div class="row">
			<div class="col-lg-6">
				<div class="card mb-4">
					<div class="card-body">
						<div class="row">
							<div class="col-md-3">
								<h6>1. 입점업체 정보</h6>
							</div>
							<div class="col-md-9">
								<div class="mb-4">
									<label class="form-label" for="entCeoNo">대표코드</label> 
									<select class="form-select" id="entCeoNo" name="entCeoNo"></select>
								</div>
								<div class="mb-4">
									<label class="form-label" for="entEmpId">대표아이디</label> 
									<input type="text" id="entEmpId" name="entEmpId" class="form-control" placeholder="대표코드 넣으면 자동완성" />
								</div>
								<div class="mb-4">
									<label class="form-label" for="">업체명</label>
									<input type="text" id="" name="" class="form-control" placeholder="대표코드 넣으면 자동완성" />
								</div>
								<div class="mb-4">
									<label class="form-label" for="">대표명</label>
									<input type="text" id="" name="" class="form-control" placeholder="대표코드 넣으면 자동완성" />
								</div>
							</div>
						</div>
						<hr class="mb-4 mt-0">
						<div class="row">
							<div class="col-md-3">
								<h6>2. 계약 정보</h6>
							</div>
							<div class="col-md-9">
								<div class="mb-4">
									<label class="form-label" for="managerId">플랫폼 직원 아이디</label>
									<input type="text" id="managerId" name="managerId" class="form-control" placeholder="플랫폼 직원 아이디를 입력해주세요" />
								</div>
								<div class="mb-4">
									<label class="form-label" for="feeRateSales">플랫폼 수수료율(일반판매)</label>
									<input type="text" id="feeRateSales" name="feeRateSales" class="form-control" placeholder="일반판매 수수료율을 입력해주세요" />
								</div>
								<div class="mb-4">
									<label class="form-label" for="feeRateRental">플랫폼 수수료율(렌탈)</label>
									<input type="text" id="feeRateRental" name="feeRateRental" class="form-control" placeholder="렌탈 수수료율을 입력해주세요" />
								</div>
								<div class="mb-4">
									<label class="form-label" for="feeRatePenalty">플랫폼 수수료율(위약금)</label>
									<input type="text" id="feeRatePenalty" name="feeRatePenalty" class="form-control" placeholder="위약금 수수료율을 입력해주세요" />
								</div>
								<div class="mb-4">
									<label class="form-label" for="entryFee">입점비</label>
									<input type="text" id="entryFee" name="entryFee" class="form-control" placeholder="입점비를 입력해주세요" />
								</div>
								<div class="mb-4">
									<label class="form-label" for="contractDate">계약일자</label>
									<input type="text" id="contractDate" name="contractDate" class="form-control" placeholder="계약일자를 입력해주세요" />
								</div>
								<div class="mb-4">
									<label class="form-label" for="contractEndDate">계약만료일자</label>
									<input type="text" id="contractEndDate" name="contractEndDate" class="form-control" placeholder="계약만료일자를 입력해주세요" />
								</div>
								<div class="mb-4">
									<label class="form-label" for="entCalDate">월정산일자</label>
									<input type="text" id="entCalDate" name="entCalDate" class="form-control" placeholder="월정산일자를 입력해주세요" />
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</th:block>
</html>
