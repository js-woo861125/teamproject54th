<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{admin/layout/default}">
	<!-- head 삽입공간 -->
	<head>
	</head>
	
	<th:block layout:fragment="jsFile">
	<script type="text/javascript" src="https://cdn.jsdelivr.net/jquery/latest/jquery.min.js"></script>
	<script type="text/javascript" src="https://cdn.jsdelivr.net/momentjs/latest/moment.min.js"></script>
	<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.min.js"></script>
	<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css" />
	
		<script>
			/**
			* 계약일자 & 계약만료일자 달력 및 계약일 계산하기
			*/
			// 현재 날짜를 기준으로 계약일자 계약만료일자 계산 (3년 후 하루 전날) 
			$(function() {
				  function updateContractEndDate(startDateStr) {
				    const start = moment(startDateStr, 'YYYY-MM-DD');
				    const end = moment(start).add(3, 'years').subtract(1, 'days');
				    $('input[name="contractEndDate"]').val(end.format('YYYY-MM-DD'));
				  }
				  
				  // 계약일자 달력
				  $('input[name="contractDate"]').daterangepicker({
				    singleDatePicker: true,
				    showDropdowns: true,
				    autoUpdateInput: true,
				    locale: { format: 'YYYY-MM-DD' },
				    minYear: 2000,
				    maxYear: parseInt(moment().format('YYYY'), 10) + 5
				  }, function(start) {
				    updateContractEndDate(start.format('YYYY-MM-DD'));
				  });

				  // 수동으로 계약일자 선택 시 계약만료일자 계산
				  $('input[name="contractDate"]').on('change', function() {
				    updateContractEndDate($(this).val());
				  });
				});
			// 페이지 로딩 시 계약일자가 있는 경우 계약만료일자 계산
			$(document).ready(function() {
				  const startDateVal = $('input[name="contractDate"]').val();
				  if (startDateVal) {
				    const start = moment(startDateVal, 'YYYY-MM-DD');
				    const end = moment(start).add(3, 'years').subtract(1, 'days');
				    $('input[name="contractEndDate"]').val(end.format('YYYY-MM-DD'));
				  }
				});

			/**
			* 입점업체 대표코드로 입점업체 정보 불러오기
			*/
			$('#entCeoNo').change(function() {
				var entCeoNo = $(this).val();
				
				// 필드 초기화
				$('#memberId').val('');
				$('#entName').val('');
				$('#entBrno').val('');
				$('#entCeoName').val('');
				
				if (entCeoNo) {
					$.ajax({
						url: '/admin/enterprise/entListByNo',
						data: { entCeoNo: entCeoNo },
						success: function(data) {
							if (data) {
								$('#memberId').val(data[0].memberId);
								$('#entName').val(data[0].entName);
								$('#entBrno').val(data[0].entBrno);
								$('#entCeoName').val(data[0].entCeoName);
							} else {
								alert('해당 대표코드에 대한 정보가 없습니다.');
							}
						},
						error: function() {
							alert('서버 요청 중 오류가 발생했습니다.');
						}
					});
				}
			});
		</script>
	</th:block>
	
	<!-- 페이지 삽입공간 -->
	<th:block layout:fragment="content">
		<div class="row">
			<div class="col-6">
				<div class="content-header">
					<h2 class="content-title" th:text="${title}"></h2>
					<div>
						<button type="submit" id="addContract" class="btn btn-md rounded font-sm hover-up">등록</button>
						<button type="reset" onclick="location.href='/admin/enterprise/List'" 
								class="btn btn-light rounded font-sm mr-5 text-body hover-up">등록취소</button>
					</div>
				</div>
			</div>
		</div>
		<div class="row">
			<div class="col-lg-6">
				<div class="card mb-4">
					<div class="card-body">
						<div class="row">
							<div class="col-md-3">
								<h6>1. 입점업체 정보</h6>
							</div>
							<div class="col-md-9">
								<div class="mb-4">
									<label class="form-label" for="entCeoNo">대표코드</label> 
									<select class="form-select" id="entCeoNo" name="entCeoNo">
										<option value="">대표코드를 선택하세요</option>
										<option th:each="e : ${entList}" th:value="${e.ceoCode}" th:text="${e.ceoCode}">
										</option>
									</select>
								</div>
								<div class="mb-4">
									<label class="form-label" for="memberId">대표아이디</label> 
									<input type="text" id="memberId" name="memberId" class="form-control" placeholder="대표코드 넣으면 자동완성" />
								</div>
								<div class="mb-4">
									<label class="form-label" for="entName">업체명</label>
									<input type="text" id="entName" name="entName" class="form-control" placeholder="대표코드 넣으면 자동완성" />
								</div>
								<div class="mb-4">
									<label class="form-label" for="entBrno">사업자번호</label>
									<input type="text" id="entBrno" name="entBrno" class="form-control" placeholder="대표코드 넣으면 자동완성" />
								</div>
								<div class="mb-4">
									<label class="form-label" for="entCeoName">대표명</label>
									<input type="text" id="entCeoName" name="entCeoName" class="form-control" placeholder="대표코드 넣으면 자동완성" />
								</div>
							</div>
						</div>
						<hr class="mb-4 mt-0">
						<div class="row">
							<div class="col-md-3">
								<h6>2. 계약 정보</h6>
							</div>
							<div class="col-md-9">
								<div class="mb-4">
									<label class="form-label" for="managerId">플랫폼 직원 아이디</label>
									<input type="text" id="managerId" name="managerId" class="form-control" placeholder="플랫폼 직원 아이디를 입력해주세요" />
								</div>
								<div class="mb-4">
									<label class="form-label" for="feeRateSales">플랫폼 수수료율(일반판매)</label>
									<input type="text" id="feeRateSales" name="feeRateSales" class="form-control" th:value="${defaultFeeRateSales}" placeholder="일반판매 수수료율을 입력해주세요" />
								</div>
								<div class="mb-4">
									<label class="form-label" for="feeRateRental">플랫폼 수수료율(렌탈)</label>
									<input type="text" id="feeRateRental" name="feeRateRental" class="form-control" th:value="${defaultFeeRateRental}" placeholder="렌탈 수수료율을 입력해주세요" />
								</div>
								<div class="mb-4">
									<label class="form-label" for="feeRatePenalty">플랫폼 수수료율(위약금)</label>
									<input type="text" id="feeRatePenalty" name="feeRatePenalty" class="form-control" th:value="${defaultFeeRatePenalty}" placeholder="위약금 수수료율을 입력해주세요" />
								</div>
								<div class="mb-4">
									<label class="form-label" for="entryFee">입점비</label>
									<input type="text" id="entryFee" name="entryFee" class="form-control" th:value="${defaultEntryFee}" placeholder="입점비를 입력해주세요" />
								</div>
								<div class="mb-4">
									<label class="form-label datepicker" for="contractDate">계약일자</label>
									<input type="text" id="contractDate" name="contractDate" class="form-control datepicker" placeholder="계약일자를 입력해주세요" />
								</div>
								<div class="mb-4">
									<label class="form-label" for="contractEndDate">계약만료일자</label>
									<input type="text" id="contractEndDate" name="contractEndDate" class="form-control" placeholder="계약만료일자를 입력해주세요" />
								</div>
								<div class="mb-4">
									<label class="form-label" for="entCalDate">월정산일자</label>
									<input type="text" id="entCalDate" name="entCalDate" class="form-control" th:value="${defaultEntCalDate}" placeholder="월정산일자를 입력해주세요" />
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</th:block>
</html>
