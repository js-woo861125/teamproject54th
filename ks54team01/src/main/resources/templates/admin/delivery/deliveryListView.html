<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{admin/layout/default}">
	
	<!-- head 삽입공간 -->
	<head>
	
	</head>
	
	<th:block layout:fragment="jsFile">
	
	</th:block>
	
	<th:block layout:fragment="jsScript">
		<script type="text/javascript">
			document.addEventListener("DOMContentLoaded", function () {
			    const links = document.querySelectorAll(".custIdLink");
		
			    links.forEach(link => {
			        link.addEventListener("click", function (e) {
			            e.preventDefault();
			            const custId = this.getAttribute("data-cust-id");
		
			            fetch(`/admin/delivery/customerDeliveryList?custId=${custId}`)
			                .then(response => response.json())
			                .then(data => {
			                    const tbody = document.getElementById("deliveryModalBody");
			                    tbody.innerHTML = ""; // 초기화
		
			                    if (data.length === 0) {
			                        tbody.innerHTML = "<tr><td colspan='5'>배송지가 없습니다.</td></tr>";
			                    } else {
			                        data.forEach(del => {
			                            const row = `
			                                <tr>
			                                    <td>${del.primaryLocation}</td>
			                                    <td>${del.delNm}</td>
			                                    <td>${del.delAddr}</td>
			                                    <td>${del.delDaddr}</td>
			                                    <td>${del.delZipNo}</td>
			                                </tr>
			                            `;
			                            tbody.insertAdjacentHTML("beforeend", row);
			                        });
			                    }
		
			                    const modal = new bootstrap.Modal(document.getElementById("customerDeliveryModal"));
			                    modal.show();
			                });
			        });
			    });
			});
		</script>
	</th:block>
	
	<!-- 페이지 삽입공간 -->
	<th:block layout:fragment="content">
		<div class="content-header">
			<div>
				<h2 class="content-title card-title" th:text="${title}">배송지목록(관리자)</h2>
			</div>
	
		</div>
		<div class="modal fade" id="customerDeliveryModal" tabindex="-1" aria-hidden="true">
			<div class="modal-dialog modal-lg">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title">고객 배송지 목록</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body">
						<table class="table table-bordered">
							<thead>
								<tr>
									<th>기본배송지 여부</th>
									<th>배송지명</th>
									<th>주소</th>
									<th>상세주소</th>
									<th>우편번호</th>
								</tr>
							</thead>
							<tbody id="deliveryModalBody">
								<!-- JS로 채워짐 -->
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
		<div class="card mb-4">
			<header class="card-header">
				<form th:action="@{/admin/delivery/searchDeliveryList}" method="get">
					<div class="row gx-3">
	                   <div class="col-lg-2 col-md-3 col-12">
	                       <select class="form-select" name="searchKey">
	                           <option value="custId" th:selected="${searchKey == 'custId'}">회원아이디</option>
	                           <option value="custNm" th:selected="${searchKey == 'custNm'}">회원이름</option>
	                       </select>
	                   </div>
	                   <div class="col-lg-4 col-md-5">
	                       <input type="text" name="searchValue" th:value="${searchValue}" placeholder="검색어를 입력해주세요" class="form-control" />
	                   </div>
	                   <div class="col-lg-1 col-md-1 me-auto">
						   <button type="submit" class="form-control btn btn-primary p-0 justify-content-center">검색</button>                   
	                   </div>
	               </div>
				</form>
			</header>
			<!-- card-header end// -->
			<div class="card-body">
				<div class="table-responsive">
					<div class="table-responsive">
						<table class="table align-middle table-nowrap mb-0">
							<thead class="table-light text-center">
								<tr>
									<th class="align-middle" scope="col">고객아이디</th>
									<th class="align-middle" scope="col">고객명</th>
									<th class="align-middle" scope="col">주소</th>
									<th class="align-middle" scope="col">상세주소</th>
									<th class="align-middle" scope="col">우편번호</th>
									<th class="align-middle" scope="col">기본배송지여부</th>
									<th class="align-middle" scope="col">등록일</th>
		
								</tr>
							</thead>
							<tbody class="text-center">
								<tr th:if="${!#lists.isEmpty(deliveryList)}" th:each="l : ${deliveryList}">
									<td><a href="#" class="custIdLink" th:data-cust-id="${l.custId}" th:text="${l.custId}">고객아이디</a></td>
									<td th:text="${l.customerInfo.custNm}"><b>고객명</b></td>
									<td th:text="${l.delAddr}">전주시 덕진구 덕진동</td>
									<td th:text="${l.delDaddr}">전주시 덕진구 덕진동</td>
									<td th:text="${l.delZipNo}">54345</td>
									<td th:text="${l.primaryLocation}">기본배송지</td>
									<td th:text="${l.regDate}">03.12.2020</td>
									
								</tr>
								<tr th:unless="${!#lists.isEmpty(deliveryList)}">
                                	<td colspan="12">등록없음</td>
                                </tr>
							</tbody>
						</table>
					</div>
				</div>
				<!-- table-responsive //end -->
			</div>
			<!-- card-body end// -->
		</div>
	</th:block>

</html>
