<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{admin/layout/default}">
	
	<!-- head 삽입공간 -->
	<head>
	
	</head>
	
	<th:block layout:fragment="jsFile">
	
	</th:block>
	
	<th:block layout:fragment="jsScript">
		<script th:inline="javascript">
			$('.sort-by a').click(function(e){
				e.preventDefault();
				const sortValue = $(this).data('sortValue');
				const href = location.href;
				const url = new URL(href); // 현재 url를 가져오고 url 객체를 생성한다.
				const urlParams = url.searchParams; // 현재 url객체의 파라미터를 가져온다.
				urlParams.set('sortValue', sortValue);

				location.href = `${url.pathname}?${urlParams.toString()}`;
			});
			
			
			$('a.page-num').click(function(e){
				e.preventDefault();
				const currentPage = $(this).data('currentPage');
				const href = location.href; // 현재 url 가져온다.
				const url = new URL(href); // 현재 url를 가져오고 url 객체를 생성한다.
				const urlParams = url.searchParams; // 현재 url객체의 파라미터를 가져온다.
				urlParams.set('currentPage', currentPage);
				location.href = `${url.pathname}?${urlParams.toString()}`;
			});
		</script>
	</th:block>
	
	<!-- 페이지 삽입공간 -->
	<th:block layout:fragment="content">
		<div class="content-header">
			<div>
				<h2 class="content-title card-title" th:text="${title}">양수게시글 목록</h2>
			</div>
		</div>
		<div class="card mb-4">
			<header class="card-header">
				<form th:action="@{/admin/assigneeBoard/assigneeBoardList}" method="get">
					<div class="row gx-3 d-flex">
							<!-- <div class="col-lg-2 col-md-3 col-12">
								<select class="form-select">
									<option>회원이름</option>
									<option>주문상태</option>
								</select>
							</div> -->
							<div class="col-lg-4 col-md-5">
								<input class="form-control" type="text" name="searchValue" th:value="${searchValue}" 
	                                	placeholder="게시글 검색어를 입력해주세요." />
							</div>
							<div class="col-lg-1 col-md-1 me-auto">
								<button type="submit"
									class="form-control btn btn-primary p-0 justify-content-center">검색</button>
							</div>
					</div>
				</form>
			</header>
			<div class="card-body">
				<div class="product-list mb-50 col-lg-9 mx-auto">
					<div class="d-flex justify-content-between">
					<div class="totall-product">
						<h4 class="text-body">
							게시글
							<span class="text-brand">&emsp;
								<span th:text="${contentRowCount}">5</span>
							</span>
							<span>건</span>
						</h4>
					</div>
					<th:block th:if="${contentRowCount > 0}">
						<div class="d-flex align-items-center gap-3 flex-wrap sort-by-product-area">
									<div class="sort-by-cover">
								<div class="sort-by">
						      		<a href="#"
							           th:data-sort-value="recentReg"
							           th:classappend="${sortValue} == null or ${sortValue} == 'recentReg' ? ' text-primary fw-bold fs-6' : ' text-dark fw-medium'"
							           class="text-decoration-none">
							        	<span>최근등록순</span>
							     	</a>
							    </div>
					  		</div>
							<div class="sort-by-cover">
						    	<div class="sort-by">
						      		<a href="#"
							           th:data-sort-value="deadline"
							           th:classappend="${sortValue} == 'deadline' ? ' text-primary fw-bold fs-6' : ' text-dark fw-medium'"
							           class="text-decoration-none">
							        	<span>마감임박순</span>
							      	</a>
					    		</div>
					  		</div>
						</div>
					</th:block>
				</div>
					<th:block th:if="${!#lists.isEmpty(assigneeBoardList)}"
								  th:each="l : ${assigneeBoardList}">
		                <!-- 박스 -->
		                <div class="product-cart-wrap border mt-20 mb-50" style="box-shadow:0 6px 12px 0 rgba(0,0,0,.04);">
		                    <div class="product-content-wrap mt-20 mb-30 ml-50">
		                        <div class="d-flex justify-content-between align-items-start">
	                                <h3 class="mb-0 flex-grow-1">
	                                	<a th:text="${#strings.isEmpty(l.productName) ? '상관없음' : l.productName}" 
	                                	   th:href="@{/admin/assigneeBoard/assigneeBoardDetail(assigneeBoardNum=${l.assigneeBoardNum})}"
	                                	   class="text-decoration-none text-dark">
	                               			그램 프로 노트북 16인치 (옵시디안 블랙)
	                                	</a>
	                                </h3>
	                            </div>
		                        <div class="product-rate-cover d-flex justify-content-between">
	                                    <span th:text="${l.productInfoCategory.smCategory}" class="font-small text-muted">TV/디지털</span>
	                            		<div class="d-flex gap-2">
	                            			<span class="mt-1">작성자아이디:</span>
	                            			<h4 class="mr-30" th:text="${l.customerId}"></h4>
	                            		</div>
	                            </div>
		                        <div class="mt-3 mb-4">
                                   	<div class="row g-4">
                                     	<div class="col-12">
                                     		<span class="fw-normal text-primary me-2" style="font-size: 18px; padding-right: 10px;">희망설치지역</span>
                                     		<span th:text="${l.desiredInstallArea}" 
                                     			  class="text-dark" style="font-size: 20px; word-break: keep-all;">전주</span>
                                     	</div>
                                    	<div class="col-5">
                                        	<span class="fw-normal text-primary me-2" style="font-size: 18px; padding-right: 10px;">희망렌탈료</span>
                                        	<span th:text="|₩${#numbers.formatInteger(l.rentalFee, 3, 'COMMA') + ' 이하'}" 
                                        	      class="text-dark" style="font-size: 20px; word-break: keep-all;">상관없음</span>
                                     	</div>
	                                    <div class="col-5">
	                                        <span class="fw-normal text-primary me-2" style="font-size: 18px; padding-right: 10px;">희망계약기간</span>
	                                        <span th:text="${l.remainingMonths} + '개월 이하'" 
	                                        	  class="text-dark" style="font-size: 20px; word-break: keep-all;">상관없음</span>
	                                    </div>
                                   	</div>
                               	</div>
                               	<div class="board d-flex justify-content-end gap-5 mr-30">
								    <div class="d-flex">
								        <p class="mb-0 me-2 fw-semibold">등록일</p>
								        <p class="mb-0 fw-bold" th:text="${l.registerDate}">2025-04-09</p>
								    </div>
								    <div class="d-flex">
								        <p class="mb-0 me-2 fw-semibold">마감일</p>
								        <p class="mb-0 fw-bold" th:text="${l.boardValidDate}">2025-04-09</p>
								    </div>
								</div>
		                    </div>
	               		</div>
	            	</th:block>
	            	<div th:if="${contentRowCount < 1}"
						 class="mt-100" style="text-align: center;">
						<p>게시글이 없습니다.</p>	
					</div>
            	</div>
			</div>
		</div>
            	<div class="pagination-area mt-30 mb-50">
					<nav aria-label="Page navigation example">
						<ul class="pagination justify-content-center">
							<!-- 이전페이지 이동 -->
							<li id="prev-page" class="page-item" th:classappend="${startPageNum < 10} ? 'disabled'">
								<a class="page-link"
								   th:href="@{/admin/payment/paymentList(currentPage=${startPageNum - 1}, searchKey=${searchKey}, searchValue=${searchValue})}">
								   <i class="material-icons md-first_page mt-5"></i>
								</a>
							</li>
							<!-- 페이지 이동  -->
							<th:block th:each="num : ${#numbers.sequence(startPageNum, endPageNum)}" th:if="${contentRowCount > 0}">
								<li class="page-item" th:classappend="${num eq currentPage} ? 'active disabled'">
									<a class="page-link page-num"
									   href="#"
									   th:text="${num < 10 ? '0' + num : num}"
									   th:data-current-page="${num}">01</a>
								</li>
							</th:block>
							<!-- 다음페이지 이동 -->
							<li id="next-page" class="page-item" th:classappend="${(startPageNum + 10) > lastPage} ? 'disabled'">
								<a class="page-link"
								   th:href="@{/admin/payment/paymentList(currentPage=${endPageNum + 1}, searchKey=${searchKey}, searchValue=${searchValue})}">
								   <i class="material-icons md-last_page" style="margin-top : 5px;"></i>
								</a>
							</li>
						</ul>
					</nav>
				</div>
	</th:block>
</html>
