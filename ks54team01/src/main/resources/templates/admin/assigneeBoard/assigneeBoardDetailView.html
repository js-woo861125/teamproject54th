<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{admin/layout/default}">
	
	<!-- head 삽입공간 -->
	<head>
	
	</head>
	
	<th:block layout:fragment="jsFile">
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	</th:block>
	
	<th:block layout:fragment="jsScript">
		<script th:inline="javascript">
			$('.deleteBtn').click(e => {
				e.preventDefault();
				const assigneeBoardNum = $(e.currentTarget).data('assigneeBoardNum');
				Swal.fire({
				  	text: "선택하신 양수 게시글을 삭제하시겠습니까?",
				  	icon: "warning",
				  	showCancelButton: true,
				  	confirmButtonColor: "#3085d6",
				  	cancelButtonColor: "#d33",
				  	confirmButtonText: "삭제",
				  	cancelButtonText: "취소"
				}).then(async (result) => {
						console.log(result);
						
						if (result.isDismissed) return ;
						
						const optionObj = {
								title: '',
								text: '',
								icon: ''
							};
						
						if (result.isConfirmed) {
					    	const request = $.ajax({
								url : '/admin/assigneeBoard/removeAssigneeBoard',
								method : 'post',
								data : { 'assigneeBoardNum' : assigneeBoardNum},
								dataType : 'json',
								async : false
					    	});
					    	request.done(isDelete => {
								if(isDelete) {
								  	optionObj.title = '';
									optionObj.text = '선택하신 양수 게시글이 삭제되었습니다.';
								  	optionObj.icon = 'success';
								}
					    	});
					    	request.fail((jqXHR, textStatus, error) => {
								console.log(jqXHR, textStatus, error);
					    	});
						}
						Swal.fire(optionObj).then(result => history.back());
					});
				});
		</script>
	</th:block>
	
	<!-- 페이지 삽입공간 -->
	<th:block layout:fragment="content">
		<div class="row justify-content-center mt-50">
			<div class="card col-6">
				<header class="card-header">
					<div class="row align-items-end pe-4">
						<div class="col-md-3 ms-auto">
							<a th:data-assignee-board-num="${assigneeBoardInfo.assigneeBoardNum}" 
				         	   class="deleteBtn btn btn-danger w-100 rounded font-lg hover-up text-white justify-content-center fs-6" href="#">
				        		게시글 삭제
				      		</a>
						</div>
					</div>
				</header>
				<div class="card-body">
					<div class="container mb-30">
						<div class="row">
							<div class="col-xl-11 col-lg-12 m-auto">
								<div class="row">
									<div class="product-info mt-30">
										<div class="product-detail accordion-detail" 
											 th:object="${assigneeBoardInfo}">
											<div class="row mb-50 mt-30">
												<div class="col-md-12 col-sm-12 col-xs-12">
													<div class="detail-info pr-30 product-info">
														<h2 th:if="*{productName} == null or *{productName} eq ''" th:text="*{productInfoCategory.smCategory}" class="title-detail mb-30">
			                                            	SK매직 올인원 정수기 양도합니다! 곧 약정 만료됩니다.
			                                            </h2>
			                                            <h2 th:unless="*{productName} == null or *{productName} eq ''" th:text="*{productName}" class="title-detail mb-30">
			                                            	SK매직 올인원 정수기 양도합니다! 곧 약정 만료됩니다.
			                                            </h2>
														<div class="fs-5 row mb-3">
															<div class="fs-5 d-flex flex-column gap-2">
															    <div class="fs-5 d-flex flex-column gap-2 mb-3">
																    <div class="d-flex">
																        <div class="fw-semibold text-nowrap me-3" style="width: 120px;">마감일</div>
																        <div th:text="*{boardValidDate}" class="text-brand">2025-05-05</div>
																    </div>
																    <div class="d-flex">
																        <div class="fw-semibold text-nowrap me-3" style="width: 120px;">희망설치지역</div>
																        <div th:text="*{desiredInstallArea}" class="text-brand">서울 영등포구 버드나루로 11길</div>
																    </div>
																    <div class="d-flex">
																        <div class="fw-semibold text-nowrap me-3" style="width: 120px;">작성자</div>
																        <div th:text="*{customerId}" class="text-brand"></div>
																    </div>
																</div>
															</div>
                                        				</div>
													</div>
													<!-- Detail Info -->
												</div>
											</div>
											<div style="width: 100%; height: 2px; min-height: 1px; margin: 0px; background-color: rgba(112, 115, 124, 0.16);"></div>
											<h3 class="mt-20 mb-20">찾는 상품</h3>
											<div class="product-info">
												<div class="tab-style3">
													<div class="entry-main-content">
														<h4 th:if="*{productName} == null or *{productName} eq ''" th:text="*{productInfoCategory.smCategory}">삼성크리스탈 UHDTV 85인치</h4>
														<h4 th:unless="*{productName} == null or *{productName} eq ''" th:text="*{productName}">삼성크리스탈 UHDTV 85인치</h4>
														<div class="tab-pane fade show active" id="Description">
                                                			<div class="fs-5 d-flex flex-column gap-2 mt-3 mb-3">
												    			<div class="d-flex">
															        <div class="fw-semibold flex-shrink-0 text-nowrap me-3" style="width: 120px;">희망계약기간</div>
															        <div th:text="*{remainingMonths + '개월 이하'}" class="text-brand">24개월</div>
												   				</div>
															    <div class="d-flex">
															        <div class="fw-semibold flex-shrink-0 text-nowrap me-3" style="width: 120px;">희망월렌탈료</div>
															        <div th:text="|₩*{#numbers.formatInteger(rentalFee, 3, 'COMMA') + ' 이하'}" class="text-brand">₩ 20,000</div>
															    </div>
															</div>
			                                                <div style="width: 100%; height: 3px; min-height: 1px; margin: 24px 0px; background-color: rgba(112, 115, 124, 0.16);"></div>
			                                                <h4>기타 전달사항</h4>
			                                                <p th:text="*{assigneeContent}">매월 첫째주에 방문케어 해주십니다!</p>
			                                            </div>
													</div>
												</div>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</th:block>

</html>
