<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{admin/layout/default}">
	<!-- head 삽입공간 -->
	<head>
	</head>
	
	<th:block layout:fragment="jsFile">
		<script>
			/**
			* 카테고리 + 스펙명 중복체크
			*/
			$('#modifySpecBtn').click(function(){
				const specName = $('#specName').val();
				const categoryNo = $('#categoryNo').val();
				
				if (!categoryNo) {
					alert('카테고리를 선택해주세요');
					$('#categoryNo').focus();
					return;
				}
				
				if(!specName){
					alert('스펙명을 입력해주세요');
					$('#specName').focus();
					return ;
				}
				
				$.ajax({
					url : '/admin/productInfo/specNameCheck',
					method : 'post',
					data : {
						'specName': specName,
						'categoryNo' : categoryNo	
					},
					dataType : 'json'
				}).done(function(isDuplicate) {
					if(isDuplicate){
						alert('이미 등록된 스펙명 입니다.');
						$('#specName').focus();
						return ;
					}
				
					$('#modifyProductInfoForm').submit();
			    }).fail(function(jqXHR, textStatus, error) {
			        console.log("에러 발생:", textStatus, error);
			        alert('품목명 확인 중 오류가 발생했습니다.');
			    });
			});
		</script>
	</th:block>
	
	<!-- 페이지 삽입공간 -->
	<th:block layout:fragment="content">
		<div class="content-header">
            <div>
                <h2 class="content-title card-title" th:text="${title}"></h2>
            </div>
        </div>
        <div class="d-flex align-items-center justify-content-center">
	        <div class="card mb-4 col-7">
		        <div class="card-body">
		            <div class="row gx-5">
		                <!-- 본문 영역 -->
		                <div class="col-lg-12">
		                	<form id="modifyProductInfoForm" 
		                		  th:action="@{/admin/productInfo/modifyCategorySpec}" 
		                		  method="post"
		                		  th:object="${specInfo}">
		                    	<section class="content-body p-xl-4">
		                    	
		                            <!-- Hidden -->
		                            <input type="hidden" th:field="*{specNo}" />
		                            <input type="hidden" th:field="*{managerId}" />
			                        
			                    	<!-- 수정 영역 -->
		                            <div class="mb-4">
		                                <label class="form-label fs-6" for="categoryNo">카테고리</label>
		                                <select th:field="*{categoryNo}" class="form-select text-center fs-7" id="categoryNo" name="categoryNo">
		                                    <option value="">카테고리를 선택해주세요</option>
		                                    <th:block th:each="l : ${categoryList}">
		                                        <option th:value="${l.categoryNo}" th:text="${l.lgCategory + ' > ' + l.mdCategory + ' > ' + l.smCategory}"></option>
		                                    </th:block>
		                                </select>
		                            </div>
		                            <div class="mb-4">
		                                <label class="form-label fs-6" for="specName">스펙명</label>
		                                <input type="text" th:field="*{specName}" class="form-control" placeholder="스펙명을 입력해주세요" />
		                            </div>                   
			                        <br/>
			                        <!-- 버튼 -->
		                            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
							              <div class="col-md-2 col-2 ms-auto">
							                  <button type="button" id="modifySpecBtn" 
							                  		  class="btn btn-success w-100 rounded font-lg hover-up text-white justify-content-center fs-6" >수정</button>
							              </div>
							              <div class="col-md-2 col-2">
							                  <button type="reset" onclick="location.href='/admin/productInfo/categorySpecList'" 
							                  		  class="btn btn-warning w-100 rounded font-lg hover-up text-white fs-6 justify-content-center" >수정취소</button>
							              </div>
							        </div>
		                   		</section>
		                	</form>
		                </div>
		            </div>
		   		</div>
	        </div>
		</div>        
	</th:block>

</html>
