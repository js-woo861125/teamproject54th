<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{admin/layout/default}">
	<!-- head 삽입공간 -->
	<head>
		<style>
		.select-disabled {
		    pointer-events: none;
		    background-color: #f8f9fa;
		    appearance: none;
		    -moz-appearance: none;
		    -webkit-appearance: none;
		    background-image: none !important;
		}
		</style>
	</head>

	<th:block layout:fragment="jsFile">
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	</th:block>
	
	<th:block layout:fragment="jsScript">
		<script>
			/**
			* 사용유무 셀렉트박스 선택 시 자동 필터
			*/
			$(document).ready(function() {
				$('#useStatus').on('change', function() {
					$(this).closest('form').submit();
				});
			});
		
			/**
			* 사용유무 상태 변경
			*/
			$(document).on('change', '.toggle-use-status', function() {
				const $checkbox = $(this);
				const isChecked = $checkbox.is(':checked');
				const benefitNo = $checkbox.data('benefitNo');
				const $badge = $checkbox.closest('td').find('span.badge');				
	
				const useStatus = isChecked ? '사용중' : '사용불가';
				
				// 변경 시 확인메시지 띄우기
				const confirmMessage = isChecked
					? '사용중으로 상태를 변경하시겠습니까?'
					: '사용불가로 상태를 변경하시겠습니까?'				
	
				if(confirm(confirmMessage)) {
					$.ajax({
						url: '/admin/productInfo/updateBenefit',
						method: 'post',
						data: {
							benefitNo: benefitNo,
							useStatus: useStatus
						},
						success: function(response) {
							// 상태 변경되었을 경우
							if(useStatus === '사용중') {
								$badge.text('사용중')
									  .removeClass('alert-danger')
									  .addClass('alert-success');
							} else {
								$badge.text('사용불가')
									  .removeClass('alert-success')
									  .addClass('alert-danger');
							}
						},
						error: function(jqXHR) {
							console.log(jqXHR.responseText);
							alert('상태 변경 중 오류가 발생했습니다');
							$checkbox.prop('checked', !isChecked);
						}
					});
				// 취소 시 원상 복구
				} else {
					$checkbox.prop('checked', !isChecked);	
				}			
			});
			
			/**
			* 혜택 삭제
			*/
			$('.remove-btn').click(e => {
				e.preventDefault();
				const benefitNo = $(e.target).data('benefitNo');
				
				Swal.fire({
					  title: "혜택 삭제",
					  text: "혜택을 삭제하시겠습니까?",
					  icon: "warning",
					  showCancelButton: true,
					  confirmButtonColor: "#3085d6",
					  cancelButtonColor: "#d33",
					  confirmButtonText: "삭제"
					}).then((result) => {
					  if (result.isConfirmed) {
						$.ajax({  
				            url: '/admin/productInfo/removeBenefit',
				            method: 'post',
				            data: { benefitNo },
				            dataType: 'json',
				            success: function(response) {
								if (response.success) {
									Swal.fire({
										title: "삭제 완료",
										text: "삭제되었습니다.",
										icon: "success"
									}).then(() => {
										location.reload();
									});
								} else {
									Swal.fire({
										title: "삭제 불가",
										text: response.message || "삭제할 수 없습니다.",
										icon: "error"
									});
								}
							},
							error: function(xhr) {
								try {
									const response = JSON.parse(xhr.responseText);
									Swal.fire({
										title: "삭제 불가",
										text: response.message || "삭제할 수 없습니다.",
										icon: "error"
									});
								} catch (e) {
									Swal.fire({
										title: "오류",
										text: "삭제 중 오류가 발생했습니다.",
										icon: "error"
									});
								}
							}
						});
					}
				});
			});	
		</script>		
	</th:block>
	
	<!-- 본문 content 영역 -->
	<th:block layout:fragment="content">
	<div class="content-header">
		<h2 class="content-title card-title" th:text="${title}"></h2>
		<button type="submit" class="btn btn-md rounded font-lg hover-up" onclick="location.href='/admin/productInfo/addBenefit'">등록</button>
	</div>
	<div class="card mb-4 col-12">
			<header class="card-header">
				<form th:action="@{/admin/productInfo/searchBenefit}" method="get">
					<div class="row gx-3">
	                   <div class="col-lg-2 col-md-3 col-12">
	                       <select class="form-select select-disabled">
	                           <option selected>혜택명</option>
	                       </select>
	                       <input type="hidden" name="searchKey" value="benefitName" />
	                   </div>
	                   <div class="col-lg-4 col-md-5">
	                       <input type="text" name="searchValue" th:value="${searchValue}" placeholder="검색어를 입력해주세요" class="form-control" />
	                   </div>
	                   <div class="col-lg-1 col-md-1 me-auto">
						   <button type="submit" class="form-control btn btn-primary p-0 justify-content-center">검색</button>                   
	                   </div>
	                   <div class="col-lg-2 col-md-3 col-12">
	                       <select class="form-select" name="useStatus" id="useStatus">
	                           <option value="">사용유무</option>
	                           <option value="사용중"  th:selected="${useStatus eq '사용중'}">사용중</option>
	                           <option value="사용불가" th:selected="${useStatus eq '사용불가'}">사용불가</option>
	                       </select>
	                   </div>	                   
	               </div>
				</form>
			</header>
		<div class="card-body">
			<div class="row gx-4">
				<!-- 사이드 메뉴 -->
				<aside class="col-lg-2 border-end">
					<nav class="nav nav-pills flex-column mb-4">
						<a class="nav-link" th:href="@{/admin/productInfo/categoryList}">카테고리</a>
						<a class="nav-link" th:href="@{/admin/productInfo/brandList}">브랜드</a>
						<a class="nav-link" th:href="@{/admin/productInfo/itemList}">품목</a>
						<a class="nav-link" th:href="@{/admin/productInfo/modelList}">모델</a>
						<a class="nav-link active" aria-current="page" th:href="@{/admin/productInfo/benefitList}">전체혜택</a> 
						<a class="nav-link" th:href="@{/admin/productInfo/categorySpecList}">카테고리별/상세스펙</a>
						<a class="nav-link" th:href="@{/admin/productInfo/modelSpecList}">모델별/상세스펙</a>
					</nav>
				</aside>
					
				<!-- 전체혜택 목록 -->
				<div class="col-lg-10">
					<form id="productInfoListForm" th:action="@{/admin/productInfo/benefitList}" method="post">
						<div class="table-responsive">
							<table class="table table-hover text-center">
								<thead>
									<tr>
										<th>No.</th>
										<th>혜택코드</th>
										<th>혜택명</th>
										<th>사용유무</th>
										<th>등록일자</th>
										<th>수정일자</th>
										<th>수정/삭제</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="l, index : ${benefitList}" th:if="${!#lists.isEmpty(benefitList)}">
										<td th:text="${index.count}">1</td>
										<td th:text="${l.benefitNo}">benefit_1</td>
										<td th:text="${l.benefitName}">방문케어</td>
                                        <td>
                                        	<div class="d-flex align-items-center justify-content-center gap-2">
                                        		<div class="form-check form-switch m-0">
                                        			<input class="form-check-input toggle-use-status" type="checkbox" th:checked="${l.useStatus == '사용중'}" th:data-benefit-no="${l.benefitNo}" />
												</div>
	                                            <span class="badge rounded-pill"
	                                                  th:classappend="${l.useStatus == '사용중'} ? 'alert-success' : 'alert-danger'"
	                                                  th:text="${l.useStatus}">사용중</span>
                                        	</div>          
                                        </td>
										<td th:text="${l.benefitRegDate}">2023-01-01 10:00:00</td>
										<td th:text="${l.benefitRevDate}">2023-01-01 10:00:00</td>
										<td>
											<div class="dropdown">
												<a href="#" class="btn btn-light rounded btn-sm font-sm" data-bs-toggle="dropdown">
													<i class="material-icons md-more_horiz"></i>
												</a>
												<div class="dropdown-menu">
													<a class="dropdown-item" th:href="@{/admin/productInfo/modifyBenefit(benefitNo=${l.benefitNo})}">수정</a>
													<a class="dropdown-item text-danger remove-btn" href="#" th:data-benefit-no=${l.benefitNo}>삭제</a>
												</div>
											</div>
										</td>
									</tr>
									<tr th:unless="${not #lists.isEmpty(benefitList)}">
										<td colspan="7">등록된 혜택이 없습니다.</td>
									</tr>
								</tbody>
							</table>
						</div>
					</form>	
				</div>
			</div>
		</div>
	</div>
</html>
