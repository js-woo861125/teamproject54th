<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout/default}">
	<!-- head 삽입공간 -->
	<head>
	</head>

	<th:block layout:fragment="jsFile">
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	</th:block>
	
	<th:block layout:fragment="jsScript">
		<script>
			/**
			* 페이징
			*/
			const rowPerPage = /*[[${rowPerPage}]]*/'';
			if (rowPerPage) {
			  $('.page-link').each((idx, item) => {
			    let href = $(item).attr('href');
			    let separator = href.includes('?') ? '&' : '?';
			    href += `${separator}rowPerPage=${rowPerPage}`;
			    $(item).attr('href', href);
			  });
			}

			$('#rowPerPage').change(function () {
			  const url = new URL(location.href);
			  const urlParams = url.searchParams;

			  // currentPage를 1로 초기화 (페이징 변경 시 항상 1페이지부터)
			  urlParams.set('currentPage', '1');
			  // rowPerPage는 select값으로 세팅
			  urlParams.set('rowPerPage', $(this).val());

			  // location.href 갱신
			  location.href = `${url.pathname}?${urlParams.toString()}`;
			});
			
			/**
			* 사용유무 셀렉트박스 선택 시 자동 필터
			*/
			$(document).ready(function() {
				$('#useStatus').on('change', function() {
					$(this).closest('form').submit();
				});
			});
		
			/**
			* 사용유무 상태 변경
			*/
			$(document).on('change', '.toggle-use-status', function() {
				const $checkbox = $(this);
				const isChecked = $checkbox.is(':checked');
				const brandNo = $checkbox.data('brandNo');
				const $badge = $checkbox.closest('td').find('span.badge');				
	
				const useStatus = isChecked ? '사용중' : '사용불가';
				
				// 변경 시 확인메시지 띄우기
				const confirmMessage = isChecked
					? '사용중으로 상태를 변경하시겠습니까?'
					: '사용불가로 상태를 변경하시겠습니까?'				
	
				if(confirm(confirmMessage)) {
					$.ajax({
						url: '/admin/productInfo/updateBrand',
						method: 'post',
						data: {
							brandNo: brandNo,
							useStatus: useStatus
						},
						success: function(response) {
							// 상태 변경되었을 경우
							if(useStatus === '사용중') {
								$badge.text('사용중')
									  .removeClass('alert-danger')
									  .addClass('alert-success');
							} else {
								$badge.text('사용불가')
									  .removeClass('alert-success')
									  .addClass('alert-danger');
							}
						},
						error: function(jqXHR) {
							console.log(jqXHR.responseText);
							alert('상태 변경 중 오류가 발생했습니다');
							$checkbox.prop('checked', !isChecked);
						}
					});
				// 취소 시 원상 복구
				} else {
					$checkbox.prop('checked', !isChecked);	
				}			
			});
			
			/**
			* 브랜드 삭제
			*/
			$('.remove-btn').click(e => {
				e.preventDefault();
				const brandNo = $(e.target).data('brandNo');
				
				Swal.fire({
					  title: "브랜드 삭제",
					  text: "브랜드를 삭제하시겠습니까?",
					  icon: "warning",
					  showCancelButton: true,
					  confirmButtonColor: "#3085d6",
					  cancelButtonColor: "#d33",
					  confirmButtonText: "삭제"
					}).then((result) => {
					  if (result.isConfirmed) {
						$.ajax({  
				            url: '/admin/productInfo/removeBrand',
				            method: 'post',
				            data: { 'brandNo': brandNo },
				            dataType: 'json',
				            success: function(response) {
							    Swal.fire({
							      title: "삭제 완료",
							      text: "삭제되었습니다.",
							      icon: "success"
							    }).then(() => {
							    	location.reload();
		                        });
		                    }
		                });
		            }
		        });
		    });	
		</script>
	</th:block>
	
	<!-- 본문 content 영역 -->
	<th:block layout:fragment="content">
	    <div class="content-header">
	        <h2 class="content-title card-title" th:text="${title}"></h2>
	    </div>
		<div class="card mb-4 col-12">
			<header class="card-header">
				<!-- 검색 기능 -->
				<form th:action="@{/admin/productInfo/searchBrand}" method="get">
					<div class="row gx-3">
	                   <div class="col-lg-2 col-md-3 col-12">
	                       <select class="form-select" name="searchKey">
	                           <option value="brandName" th:selected="${searchKey == 'brandName'}">브랜드명</option>
	                       </select>
	                   </div>
	                   <div class="col-lg-4 col-md-5">
	                       <input type="text" name="searchValue" th:value="${searchValue}" placeholder="검색어를 입력해주세요" class="form-control" />
	                   </div>
	                   <div class="col-lg-1 col-md-1 me-auto">
						   <button type="submit" class="form-control btn btn-primary p-0 justify-content-center">검색</button>                   
	                   </div>
	                   <div class="col-lg-2 col-md-3 col-12">
	                       <select class="form-select" name="useStatus" id="useStatus">
	                           <option value="">사용유무</option>
	                           <option value="사용중"  th:selected="${useStatus eq '사용중'}">사용중</option>
	                           <option value="사용불가" th:selected="${useStatus eq '사용불가'}">사용불가</option>
	                       </select>
	                   </div>	                   
	                   <div class="col-lg-2 col-md-3 col-12">
	                       <select class="form-select" name="rowPerPage" id="rowPerPage">
	                           <option value="5"  th:selected="${rowPerPage eq 5}">5</option>
	                           <option value="10" th:selected="${rowPerPage eq 10}">10</option>
	                           <option value="15" th:selected="${rowPerPage eq 15}">15</option>
	                       </select>
	                   </div>	                   
	               </div>
	               <input type="hidden" name="currentPage" th:value="currentPage" />
				</form>
			</header>
	        <div class="card-body">
	            <div class="row gx-4">
	                <!-- 사이드 메뉴 -->
	                <aside class="col-lg-2 border-end">
	                    <nav class="nav nav-pills flex-column mb-4">
	                        <a class="nav-link" th:href="@{/admin/productInfo/categoryList}">카테고리</a>
	                        <a class="nav-link active" th:href="@{/admin/productInfo/brandList}">브랜드</a>
	                        <a class="nav-link" th:href="@{/admin/productInfo/itemList}">품목</a>
	                        <a class="nav-link" th:href="@{/admin/productInfo/modelList}">모델</a>
	                        <a class="nav-link" th:href="@{/admin/productInfo/benefitList}">전체혜택</a>
	                        <a class="nav-link" th:href="@{/admin/productInfo/categorySpecList}">카테고리별/상세스펙</a>
	                        <a class="nav-link" th:href="@{/admin/productInfo/modelSpecList}">모델별/상세스펙</a>
	                    </nav>
	                </aside>
	
	                <!-- 브랜드 목록 -->
	                <div class="col-lg-10">
	                    <form id="productInfoListForm" th:action="@{/admin/productInfo/brandList}" method="post">
	                        <div class="table-responsive">
	                            <table class="table table-hover text-center">
	                                <thead>
	                                    <tr>
	                                        <th>No.</th>
	                                        <th>브랜드코드</th>
	                                        <th>브랜드명</th>
	                                        <th>사용유무</th>
	                                        <th>등록일자</th>
	                                        <th>수정일자</th>
	                                        <th>수정/삭제</th>
	                                    </tr>
	                                </thead>
	                                <tbody>
	                                    <tr th:each="l, index : ${brandList}" th:if="${!#lists.isEmpty(brandList)}">
	                                        <td th:text="${index.count}">1</td>
	                                        <td th:text="${l.brandNo}">brand_1</td>
	                                        <td th:text="${l.brandName}">삼성</td>
	                                        <td>
	                                        	<div class="d-flex align-items-center justify-content-center gap-2">
	                                        		<div class="form-check form-switch m-0">
	                                        			<input class="form-check-input toggle-use-status" type="checkbox" th:checked="${l.useStatus == '사용중'}" th:data-brand-no="${l.brandNo}" />
													</div>
		                                            <span class="badge rounded-pill"
		                                                  th:classappend="${l.useStatus == '사용중'} ? 'alert-success' : 'alert-danger'"
		                                                  th:text="${l.useStatus}">사용중</span>
	                                        	</div>          
	                                        </td>
	                                        <td th:text="${l.brandRegDate}">2023-01-01 10:00:00</td>
	                                        <td th:text="${l.brandRevDate}">2023-01-01 10:00:00</td>
	                                        <td>
	                                            <div class="dropdown">
	                                                <a href="#" class="btn btn-light rounded btn-sm font-sm" data-bs-toggle="dropdown">
	                                                    <i class="material-icons md-more_horiz"></i>
	                                                </a>
	                                                <div class="dropdown-menu">
	                                                    <a class="dropdown-item" th:href="@{/admin/productInfo/modifyBrand(brandNo=${l.brandNo})}">수정</a>
	                                                    <a class="dropdown-item text-danger remove-btn" href="#" th:data-brand-no=${l.brandNo}>삭제</a>
	                                                </div>
	                                            </div>
	                                        </td>
	                                    </tr>
	                                    <tr th:unless="${not #lists.isEmpty(brandList)}">
	                                        <td colspan="7">등록된 브랜드가 없습니다.</td>
	                                    </tr>
	                                </tbody>
	                            </table>
	                        </div>
	                    </form>
	                </div>
	            </div>
	        </div>
	    </div>
	    <div class="pagination-area mt-30 mb-50">
            <nav aria-label="Page navigation example">
                <ul class="pagination justify-content-center">
                	<li class="page-item">
                        <a class="page-link" th:href="@{/admin/productInfo/brandList(rowPerPage=${rowPerPage})}"><i class="material-icons md-first_page"></i></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage < 2} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/productInfo/brandList(currentPage=${currentPage - 1}, rowPerPage=${rowPerPage})}">
                        	<i class="material-icons md-chevron_left"></i>
                        </a>
                    </li>
                    <th:block th:each="num : ${#numbers.sequence(startPageNum, endPageNum)}">
	                    <li class="page-item" th:classappend="${num eq currentPage} ? 'active disabled'">
	                    	<a class="page-link" th:href="@{/admin/productInfo/brandList(currentPage=${num}, rowPerPage=${rowPerPage}, searchKey=${searchKey}, searchValue=${searchValue}, useStatus=${useStatus})}"
	                    	   th:text="${num < 10 ? '0' + num : num}">01</a>
	                    </li>                    
                    </th:block>
                    <li class="page-item" th:classappend="${currentPage eq lastPage} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/productInfo/brandList(currentPage=${currentPage + 1}, rowPerPage=${rowPerPage})}">
                        	<i class="material-icons md-chevron_right"></i>
                        </a>
                    </li>
                    <li class="page-item">
                        <a class="page-link" th:href="@{/admin/productInfo/brandList(currentPage=${lastPage}, rowPerPage=${rowPerPage})}">
                        	<i class="material-icons md-last_page"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
	</th:block>
</html>
