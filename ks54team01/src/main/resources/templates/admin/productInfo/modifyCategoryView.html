<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{admin/layout/default}">
	<!-- head 삽입공간 -->
	<head>
	</head>
	
	<th:block layout:fragment="jsFile">
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	</th:block>
	
	<th:block layout:fragment="jsScript">
		<script>
		/**
		* 대분류 + 중분류 + 소분류 중복체크
		*/
		$('#modifyCategoryBtn').click(function(){
			const lgCategory = $('#lgCategory').val();
			const mdCategory = $('#mdCategory').val();
			const smCategory = $('#smCategory').val();
			
			if(!lgCategory){
				Swal.fire('', '대분류를 입력해주세요.', 'warning');
				$('#lgCategory').focus();
				return ;
			}
			
			if (!mdCategory) {
				Swal.fire('', '중분류를 입력해주세요.', 'warning');
				$('#mdCategory').focus();
				return;
			}
			
			if (smCategory.trim().length === 0) {
				Swal.fire('', '소분류를 입력해주세요.', 'warning');
				$('#smCategory').focus();
				return;
			}
			if (smCategory.length > 10) {
				Swal.fire('', '소분류는 10자 이내로 입력해주세요.', 'warning');
				$('#smCategory').focus();
				return;
			}
			const validRegex = /^[가-힣a-zA-Z0-9.,~()+\/\s]+$/;
			if (!validRegex.test(smCategory)) {
				Swal.fire('', '특수문자는 . , ~ ( ) + / 만 사용 가능합니다.', 'warning');
				$('#smCategory').focus();
				return; 
			}
			// 중복 체크
			$.ajax({
				url : '/admin/productInfo/categoryCheck',
				method : 'post',
				data : {
					'lgCategory': lgCategory,
					'mdCategory' : mdCategory,
					'smCategory' : smCategory
				},
				dataType : 'json'
			}).done(function(isDuplicate) {
				if(isDuplicate){
					Swal.fire('', '이미 등록된 카테고리 입니다.', 'warning');
					$('#smCategory').focus();
					return ;
				}
			
				$('#modifyProductInfoForm').submit();
		    }).fail(function(jqXHR, textStatus, error) {
		        console.log("에러 발생:", textStatus, error);
		        Swal.fire('', '카테고리 수정 중 오류가 발생했습니다.', 'warning');
		    });
		});
		</script>		
	</th:block>
	
	<!-- 페이지 삽입공간 -->
	<th:block layout:fragment="content">
		<div class="content-header">
			<div>
				<h2 class="content-title card-title" th:text="${title}"></h2>
			</div>
		</div>
		<div class="d-flex align-items-center justify-content-center">
			<div class="card mb-4 col-7">
				<div class="card-body">
					<div class="row gx-4">
						
						<!-- 본문 영역 -->
						<div class="col-lg-12">
							<form id="modifyProductInfoForm" th:action="@{/admin/productInfo/modifyCategory}" method="post" th:object="${categoryInfo}">
								<section class="content-body p-xl-4">
								
									<!-- Hidden Inputs -->
									<input type="hidden" id="categoryNo" name="categoryNo" th:value="*{categoryNo}" />
									<input type="hidden" id="managerId" name="managerId" th:value="*{managerId}" />
	
									<!-- 수정 영역 -->
									<div class="row mb-4">
		                                <label class="form-label fs-6" for="lgCategory">대분류</label>
										<input type="text" id="lgCategory" name="lgCategory" th:value="*{lgCategory}" 
											   class="form-control" placeholder="대분류를 입력해주세요" />
		                            </div>
									<div class="row mb-4">
										<label class="form-label fs-6" for="lgCategoryNo">대분류코드</label>
										<input type="text" id="lgCategoryNo" name="lgCategoryNo" th:value="*{lgCategoryNo}" class="form-control" readonly/>
									</div>
									<div class="row mb-4">
		                                <label class="form-label fs-6" for="mdCategory">중분류</label>
										<input type="text" id="mdCategory" name="mdCategory" th:value="*{mdCategory}" 
											   class="form-control" placeholder="중분류를 입력해주세요" />
		                            </div>
									<div class="row mb-4">
										<label class="form-label fs-6" for="mdCategoryNo">중분류코드</label>
										<input type="text" id="mdCategoryNo" name="mdCategoryNo" th:value="*{mdCategoryNo}" class="form-control"readonly/>
									</div>
									<div class="row mb-4">
										<label class="form-label fs-6" for="smCategory">소분류</label>
										<input type="text" id="smCategory" name="smCategory" th:value="*{smCategory}" 
											   class="form-control" placeholder="소분류를 입력해주세요" />
									</div>
									<br />
									<!-- 버튼 -->
									<div class="d-grid gap-2 d-md-flex justify-content-md-end">
										<div class="col-md-2 col-2 ms-auto">
											<button type="button" id="modifyCategoryBtn" 
													class="btn btn-success w-100 rounded font-lg hover-up text-white justify-content-center fs-6">수정</button>
										</div>
										<div class="col-md-2 col-2">
											<button type="reset" onclick="location.href='/admin/productInfo/categoryList'" 
													class="btn btn-warning w-100 rounded font-lg hover-up text-white justify-content-center fs-6">수정취소</button>
										</div>
									</div>
								</section>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>	
	</th:block>

</html>
