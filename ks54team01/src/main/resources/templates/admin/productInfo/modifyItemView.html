<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout/default}">
	<!-- head 삽입공간 -->
	<head>
	</head>
	
	<th:block layout:fragment="jsFile">
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	</th:block>
	
	<th:block layout:fragment="jsScript">
		<script th:inline="javascript">
		const categoryList = JSON.parse(/*[[${categoryListJson}]]*/ '[]');
		const selectedCategoryNo = /*[[${itemInfo.categoryNo}]]*/ 0;
		</script>
		
		<script>
		$(document).ready(function () {
		    const $lg = $('#lgCategory');
		    const $md = $('#mdCategory');
		    const $sm = $('#smCategory');
		    // 대분류 선택 > 해당 중분류 선택 > 해당 소분류 선택
		    const lgSet = [...new Set(categoryList.map(c => c.lgCategory))];
		    lgSet.forEach(lg => $lg.append(new Option(lg, lg)));

		    $lg.change(function () {
		        const selectedLg = $(this).val();
		        $md.empty().append(new Option('중분류를 선택해주세요', '')).prop('disabled', !selectedLg);
		        $sm.empty().append(new Option('소분류를 선택해주세요', '')).prop('disabled', true);

		        if (!selectedLg) return;

		        const mdSet = [...new Set(categoryList
		            .filter(c => c.lgCategory === selectedLg)
		            .map(c => c.mdCategory))];
		        mdSet.forEach(md => $md.append(new Option(md, md)));
		    });

		    $md.change(function () {
		        const selectedLg = $lg.val();
		        const selectedMd = $(this).val();
		        $sm.empty().append(new Option('소분류를 선택해주세요', '')).prop('disabled', !(selectedLg && selectedMd));

		        if (!(selectedLg && selectedMd)) return;

		        const smList = categoryList
		            .filter(c => c.lgCategory === selectedLg && c.mdCategory === selectedMd);
		        smList.forEach(c => $sm.append(new Option(c.smCategory, c.categoryNo)));
		    });
		    
		    // 수정하려는 기존 카테고리 정보 가져오기
		    if (selectedCategoryNo) {
		        const selectedCategory = categoryList.find(c => c.categoryNo == selectedCategoryNo);

		        if (selectedCategory) {
		            // 대분류 먼저 설정
		            $lg.val(selectedCategory.lgCategory).trigger('change');

		            // 중분류 → 소분류는 약간 딜레이 후 실행
		            setTimeout(() => {
		                $md.val(selectedCategory.mdCategory).trigger('change');

		                setTimeout(() => {
		                    $sm.val(selectedCategory.categoryNo).prop('disabled', false);
		                }, 100);
		            }, 100);
		        }
		    }
		});
		
			/**
			* 카테고리 + 품목명 중복체크
			*/
			$('#modifyItemBtn').click(function(){
				const itemName = $('#itemName').val();
				const categoryNo = $('#smCategory').val();
				
				if (!categoryNo) {
					alert('카테고리를 선택해주세요');
					$('#categoryNo').focus();
					return;
				}
				
				if(!itemName){
					alert('품목명을 입력해주세요');
					$('#itemName').focus();
					return ;
				}
				
				$.ajax({
					url : '/admin/productInfo/itemNameCheck',
					method : 'post',
					data : {
						'itemName': itemName,
						'categoryNo' : categoryNo	
					},
					dataType : 'json'
				}).done(function(isDuplicate) {
					if(isDuplicate){
						alert('이미 등록된 품목명 입니다.');
						$('#itemName').focus();
						return ;
					}
				
					$('#modifyProductInfoForm').submit();
			    }).fail(function(jqXHR, textStatus, error) {
			        console.log("에러 발생:", textStatus, error);
			        alert('품목명 확인 중 오류가 발생했습니다.');
			    });
			});
		</script>
	</th:block>
	
	<!-- 페이지 삽입공간 -->
	<th:block layout:fragment="content">
	    <div class="content-header">
	        <div>
	            <h2 class="content-title card-title" th:text="${title}"></h2>
	        </div>
	    </div>
	    <div class="d-flex align-items-center justify-content-center">
		    <div class="card mb-4 col-7">
		        <div class="card-body">
		            <div class="row gx-5">
		
		                <!-- 본문 영역 -->
		                <div class="col-lg-12">
		                    <form id="modifyProductInfoForm"
		                          th:action="@{/admin/productInfo/modifyItem}"
		                          method="post"
		                          th:object="${itemInfo}">
		                        <section class="content-body p-xl-4">
		
		                            <!-- Hidden -->
		                            <input type="hidden" th:field="*{itemNo}" />
		                            <input type="hidden" th:field="*{managerId}" />
		
		                            <!-- 수정 영역 -->
		                            <div class="mb-4">
		                                <label class="form-label fs-6" for="categoryNo">카테고리</label>
		                                <select class="form-select text-center fs-7" id="lgCategory"> 
		                                    <option value=""> 대분류를 선택해주세요 </option>
		                                </select>
	                                	<br />
		                                <select class="form-select text-center fs-7" id="mdCategory" disabled> 
		                                    <option value=""> 중분류를 선택해주세요 </option>
		                                </select>
	                                	<br />
		                                <select class="form-select text-center fs-7" id="smCategory" name="categoryNo" disabled>
		                                    <option value=""> 소분류를 선택해주세요 </option>
		                                </select>
		                            </div>
		                            <div class="mb-4">
		                                <label class="form-label fs-6" for="itemName">품목명</label>
		                                <input type="text" th:field="*{itemName}" class="form-control" placeholder="품목명을 입력해주세요" />
		                            </div>
									<br />
		                            <!-- 버튼 -->
		                            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
		                                <div class="col-md-2 col-2 ms-auto">
		                                    <button type="button" id="modifyItemBtn" 
		                                    		class="btn btn-success w-100 rounded font-lg hover-up text-white fs-6 justify-content-center">수정</button>
		                                </div>
		                                <div class="col-md-2 col-2">
		                                    <button type="reset" onclick="location.href='/admin/productInfo/itemList'"
		                                            class="btn btn-warning w-100 rounded font-lg hover-up text-white fs-6 justify-content-center">수정취소</button>
		                                </div>
		                            </div>
		                        </section>
		                    </form>
		                </div>
		            </div>
		        </div>
		    </div>
		</div>	    
	</th:block>

</html>
