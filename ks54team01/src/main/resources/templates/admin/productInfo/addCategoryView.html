<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{admin/layout/default}">
	<!-- head 삽입공간 -->
	<head>
	</head>
	
	<th:block layout:fragment="jsFile">
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	</th:block>
	
	<th:block layout:fragment="jsScript">
		<script>
		/**
		* 대분류 선택 시 대분류코드 자동 입력
		*/
		$('#lgCategory').on('input', function(){
			const val = $(this).val();
			let codeMatch = '';
			$('#lgCategoryList option').each(function() {
				if ($(this).val() === val) {
					codeMatch = $(this).data('lg-category-no');
				}
			});
			if(codeMatch) {
				$('#lgCategoryNo').val(codeMatch);
			} 
		});
		
		/**
		* 중분류 선택 시 중분류코드 자동 입력
		*/
		$('#mdCategory').on('input', function(){
			const val = $(this).val();
			let codeMatch = '';
			$('#mdCategoryList option').each(function() {
				if ($(this).val() === val) {
					codeMatch = $(this).data('md-category-no');
				}
			});
			if(codeMatch) {
				$('#mdCategoryNo').val(codeMatch);
			}
		});
		
		$('#addCategoryBtn').click(function(){
			const lgCategory = $('#lgCategory').val();
			const mdCategory = $('#mdCategory').val();
			const smCategory = $('#smCategory').val();
			// 유효성 체크
			if(!lgCategory){
				Swal.fire('', '대분류를 선택하거나 입력해주세요.', 'warning');
				$('#lgCategory').focus();
				return ;
			}
			if (!mdCategory) {
				Swal.fire('', '중분류를 선택하거나 입력해주세요.', 'warning');
				$('#mdCategory').focus();
				return;
			}
			if (smCategory.trim().length === 0) {
				Swal.fire('', '소분류를 입력해주세요.', 'warning');
				$('#smCategory').focus();
				return;
			}
			if (smCategory.length > 10) {
				Swal.fire('', '소분류는 10자 이내로 입력해주세요.', 'warning');
				$('#smCategory').focus();
				return;
			}
			const validRegex = /^[가-힣a-zA-Z0-9.,~()+\/\s]+$/;
			if (!validRegex.test(smCategory)) {
				Swal.fire('', '특수문자는 . , ~ ( ) + / 만 사용 가능합니다.', 'warning');
				$('#smCategory').focus();
				return; 
			}
			// 중복 체크
			$.ajax({
				url : '/admin/productInfo/categoryCheck',
				method : 'post',
				data : {
					'lgCategory': lgCategory,
					'mdCategory' : mdCategory,
					'smCategory' : smCategory
				},
				dataType : 'json'
			}).done(function(isDuplicate) {
				if(isDuplicate){
					Swal.fire('', '이미 등록된 카테고리 입니다.', 'warning');
					$('#itemName').focus();
					return ;
				}
			
				$('#addProductInfoForm').submit();
		    }).fail(function(jqXHR, textStatus, error) {
		        console.log("에러 발생:", textStatus, error);
		        Swal.fire('', '카테고리 등록 중 오류가 발생했습니다.', 'error');
		    });
		});
		</script>	
	</th:block>
	
	<!-- 페이지 삽입공간 -->
	<th:block layout:fragment="content">
		<div class="content-header">
            <div>
                <h2 class="content-title card-title" th:text="${title}"></h2>
            </div>
        </div>
        <div class="d-flex align-items-center justify-content-center">
	        <div class="card mb-4 col-8">
		        <div class="card-body">
	            	<div class="row gx-4">
	            		<!-- 사이드 메뉴 -->
	                	<aside class="col-lg-3 border-end">
	                    	<nav class="nav nav-pills flex-column mb-4">
	                        	<a class="nav-link active" aria-current="page" th:href="@{/admin/productInfo/addCategory}">카테고리</a>
	                            <a class="nav-link" th:href="@{/admin/productInfo/addBrand}">브랜드</a>
	                            <a class="nav-link" th:href="@{/admin/productInfo/addItem}">품목</a>
	                            <a class="nav-link" th:href="@{/admin/productInfo/addModel}">모델</a>
	                            <a class="nav-link" th:href="@{/admin/productInfo/addBenefit}">전체혜택</a>
	                            <a class="nav-link" th:href="@{/admin/productInfo/addCategorySpec}">카테고리별/상세스펙</a>
	                            <a class="nav-link" th:href="@{/admin/productInfo/addModelSpec}">모델별/상세스펙</a>
	                        </nav>
	                    </aside>
	                    
	                    <!-- 본문 영역 -->
	                    <div class="col-lg-9">
	                    	<form id="addProductInfoForm" th:action="@{/admin/productInfo/addCategory}" method="post">	
	                       		<section class="content-body p-xl-4">
									<!-- 카테고리 정보 입력 -->                       		
	                                <div class="col-lg-12">
		                               	<div class="row mb-4">
		                                   	<label class="form-label fs-6" for="lgCategory">대분류</label>
		                                    <input list="lgCategoryList" id="lgCategory" name="lgCategory" class="form-control" placeholder="대분류를 선택하거나 입력해주세요" autocomplete="off"/>
		                              		<datalist id="lgCategoryList">
		                              			<option th:each="lg : ${lgCategoryList}" th:value="${lg.lgCategory}" th:attr="data-lg-category-no=${lg.lgCategoryNo}"></option>
		                              		</datalist>
		                               	</div>                                    
		                               	<div class="row mb-4">
		                                   	<label class="form-label fs-6" for="lgCategoryNo">대분류코드</label>
		                                    <input type="text" id="lgCategoryNo" name="lgCategoryNo" class="form-control" placeholder="대분류를 선택하거나 대분류코드를 입력해주세요" />
		                               	</div>
		                               	<div class="row mb-4">
		                                   	<label class="form-label fs-6" for="mdCategory">중분류</label>
		                                    <input list="mdCategoryList" id="mdCategory" name="mdCategory" class="form-control" placeholder="중분류를 선택하거나 입력해주세요" autocomplete="off"/>
		                               		<datalist id="mdCategoryList">
		                               			<option th:each="md : ${mdCategoryList}" th:value="${md.mdCategory}" th:attr="data-md-category-no=${md.mdCategoryNo}"></option>
		                               		</datalist>
		                               	</div>
		                               	<div class="row mb-4">
		                                   	<label class="form-label fs-6" for="mdCategoryNo">중분류코드</label>
		                                    <input type="text" id="mdCategoryNo" name="mdCategoryNo" class="form-control" placeholder="중분류를 선택하거나 중분류코드를 입력해주세요" />
		                               	</div>
		                               	<div class="row mb-4">
		                                   	<label class="form-label fs-6" for="smCategory">소분류</label>
		                                    <input type="text" id="smCategory" name="smCategory" class="form-control" placeholder="소분류를 입력해주세요" />
		                               	</div>
	                               	</div>                      
	                               	<br/>
	                               	<!-- 버튼 -->
	                               	<div class="d-grid gap-2 d-md-flex justify-content-md-end">
						                <div class="col-md-2 col-2 ms-auto">
						                    <button type="button" id="addCategoryBtn" 
						                    		class="btn btn-success w-100 rounded font-lg hover-up text-white justify-content-center fs-6" >등록</button>
						                </div>
						                <div class="col-md-2 col-2">
						                    <button type="reset" onclick="location.href='/admin/productInfo/categoryList'" 
						                    		class="btn btn-warning w-100 rounded font-lg hover-up text-white justify-content-center fs-6" >등록취소</button>
						                </div>
				             		</div>
								</section>
							</form>
						</div>
					</div>
			    </div>
			</div>
		</div>	
	</th:block>
</html>
