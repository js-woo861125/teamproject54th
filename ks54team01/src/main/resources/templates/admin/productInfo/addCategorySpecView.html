<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{admin/layout/default}">
	<!-- head 삽입공간 -->
	<head>
	</head>
	
	<th:block layout:fragment="jsFile">
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	</th:block>
	
	<th:block layout:fragment="jsScript">
		<script th:inline="javascript">
		const categoryList = JSON.parse(/*[[${categoryListJson}]]*/ '[]');
		</script>
		
		<script>
		$(document).ready(function () {
		    const $lg = $('#lgCategory');
		    const $md = $('#mdCategory');
		    const $sm = $('#smCategory');
		    // 대분류 로딩
		    const lgSet = [...new Set(categoryList.map(c => c.lgCategory))];
		    lgSet.forEach(lg => $lg.append(new Option(lg, lg)));

		    $lg.change(function () {
		        const selectedLg = $(this).val();
		        $md.empty().append(new Option('중분류를 선택해주세요', '')).prop('disabled', !selectedLg);
		        $sm.empty().append(new Option('소분류를 선택해주세요', '')).prop('disabled', true);

		        if (!selectedLg) return;

		        const mdSet = [...new Set(categoryList
		            .filter(c => c.lgCategory === selectedLg)
		            .map(c => c.mdCategory))];
		        mdSet.forEach(md => $md.append(new Option(md, md)));
		    });

		    $md.change(function () {
		        const selectedLg = $lg.val();
		        const selectedMd = $(this).val();
		        $sm.empty().append(new Option('소분류를 선택해주세요', '')).prop('disabled', !(selectedLg && selectedMd));

		        if (!(selectedLg && selectedMd)) return;

		        const smList = categoryList
		            .filter(c => c.lgCategory === selectedLg && c.mdCategory === selectedMd);
		        smList.forEach(c => $sm.append(new Option(c.smCategory, c.categoryNo)));
		    });
		});
	    
		$('#addCategorySpecBtn').click(function(){
			const specName = $('#specName').val();
			const categoryNo = $('#smCategory').val();
			// 유효성 체크
			if (!categoryNo) {
				Swal.fire('', '카테고리를 선택해주세요.', 'warning');
				$('#categoryNo').focus();
				return;
			}
			if(specName.trim().length === 0){
				Swal.fire('', '스펙명을 입력해주세요.', 'warning');
				$('#specName').focus();
				return ;
			}
			if (specName.length > 10) {
				Swal.fire('', '스펙명은 10자 이내로 입력해주세요.', 'warning');
				$('#specName').focus();
				return;
			}
			const validRegex = /^[가-힣a-zA-Z0-9.,~()+\/\s]+$/;
			if (!validRegex.test(specName)) {
				Swal.fire('', '특수문자는 . , ~ ( ) + / 만 사용 가능합니다.', 'warning');
				$('#specName').focus();
				return; 
			}
			// 중복 체크
			$.ajax({
				url : '/admin/productInfo/specNameCheck',
				method : 'post',
				data : {
					'specName': specName,
					'categoryNo' : categoryNo	
				},
				dataType : 'json'
			}).done(function(isDuplicate) {
				if(isDuplicate){
					Swal.fire('', '이미 등록된 스펙명 입니다.', 'warning');
					$('#specName').focus();
					return ;
				}
			
				$('#addProductInfoForm').submit();
		    }).fail(function(jqXHR, textStatus, error) {
		        console.log("에러 발생:", textStatus, error);
		        Swal.fire('', '스펙명 등록 중 오류가 발생했습니다.', 'error');
	    	});
		});
		</script>
		
	</th:block>
	
	<!-- 페이지 삽입공간 -->
	<th:block layout:fragment="content">
		<div class="content-header">
            <div>
                <h2 class="content-title card-title" th:text="${title}"></h2>
            </div>
        </div>
        <div class="d-flex align-items-center justify-content-center">
	        <div class="card mb-4 col-8">
		        <div class="card-body">
		            <div class="row gx-4">
		            	<!-- 사이드 메뉴 -->
		                <aside class="col-lg-3 border-end">
		                    <nav class="nav nav-pills flex-column mb-4">
		                        <a class="nav-link" th:href="@{/admin/productInfo/addCategory}">카테고리</a>
	                            <a class="nav-link" th:href="@{/admin/productInfo/addBrand}">브랜드</a>
	                            <a class="nav-link" th:href="@{/admin/productInfo/addItem}">품목</a>
	                            <a class="nav-link" th:href="@{/admin/productInfo/addModel}">모델</a>
	                            <a class="nav-link" th:href="@{/admin/productInfo/addBenefit}">전체혜택</a>
	                            <a class="nav-link active" aria-current="page" th:href="@{/admin/productInfo/addCategorySpec}">카테고리별/상세스펙</a>
	                            <a class="nav-link" th:href="@{/admin/productInfo/addModelSpec}">모델별/상세스펙</a>
		                    </nav>
		                </aside>
		                
		                <!-- 본문 영역 -->
		                <div class="col-lg-9">
		               		<form id="addProductInfoForm" th:action="@{/admin/productInfo/addCategorySpec}" method="post">
			                    <section class="content-body p-xl-4">
			                    	<!-- 스펙 정보 등록 -->
			                    	<div class="col-lg-12">
			                            <div class="mb-4">
			                                <label class="form-label fs-6" for="categoryNo">카테고리</label>
			                                <select class="form-select text-center fs-7" id="lgCategory"> 
			                                    <option value=""> 대분류를 선택해주세요 </option>
			                                </select>
		                                	<br />
			                                <select class="form-select text-center fs-7" id="mdCategory" disabled> 
			                                    <option value=""> 중분류를 선택해주세요 </option>
			                                </select>
		                                	<br />
			                                <select class="form-select text-center fs-7" id="smCategory" name="categoryNo" disabled>
			                                    <option value=""> 소분류를 선택해주세요 </option>
			                                </select>
			                            </div>
										<div class="mb-4">
										    <label class="form-label fs-6" for="specName">스펙명</label>
									    	<input type="text" id="specName" name="specName" class="form-control" placeholder="스펙명을 입력해주세요" />
										</div>
									</div>		
			                        <br />
			                        <!-- 버튼 -->
									<div class="d-grid gap-2 d-md-flex justify-content-md-end">
										<div class="col-md-2 col-2 ms-auto">
										    <button type="button" id="addCategorySpecBtn" 
										    		class="btn btn-success w-100 rounded font-lg hover-up text-white justify-content-center fs-6" >등록</button>
										</div>
										<div class="col-md-2 col-2">
										    <button type="reset" onclick="location.href='/admin/productInfo/categorySpecList'" 
										    		class="btn btn-warning w-100 rounded font-lg hover-up text-white justify-content-center fs-6" >등록취소</button>
										</div>
									</div>																	
			                    </section>
		                     </form>
		            	</div>         
		            </div>
		    	</div>
			</div>
		</div>	
	</th:block>
</html>
