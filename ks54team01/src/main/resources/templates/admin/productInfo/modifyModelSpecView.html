<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{admin/layout/default}">
	<!-- head 삽입공간 -->
	<head>
	</head>

	<th:block layout:fragment="jsFile">
		<script th:inline="javascript">
		const categoryList = JSON.parse(/*[[${categoryListJson}]]*/ '[]');
		const selectedLgCategory = /*[[${selectedLgCategory}]]*/ null;
		const selectedMdCategory = /*[[${selectedMdCategory}]]*/ null;
		const selectedSmCategory = /*[[${selectedSmCategory}]]*/ null;
		const selectedCategoryNo = /*[[${selectedCategoryNo}]]*/ null;
		
		</script>
		
		<script>
			$(document).ready(function () {
			    const $lg = $('#lgCategory');
			    const $md = $('#mdCategory');
			    const $sm = $('#smCategory');
			    // 대분류 로딩
			    const lgSet = [...new Set(categoryList.map(c => c.lgCategory))];
			    lgSet.forEach(lg => $lg.append(new Option(lg, lg)));
	
			    if (selectedLgCategory && selectedMdCategory && selectedSmCategory && selectedCategoryNo) {
			        $lg.val(selectedLgCategory).trigger('change');

			        const mdSet = [...new Set(categoryList
			            .filter(c => c.lgCategory === selectedLgCategory)
			            .map(c => c.mdCategory))];
			        mdSet.forEach(md => $md.append(new Option(md, md)));
			        $md.prop('disabled', false).val(selectedMdCategory).trigger('change');

			        const smList = categoryList.filter(c =>
			            c.lgCategory === selectedLgCategory &&
			            c.mdCategory === selectedMdCategory
			        );
			        smList.forEach(c => $sm.append(new Option(c.smCategory, c.categoryNo)));
			        $sm.prop('disabled', false).val(selectedCategoryNo);
			    }
			    
			    $lg.change(function () {
			        const selectedLg = $(this).val();
			        $md.empty().append(new Option('중분류를 선택해주세요', '')).prop('disabled', !selectedLg);
			        $sm.empty().append(new Option('소분류를 선택해주세요', '')).prop('disabled', true);
	
			        if (!selectedLg) return;
	
			        const mdSet = [...new Set(categoryList
			            .filter(c => c.lgCategory === selectedLg)
			            .map(c => c.mdCategory))];
			        mdSet.forEach(md => $md.append(new Option(md, md)));
			    });
	
			    $md.change(function () {
			        const selectedLg = $lg.val();
			        const selectedMd = $(this).val();
			        $sm.empty().append(new Option('소분류를 선택해주세요', '')).prop('disabled', !(selectedLg && selectedMd));
	
			        if (!(selectedLg && selectedMd)) return;
	
			        const smList = categoryList
			            .filter(c => c.lgCategory === selectedLg && c.mdCategory === selectedMd);
			        smList.forEach(c => $sm.append(new Option(c.smCategory, c.categoryNo)));
			    });	
			});	
			
			/**
			* 모델 + 스펙 + 상세스펙내용 중복체크
			*/
			$('#modifyModelSpecBtn').click(function(){
				const modelSpecName = $('#modelSpecName').val();
				const modelNo = $('#modelNo').val();
				const specNo = $('#specNo').val();
				
				if (!modelNo) {
					alert('모델을 선택해주세요');
					$('#modelNo').focus();
					return;
				}
				
				if (!specNo) {
					alert('스펙을 선택해주세요');
					$('#specNo').focus();
					return;
				}
				
				if(!modelSpecName){
					alert('상세스펙내용을 입력해주세요');
					$('#modelSpecName').focus();
					return ;
				}
				
				$.ajax({
					url : '/admin/productInfo/specContentCheck',
					method : 'post',
					data : {
						'modelSpecName': modelSpecName,
						'modelNo' : modelNo,
						'specNo' : specNo
					},
					dataType : 'json'
				}).done(function(isDuplicate) {
					if(isDuplicate){
						alert('이미 등록된 상세스펙내용 입니다.');
						$('#itemName').focus();
						return ;
					}
				
					$('#modifyProductInfoForm').submit();
			    }).fail(function(jqXHR, textStatus, error) {
			        console.log("에러 발생:", textStatus, error);
			        alert('품목명 확인 중 오류가 발생했습니다.');
			    });
			});
			/**
			* 카테고리 선택 시 해당 모델 조회
			*/
			$('#smCategory').change(function() {
			    const categoryNo = $(this).val();
			    $('#modelNo').empty().append('<option value="">모델을 선택해주세요</option>');
			
			    if (!categoryNo) return;

			    $.ajax({
			        url: '/admin/productInfo/modelListByCategory',
			        type: 'GET',
			        data: { categoryNo: categoryNo },
			        success: function(modelList) {
			        	console.log(modelList);
			            if (modelList && modelList.length > 0) {
			                $.each(modelList, function(i, model) {
			                    $('#modelNo').append('<option value="' + model.modelNo + '">' + "[" + model.itemName + "] " + model.modelName + '</option>');
			                });
			            } else {
			                $('#modelNo').append('<option value="">모델이 없습니다</option>');
			            }
			        },
			        error: function() {
			            alert('모델 목록을 불러오는 중 오류가 발생했습니다.');
			        }
			    });
			});
			/**
			* 모델 선택 시 해당 스펙 조회
			*/
			$('#modelNo').change(function() {
			    const modelNo = $(this).val();
			    const specNo = $(this).val();
			    $('#specNo').empty().append('<option value="">스펙을 선택해주세요</option>');
			    
			    if (modelNo) {
			        $.ajax({
			            url: '/admin/productInfo/specListByModel',
			            type: 'GET',
			            data: { modelNo: modelNo },
			            success: function(categorySpecList) {
			                console.log(categorySpecList); // 응답 데이터 확인
			                if (categorySpecList && categorySpecList.length > 0) {
			                	$.each(categorySpecList, function(idx, spec) {
			                	    $('#specNo').append('<option value="' + spec.specNo + '">' + spec.specName + '</option>');
			                	});
			                } else {
			                    $('#specNo').append('<option value="">스펙이 없습니다</option>');
			                }
			            },
			            error: function() {
			                alert('스펙 목록을 불러오는 중 오류가 발생했습니다.');
			            }
			        });
			    }
			});
		</script>	
	</th:block>
		
	<!-- 페이지 삽입공간 -->
	<th:block layout:fragment="content">
		<div class="content-header">
			<div>
				<h2 class="content-title card-title" th:text="${title}"></h2>
			</div>
		</div>
		<div class="d-flex align-items-center justify-content-center">
			<div class="card mb-4 col-7">
				<div class="card-body">
					<div class="row gx-4">
		
						<!-- 본문 영역 -->
						<div class="col-lg-12">
							<form id="modifyProductInfoForm" 
								  th:action="@{/admin/productInfo/modifyModelSpec}" 
								  method="post"
								  th:object="${modelSpecInfo}">
								<section class="content-body p-xl-4">
								
									<!-- Hidden -->
		                            <input type="hidden" th:field="*{modelSpecNo}" />
		                            <input type="hidden" th:field="*{managerId}" />
									
									<!-- 수정 영역 -->
									<div class="col-12">
										<div class="mb-4">
			                                <label class="form-label fs-6" for="categoryNo">카테고리</label>
			                                <select class="form-select text-center fs-7" id="lgCategory"> 
			                                    <option value=""> 대분류를 선택해주세요 </option>
			                                </select>
		                                	<br />
			                                <select class="form-select text-center fs-7" id="mdCategory" disabled> 
			                                    <option value=""> 중분류를 선택해주세요 </option>
			                                </select>
		                                	<br />
			                                <select class="form-select text-center fs-7" id="smCategory" disabled>
			                                    <option value=""> 소분류를 선택해주세요 </option>
			                                </select>
			                            </div>
										<div class="mb-4">
											<label class="form-label fs-6" for="modelNo">모델</label> 
											<select th:field="*{modelNo}" class="form-select text-center fs-7" id="modelNo" name="modelNo">
												<option value="">모델을 선택해주세요</option>
												<th:block th:if="${not #lists.isEmpty(modelList)}" th:each="l : ${modelList}">
					                         		<option th:value="${l.modelNo}" th:text="${'[' + l.itemName + '] ' + l.modelName}"></option>
					                        	</th:block>
											</select>
										</div>
										<div class="mb-4">
											<label class="form-label fs-6" for="specNo">스펙</label> 
											<select th:field="*{specNo}" class="form-select text-center fs-7" id="specNo" name="specNo">
												<option value="">스펙을 선택해주세요</option>
												<th:block th:if="${not #lists.isEmpty(categorySpecList)}" th:each="l : ${categorySpecList}">
					                         		<option th:value="${l.specNo}" th:text="${l.specName}"></option>
					                        	</th:block>
											</select>
										</div>
										<div class="mb-4">
											<label class="form-label fs-6" for="">상세스펙내용</label>
											<input type="text" th:field="*{modelSpecName}" id="modelSpecName" name="modelSpecName" class="form-control" placeholder="상세스펙내용을 입력해주세요" />
										</div>
									</div>
									<br/>
									<!-- 버튼 -->
									<div class="d-grid gap-2 d-md-flex justify-content-md-end">
										<div class="col-md-2 col-2 ms-auto">
											<button type="button" id="modifyModelSpecBtn" 
													class="btn btn-success w-100 rounded font-lg hover-up text-white justify-content-center fs-6">수정</button>
										</div>
										<div class="col-md-2 col-2">
											<button type="reset" onclick="location.href='/admin/productInfo/modelSpecList'" 
													class="btn btn-warning w-100 rounded font-lg hover-up text-white justify-content-center fs-6">수정취소</button>
										</div>
									</div>
								</section>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>	
	</th:block>

</html>
