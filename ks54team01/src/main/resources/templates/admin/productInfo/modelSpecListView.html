<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{admin/layout/default}">
	<!-- head 삽입공간 -->
	<head>
	</head>

	<th:block layout:fragment="jsFile">
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	</th:block>
	
	<th:block layout:fragment="jsScript">
		<script>
			/**
			* 사용유무 상태 변경
			*/
			$(document).on('change', '.toggle-use-status', function() {
				const $checkbox = $(this);
				const isChecked = $checkbox.is(':checked');
				const modelSpecNo = $checkbox.data('modelSpecNo');
				const $badge = $checkbox.closest('td').find('span.badge');				

				const useStatus = isChecked ? '사용중' : '사용불가';
				
				// 변경 시 확인메시지 띄우기
				const confirmMessage = isChecked
					? '사용중으로 상태를 변경하시겠습니까?'
					: '사용불가로 상태를 변경하시겠습니까?'				

				if(confirm(confirmMessage)) {
					$.ajax({
						url: '/admin/productInfo/updateModelSpec',
						method: 'post',
						data: {
							modelSpecNo: modelSpecNo,
							useStatus: useStatus
						},
						success: function(response) {
							// 상태 변경되었을 경우
							if(useStatus === '사용중') {
								$badge.text('사용중')
									  .removeClass('alert-danger')
									  .addClass('alert-success');
							} else {
								$badge.text('사용불가')
									  .removeClass('alert-success')
									  .addClass('alert-danger');
							}
						},
						error: function(jqXHR) {
							console.log(jqXHR.responseText);
							alert('상태 변경 중 오류가 발생했습니다');
							$checkbox.prop('checked', !isChecked);
						}
					});
				// 취소 시 원상 복구
				} else {
					$checkbox.prop('checked', !isChecked);	
				}			
			});
			
			/**
			* 모델별/상세스펙 삭제
			*/
			$('.remove-btn').click(e => {
				e.preventDefault();
				const modelSpecNo = $(e.target).data('modelSpecNo');
				
				Swal.fire({
					  title: "상세스펙 삭제",
					  text: "상세스펙을 삭제하시겠습니까?",
					  icon: "warning",
					  showCancelButton: true,
					  confirmButtonColor: "#3085d6",
					  cancelButtonColor: "#d33",
					  confirmButtonText: "삭제"
					}).then((result) => {
					  if (result.isConfirmed) {
						$.ajax({  
				            url: '/admin/productInfo/removeModelSpec',
				            method: 'post',
				            data: { 'modelSpecNo': modelSpecNo },
				            dataType: 'json',
				            success: function(response) {
							    Swal.fire({
							      title: "삭제 완료",
							      text: "삭제되었습니다.",
							      icon: "success"
							    }).then(() => {
							    	location.reload();
		                        });
		                    }
		                });
		            }
		        });
		    });	
		</script>	
	</th:block>
	
	<th:block layout:fragment="content">
		<div class="content-header">
			<div>
				<h2 class="content-title card-title" th:text="${title}"></h2>
			</div>
		</div>
		<div class="card mb-4 col-12">
			<header class="card-header">
				<form th:action="@{/admin/productInfo/searchModelSpec}" method="get">
					<div class="row gx-3">
	                   <div class="col-lg-2 col-md-3 col-12">
	                       <select class="form-select" name="searchKey">
	                           <option value="modelSpecName" th:selected="${searchKey == 'modelSpecName'}">상세스펙내용</option>
	                           <option value="modelInfo.modelName" th:selected="${searchKey == 'modelInfo.modelName'}">모델</option>
	                           <option value="specInfo.specName" th:selected="${searchKey == 'specInfo.specName'}">스펙</option>
	                       </select>
	                   </div>
	                   <div class="col-lg-4 col-md-5">
	                       <input type="text" name="searchValue" th:value="${searchValue}" placeholder="검색어를 입력해주세요" class="form-control" />
	                   </div>
	                   <div class="col-lg-1 col-md-1 me-auto">
						   <button type="submit" class="form-control btn btn-primary p-0 justify-content-center">검색</button>                   
	                   </div>
	               </div>
				</form>
			</header>		
			<div class="card-body">
				<div class="row gx-4">
					<!-- 사이드 메뉴 -->
					<aside class="col-lg-2 border-end">
						<nav class="nav nav-pills flex-column mb-4">
							<a class="nav-link" th:href="@{/admin/productInfo/categoryList}">카테고리</a>
							<a class="nav-link" th:href="@{/admin/productInfo/brandList}">브랜드</a>
							<a class="nav-link" th:href="@{/admin/productInfo/itemList}">품목</a>
							<a class="nav-link" th:href="@{/admin/productInfo/modelList}">모델</a>
							<a class="nav-link" th:href="@{/admin/productInfo/benefitList}">전체혜택</a>
							<a class="nav-link" th:href="@{/admin/productInfo/categorySpecList}">카테고리별/상세스펙</a>
							<a class="nav-link active" aria-current="page" th:href="@{/admin/productInfo/modelSpecList}">모델별/상세스펙</a>
						</nav>
					</aside>
					
					<!-- 모델별 상세스펙 목록 -->
					<div class="col-lg-10">
						<form id="productInfoListForm" th:action="@{/admin/productInfo/modelSpecList}" method="post">
							<div class="table-responsive">
								<table class="table table-hover text-center">
									<thead>
										<tr>
											<th>No.</th>
											<th>모델별 상세스펙코드</th>
											<th>모델</th>
											<th>스펙</th>
											<th>상세스펙내용</th>
											<th>사용유무</th>
											<th>등록일자</th>
											<th>수정일자</th>
											<th>수정</th>
										</tr>
									</thead>
									<tbody>
										<tr th:if="${!#lists.isEmpty(modelSpecList)}"
											th:each="l, index : ${modelSpecList}">
											<td th:text="${index.count}">1</td>
											<td th:text="${l.modelSpecNo}">spec_content_1</td>
											<td th:text="${l.modelInfo.modelName}">라온 LED 저상형 침대 SS</td>
											<td th:text="${l.specInfo.specName}">침대사이즈</td>
											<td th:text="${l.modelSpecName}">1220x2220x610 mm</td>
	                                        <td>
	                                        	<div class="d-flex align-items-center justify-content-center gap-2">
	                                        		<div class="form-check form-switch m-0">
	                                        			<input class="form-check-input toggle-use-status" type="checkbox" th:checked="${l.useStatus == '사용중'}" th:data-model-spec-no="${l.modelSpecNo}" />
													</div>
		                                            <span class="badge rounded-pill"
		                                                  th:classappend="${l.useStatus == '사용중'} ? 'alert-success' : 'alert-danger'"
		                                                  th:text="${l.useStatus}">사용중</span>
	                                        	</div>          
	                                        </td>
											<td th:text="${l.modelSpecRegDate}">2023-01-01 10:00:00</td>
											<td th:text="${l.modelSpecRevDate}">2023-01-01 10:00:00</td>
											<td>
												<div class="dropdown">
													<a href="#" data-bs-toggle="dropdown" class="btn btn-light rounded btn-sm font-sm"> 
														<i class="material-icons md-more_horiz"></i>
													</a>
													
													<div class="dropdown-menu">
														<a class="dropdown-item" th:href="@{/admin/productInfo/modifyModelSpec(modelSpecNo=${l.modelSpecNo})}">수정</a> 
														<a class="dropdown-item text-danger remove-btn" href="#" th:data-model-spec-no=${l.modelSpecNo}>삭제</a>
													</div>
												</div> 
											</td>
										</tr>
										<tr th:unless="${not #lists.isEmpty(modelSpecList)}">
											<td colspan="12">등록된 상세스펙내용이 없습니다.</td>
										</tr>
									</tbody>
								</table>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</th:block>
</html>
