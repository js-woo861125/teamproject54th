<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{admin/layout/default}">
	<!-- head 삽입공간 -->
	<head>
	</head>
	
	<th:block layout:fragment="jsFile">
	</th:block>
	
	<th:block layout:fragment="content">
		<div class="content-header">
			<div>
				<h2 class="content-title card-title" th:text="${title}"></h2>
			</div>
		</div>
		<div class="card mb-4 col-12">
			<div class="card-body">
				<div class="row gx-4">
					<!-- 사이드 메뉴 -->
					<aside class="col-lg-2 border-end">
						<nav class="nav nav-pills flex-column mb-4">
							<a class="nav-link" th:href="@{/admin/productInfo/categoryList}">카테고리</a>
							<a class="nav-link" th:href="@{/admin/productInfo/brandList}">브랜드</a>
							<a class="nav-link" th:href="@{/admin/productInfo/itemList}">품목</a>
							<a class="nav-link" th:href="@{/admin/productInfo/modelList}">모델</a>
							<a class="nav-link" th:href="@{/admin/productInfo/benefitList}">전체혜택</a>
							<a class="nav-link" th:href="@{/admin/productInfo/categorySpecList}">카테고리별/상세스펙</a>
							<a class="nav-link active" aria-current="page" th:href="@{/admin/productInfo/modelSpecList}">모델별/상세스펙</a>
						</nav>
					</aside>
					
					<!-- 모델별 상세스펙 목록 -->
					<div class="col-lg-10">
						<form id="productInfoListForm" th:action="@{/admin/productInfo/modelSpecList}" method="post">
							<div class="table-responsive">
								<table class="table table-hover text-center">
									<thead>
										<tr>
											<th>No.</th>
											<th>모델별 상세스펙코드</th>
											<th>상품명</th>
											<th>모델명</th>
											<th>스펙명</th>
											<th>상세스펙내용</th>
											<th>사용유무</th>
											<th>수정/삭제</th>
										</tr>
									</thead>
									<tbody>
										<tr>
											<td>1</td>
											<td>spec_content_1</td>
											<td>라온 LED 저상형 침대 SS</td>
											<td>라온 LED 저상형 침대 SS</td>
											<td>침대사이즈</td>
											<td>1220x2220x610 mm</td>
											<td class="col-lg-1 col-sm-2 col-4 col-status"><span
												class="badge rounded-pill alert-success">사용중</span></td>
											<td>
												<div class="dropdown">
													<a href="#" data-bs-toggle="dropdown"
														class="btn btn-light rounded btn-sm font-sm"> <i
														class="material-icons md-more_horiz"></i>
													</a>
													<div class="dropdown-menu">
														<a class="dropdown-item"
															href="54.modifyCategory(카테고리수정).html">수정</a> <a
															class="dropdown-item text-danger" href="#">삭제</a>
													</div>
												</div> 
											</td>
										</tr>
										<tr th:unless="${not #lists.isEmpty(modelList)}">
											<td colspan="12">등록된 모델이 없습니다.</td>
										</tr>
									</tbody>
								</table>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</th:block>
</html>
