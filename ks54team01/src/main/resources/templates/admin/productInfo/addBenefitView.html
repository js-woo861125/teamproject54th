<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{admin/layout/default}">
	<!-- head 삽입공간 -->
	<head>
	</head>
	
	<th:block layout:fragment="jsFile">
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	</th:block>
	
	<th:block layout:fragment="jsScript">
		<script>
			$('#addBenefitBtn').click(function(){
				const benefitName = $('#benefitName').val();
				// 유효성 체크
				if (benefitName.trim().length === 0) {
					Swal.fire('', '혜택명을 입력해주세요.', 'warning');
					$('#benefitName').focus();
					return;
				}
				if (benefitName.length > 20) {
					Swal.fire('', '혜택명은 20자 이내로 입력해주세요.', 'warning');
					$('#benefitName').focus();
					return;
				}
				const validRegex = /^[가-힣a-zA-Z0-9.,~()+\/\s]+$/;
				if (!validRegex.test(benefitName)) {
					Swal.fire('', '특수문자는 . , ~ ( ) + / 만 사용 가능합니다.', 'warning');
					$('#benefitName').focus();
					return; 
				}
				// 중복 체크
				$.ajax({
					url : '/admin/productInfo/benefitNameCheck',
					method : 'post',
					data : {'benefitName': benefitName},
					dataType : 'json'
				}).done(function(isDuplicate) {
					if(isDuplicate){
						Swal.fire('', '이미 등록된 혜택명 입니다.', 'warning');
						$('#benefitName').focus();
						return ;
					}
					$('#addProductInfoForm').submit();
			    }).fail(function(jqXHR, textStatus, error) {
			        console.log("에러 발생:", textStatus, error);
			        Swal.fire('', '혜택명 등록 중 오류가 발생했습니다.', 'error');
			    });
			});
		</script>
	</th:block>
	
	<!-- 페이지 삽입공간 -->
	<th:block layout:fragment="content">
		<div class="content-header">
            <div>
                <h2 class="content-title card-title" th:text="${title}"></h2>
            </div>
        </div>
        <div class="d-flex align-items-center justify-content-center">
	        <div class="card mb-4 col-8">
		        <div class="card-body">
		            <div class="row gx-4">
		            	<!-- 사이드 메뉴 -->
		                <aside class="col-lg-3 border-end">
		                    <nav class="nav nav-pills flex-column mb-4">
		                        <a class="nav-link" th:href="@{/admin/productInfo/addCategory}">카테고리</a>
		                        <a class="nav-link" th:href="@{/admin/productInfo/addBrand}">브랜드</a>
		                        <a class="nav-link" th:href="@{/admin/productInfo/addItem}">품목</a>
		                        <a class="nav-link" th:href="@{/admin/productInfo/addModel}">모델</a>
		                        <a class="nav-link active" aria-current="page" th:href="@{/admin/productInfo/addBenefit}">전체혜택</a>
		                        <a class="nav-link" th:href="@{/admin/productInfo/addCategorySpec}">카테고리별/상세스펙</a>
		                        <a class="nav-link" th:href="@{/admin/productInfo/addModelSpec}">모델별/상세스펙</a>
		                    </nav>
		                </aside>
		                
		                <!-- 본문 영역 -->
		                <div class="col-lg-9">
		                	<form id="addProductInfoForm" th:action="@{/admin/productInfo/addBenefit}" method="post">
			                    <section class="content-body p-xl-4">
			                    	<!-- 혜택 정보 등록 -->
		                            <div class="col-12">
			                            <div class="mb-4">
			                                <label class="form-label fs-6" for="benefitName">혜택명</label>
			                                <div class="col-lg-12">
			                                    <input type="text" id="benefitName" name="benefitName" class="form-control" placeholder="혜택명을 입력해주세요" />
			                                </div>
			                            </div>																		
		                            </div>                   
			                        <br/>
			                        <!-- 버튼 -->
									<div class="d-grid gap-2 d-md-flex justify-content-md-end">
										<div class="col-md-2 col-2 ms-auto">
										    <button type="button" id="addBenefitBtn" 
										    		class="btn btn-success w-100 rounded font-lg hover-up text-white justify-content-center fs-6" >등록</button>
										</div>
										<div class="col-md-2 col-2">
										    <button type="reset" onclick="location.href='/admin/productInfo/benefitList'" 
										    		class="btn btn-warning w-100 rounded font-lg hover-up text-white justify-content-center fs-6" >등록취소</button>
										</div>
									</div>
			                    </section>
		                     </form>
		                </div>
		            </div>
		    	</div>
			</div>
		</div>	
	</th:block>
</html>
