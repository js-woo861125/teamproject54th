<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{enterprise/layout/default}">
	<!-- head 삽입공간 -->
	<head>
	</head>
	
	<th:block layout:fragment="jsFile">
		<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
	</th:block>

    <th:block layout:fragment="content">
    <div class="content-header">
        <div>
            <h2 class="content-title card-title" th:text="${title}"></h2>
        </div>
        <div>
            <a th:href="@{/enterprise/product/addProduct}"></a>
        </div>
    </div>
    <div class="card mb-4">
        <header class="card-header">
            <!-- 검색 폼 -->
            <form th:action="@{/enterprise/product/productList}" method="get" class="w-100">
                <div class="row align-items-center g-2">
                    <div class="col-lg-2">
                        <select class="form-select form-select-sm" name="searchKey">
                            <option th:value="productName" th:selected="${searchKey == 'productName'}">상품명</option>
                            <option th:value="brandName" th:selected="${searchKey == 'brandName'}">브랜드</option>
                        </select>
                    </div>
                    <div class="col-lg-3">
                        <input type="text" name="searchValue" th:value="${searchValue}" class="form-control form-control-sm" placeholder="검색어 입력" />
                    </div>
                    <div class="col-lg-2">
                        <select class="form-select form-select-sm" name="categoryNo">
                            <option th:value="''" th:selected="${categoryNo == null or categoryNo == ''}">전체 카테고리</option>
                            <option th:each="cat : ${categoryList}" th:value="${cat.categoryNo}" th:text="${cat.smCategory}" th:selected="${categoryNo == cat.categoryNo}"></option>
                        </select>
                    </div>
                    <div class="col-lg-2">
                        <select class="form-select form-select-sm" name="status">
                            <option th:value="''" th:selected="${status == null or status == ''}">전체 상태</option>
                            <option th:value="활성화" th:selected="${status == '활성화'}">활성화</option>
                            <option th:value="비활성화" th:selected="${status == '비활성화'}">비활성화</option>
                        </select>
                    </div>
                    <div class="col-lg-1">
                        <button type="submit" class="btn btn-primary btn-sm w-100">검색</button>
                    </div>
                </div>
            </form>
        </header>
            <!-- card-header end// -->
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr class=text-center>
                                <th>상품명</th>
                                <th>상품이미지</th>                            
                                <th>모델명</th>
                                <th>등록일자</th>
                                <th>수정일자</th>
                                <th>상품등록</th>
                            </tr>
                        </thead>
                        <tbody class="text-center">
                        <th:block th:if="${!#lists.isEmpty(getProductList)}" th:each="l : ${getProductList}">
                            <tr>
                                <td><a class="fw-bold" th:text="${l.productName}"></a></td>
                               <td>
								    <a class="item" href="#">
								        <div class="img">
								            <img th:if="${l.productImage != null}" 
								                 th:src="${l.productImage}" 
								                 class="img-sm img-main" 
								                 alt="상품이미지" />
								               
								            <div th:if="${l.productImage == null}" 
								                 class="img-sm img-main bg-light d-inline-block" 
								                 style="width: 100px; height: 100px;"></div>
								        </div>							       
								    </a>
								</td>
                                <td th:text="${l.modelName}">모델명</td>                               
                                <td th:text="${l.registerDate}">2023-01-01 13:00:00</td>
                                <td th:text="${l.revisionDate}">2023-01-01 13:00:00</td>
                                <td class="col-lg-2 col-sm-2 col-4 col-action">
                                    <a th:href="@{/enterprise/product/addProduct(productNo=${l.productNo})}" class="btn btn-sm font-sm rounded btn-brand"> <i class="material-icons md-edit"></i> 등록 </a>
                                </td>
                            </tr>
                          </th:block>
                          	 <tr th:unless="${!#lists.isEmpty(entList)}">
							 	<td colspan="11">등록없음</td>
							 </tr>  
                        </tbody>
                    </table>
                </div>
                <!-- table-responsive //end -->
            </div>
            <!-- card-body end// -->
        </div>
   </th:block> 
        <!-- card end// -->
        
 
    <!-- content-main end// -->

        <script src="assets/js/vendors/jquery-3.6.0.min.js"></script>
        <script src="assets/js/vendors/bootstrap.bundle.min.js"></script>
        <script src="assets/js/vendors/select2.min.js"></script>
        <script src="assets/js/vendors/perfect-scrollbar.js"></script>
        <script src="assets/js/vendors/jquery.fullscreen.min.js"></script>
        <!-- Main Script -->
        <script src="assets/js/main.js?v=1.1" type="text/javascript"></script>
    </body>
</html>
