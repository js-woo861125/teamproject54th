<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{enterprise/layout/default}">
	<!-- head 삽입공간 -->
	<head>
	</head>
	
	<th:block layout:fragment="jsFile">
	</th:block>
	
	<th:block layout:fragment="jsScript">
		<script type="text/javascript">
			$(function () {
				$('.departBtn').click(function (e) {
					e.preventDefault();
				
					const $btn = $(this);
					const $row = $btn.closest('tr');
					const departDate = $row.find('.departDate').text().trim();
				
					if (departDate !== "") {
						alert('이미 배송을 시작했습니다.');
						return ;
					}
				
					$btn.closest('form').submit();
				});
				
				
				$('.compBtn').click(function (e) {
					e.preventDefault();
				
					const $btn = $(this);
					const $row = $btn.closest('tr');
					const departDate = $row.find('.departDate').text().trim();
					const arriveDate = $row.find('.arriveDate').text().trim();
				
					if (departDate === "") {
						alert('아직 배송을 안했습니다.');
						return ;
					}else if(arriveDate !== ""){
						alert('이미 배송을 완료했습니다.');
						
						return ;
					}
				
					$btn.closest('form').submit();
				});
				
				
				/* 페이지이동 */
				$('a.page-num').click(function(e){
					e.preventDefault();
					const currentPage = $(this).data('currentPage');
			
					const url = new URL(window.location.href);
					const params = url.searchParams;
			
					// 기존 파라미터 유지하면서 currentPage만 갱신
					params.set('currentPage', currentPage);
			
					window.location.href = `${url.pathname}?${params.toString()}`;
				});
			});
			
			
			
			
		</script>
	</th:block>
	
	<th:block layout:fragment="content">
		<div class="content-header">
			<div>
				<h2 class="content-title card-title" th:text="${title}">배송정보(관리자)</h2>
			</div>
	
		</div>
		<div class="card mb-4">
			<header class="card-header">
				<form th:action="@{/enterprise/delivery/deliveryList}" method="get">
					<div class="row gx-3">
	                   <div class="col-lg-2 col-md-3 col-12">
	                       <select class="form-select" name="searchKey">
	                           <option value="delProgress" th:selected="${searchKey == 'delProgress'}">배송진행상황</option>
	                       </select>
	                   </div>
	                   <div class="col-lg-4 col-md-5">
	                       <input type="text" name="searchValue" th:value="${searchValue}" placeholder="검색어를 입력해주세요" class="form-control" />
	                   </div>
	                   <div class="col-lg-1 col-md-1 me-auto">
						   <button type="submit" class="form-control btn btn-primary p-0 justify-content-center">검색</button>                   
	                   </div>
	                  
	               </div>
				</form>
			</header>
			<!-- card-header end// -->
			<div class="card-body">
				<div class="table-responsive">
					<table class="table align-middle table-nowrap mb-0">
						<thead class="table-light text-center">
							<tr>
								<th class="align-middle" scope="col">상품코드</th>
								<th class="align-middle" scope="col">수령인명</th>
								<th class="align-middle" scope="col">택배사</th>
								<th class="align-middle" scope="col">주소</th>
								<th class="align-middle" scope="col">상세주소</th>
								<th class="align-middle" scope="col">요청사항</th>
								<th class="align-middle" scope="col">배송진행상황</th>
								<th class="align-middle" scope="col">등록일</th>
								<th class="align-middle" scope="col">출발일</th>
								<th class="align-middle" scope="col">배송완료일</th>
								<th class="align-middle" scope="col">배송시작</th>
								<th class="align-middle" scope="col">배송완료</th>
							</tr>
						</thead>
						<tbody class="text-center">
							<tr th:if="${!#lists.isEmpty(deliveryList)}" th:each="l : ${deliveryList}">
								<td th:text="${l.sellProdNo}">상품코드</td>
								<td th:text="${l.recipientNm}">Marvin McKinney</td>
								<td th:text="${l.delCompany}">직접배송</td>
								<td th:text="${l.delAddr}">주소</td>
								<td th:text="${l.delDaddr}">상세주소</td>
								<td th:text="${l.delRequest}">문앞</td>
								<td th:text="${l.delProgress}">배송완료</td>
								<td th:text="${l.regDate}">03.12.2020</td>
								<td th:text="${l.departDate}" class="departDate">03.13.2020</td>
								<td th:text="${l.arriveDate}" class="arriveDate">03.14.2020</td>
								<td>
									<form th:action="@{/enterprise/delivery/departDelivery}" method="post">
										<input type="hidden" name="delInfoNo" th:value="${l.delInfoNo}" />
										<button type="submit" class="departBtn btn btn-sm font-sm btn-light rounded">출발</button>
									</form>
								</td>
								<td>
									<form th:action="@{/enterprise/delivery/completeDelivery}" method="post">
										<input type="hidden" name="delInfoNo" th:value="${l.delInfoNo}" />
										<button type="submit" class="compBtn btn btn-sm font-sm rounded btn-brand">완료</button>
									</form>
								</td>
							</tr>
							<tr th:unless="${!#lists.isEmpty(deliveryList)}">
                          		<td colspan="12">등록없음</td>
                            </tr>																						
	
						</tbody>
					</table>
				</div>
				<!-- table-responsive //end -->
			</div>
			<!-- card-body end// -->
		</div>
		<!-- card end// -->
		<div class="pagination-area mt-30 mb-50">
			<nav aria-label="Page navigation example">
				<ul class="pagination justify-content-center">
					<!-- 이전페이지 이동 -->
					<li id="prev-page" class="page-item" th:classappend="${startPageNum < 10} ? 'disabled'">
						<a class="page-link"
						   th:href="@{/enterprise/delivery/departDelivery(currentPage=${startPageNum - 1}, searchKey=${searchKey}, searchValue=${searchValue})}">
						   <i class="material-icons md-first_page mt-5"></i>
						</a>
					</li>
					<!-- 페이지 이동  -->
					<th:block th:each="num : ${#numbers.sequence(startPageNum, endPageNum)}" th:if="${contentRowCount > 0}">
						<li class="page-item" th:classappend="${num eq currentPage} ? 'active disabled'">
							<a class="page-link page-num"
							   href="#"
							   th:text="${num < 10 ? '0' + num : num}"
							   th:data-current-page="${num}">01</a>
						</li>
					</th:block>
					<!-- 다음페이지 이동 -->
					<li id="next-page" class="page-item" th:classappend="${(startPageNum + 10) > lastPage} ? 'disabled'">
						<a class="page-link"
						   th:href="@{/enterprise/delivery/departDelivery(currentPage=${endPageNum + 1}, searchKey=${searchKey}, searchValue=${searchValue})}">
						   <i class="material-icons md-last_page" style="margin-top : 5px;"></i>
						</a>
					</li>
				</ul>
			</nav>
		</div>
	</th:block>
</html>
