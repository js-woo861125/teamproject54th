<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{enterprise/layout/default}">
	<!-- head 삽입공간 -->
	<head>
	</head>
	
	<th:block layout:fragment="jsFile">
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	</th:block>
	
	<th:block layout:fragment="jsScript">
		<script type="text/javascript">
			$(function() {
				$('.approveBtn').click(function(){
					const orderId = $(this).attr('data-order-id');
					const paymentKey = $(this).attr('data-payment-key');
					
					Swal.fire({
						title: '환불 승인',
						text: '정말로 이 요청을 승인하고 환불하시겠습니까?',
						icon: 'warning',
						showCancelButton: true,
						confirmButtonText: '예',
						cancelButtonText: '아니오'
					}).then((result) => {
						if(result.isConfirmed) {
							$.ajax({
								type: 'POST',
								url: '/enterprise/refund/approve',
								data: {
									orderId: orderId,
									paymentKey: paymentKey
								},
								success: function(res) {
									Swal.fire('완료', res.message, 'success').then(() => {
										location.reload();
									});
								},
								error: function() {
									Swal.fire('오류', '환불 처리 중 문제가 발생했습니다.', 'error');
								}
							});
						}
					});
				});
			});
		
		
		</script>
	</th:block>
	
	<th:block layout:fragment="content">
		<div class="content-header">
			<div>
				<h2 class="content-title card-title" th:text="${title}">환불요청</h2>
			</div>
	
		</div>
		<div class="card mb-4">
			<header class="card-header">
				<div class="row gx-3">
					<div class="col-lg-2 col-md-3 col-12">
						<select class="form-select" name="searchKey">
							<option value="delCompany" th:selected="${searchKey == 'delCompany'}">택배사</option>
							<option value="recipientNm" th:selected="${searchKey == 'recipientNm'}">수령인명</option>
						</select>
					</div>
					<div class="col-lg-4 col-md-5">
						<input type="text" name="searchValue" th:value="${searchValue}" placeholder="검색어를 입력해주세요" class="form-control" />
					</div>
					<div class="col-lg-1 col-md-1 me-auto">
						<button type="submit" class="form-control btn btn-primary p-0 justify-content-center">검색</button>                   
					</div>
				</div>
			</header>
			<!-- card-header end// -->
			<div class="card-body">
				<div class="table-responsive">
					<table class="table align-middle table-nowrap mb-0">
						<thead class="table-light text-center">
							<tr>
								<th class="align-middle" scope="col">주문자ID</th>
								<th class="align-middle" scope="col">상품명</th>
								<th class="align-middle" scope="col">환불사유</th>
								<th class="align-middle" scope="col">환불신청날짜</th>
								<th class="align-middle" scope="col">요청상태</th>
								<th class="align-middle" scope="col">결과통보일</th>
								<th class="align-middle" scope="col">설정</th>								
							</tr>
						</thead>
						<tbody class="text-center">
							<tr th:if="${!#lists.isEmpty(refundList)}" th:each="l : ${refundList}">
								<td><p th:text="${l.custId}"></p></td>
								<td><p th:text="${l.prodNm}"></p></td>
								<td><p th:text="${l.refundReason}"></p></td>
								<td><p th:text="${l.refundDate}"></p></td>
								<td><p th:text="${l.requestStatus}"></p></td>
								<td><p th:text="${l.reviewNotificationDate}"></p></td>
								<td>
									<button type="button" class="btn btn-xs approveBtn" th:data-order-id="${l.orderId}" th:data-payment-key="${l.paymentKey}">승인</button>
									<button type="button" class="btn btn-xs">거부</button>
								</td>
							</tr>
							<tr th:unless="${!#lists.isEmpty(refundList)}">
								<td colspan="12"><p>환불 요청 없음</p></td>
							</tr>
						</tbody>
					</table>
				</div>
				<!-- table-responsive //end -->
			</div>
			<!-- card-body end// -->
		</div>
		<!-- card end// -->
		
	</th:block>
</html>
